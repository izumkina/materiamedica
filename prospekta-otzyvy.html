le at 80% 18%,#dcebf1 0 12%,transparent 33%),radial-gradient(circle at 15% 80%,#e6eef1 0 10%,transparent 32%),#f4f7f8}\r\nhtml[data-design=\"fresh\"] .login-card{border-color:#dae5e9;background:#fff;box-shadow:0 24px 60px rgba(24,57,74,.1)}\r\nhtml[data-design=\"fresh\"] .login-logo .logo-boost{color:#317d9e}\r\nhtml[data-design=\"fresh\"] .form-input{background:#f5f9fa;border-color:#dae5e9}\r\nhtml[data-design=\"fresh\"] .btn-login{background:#317d9e}\r\n@media(max-width:760px){\r\n    html[data-design=\"fresh\"] .hero.hero-banner{background-image:linear-gradient(90deg,rgba(16,49,70,.86),rgba(31,72,92,.57)),var(--banner-image)}\r\n    html[data-design=\"fresh\"] .hero-banner--economy{--banner-image:url('../img/banners/unit-economics.webp?v=3')}\r\n    html[data-design=\"fresh\"] .hero-banner--media{--banner-image:url('../img/banners/media-planning.webp?v=3')}\r\n    html[data-design=\"fresh\"] .hero-banner--training{--banner-image:url('../img/banners/training.webp?v=3')}\r\n    html[data-design=\"fresh\"] .hero-banner--reports{--banner-image:url('../img/banners/reports.webp?v=3')}\r\n    html[data-design=\"fresh\"] .hero-banner--shelf{--banner-image:url('../img/banners/online-shelf.webp?v=3')}\r\n}\r\n","js/theme.js":"/**\r\n * ICOMBOOST - Theme toggle (dark / light)\r\n */\r\n(function () {\r\n    const STORAGE_KEY = 'icom_theme';\r\n\r\n    // Применить тему из localStorage при загрузке (до рендера)\r\n    const saved = localStorage.getItem(STORAGE_KEY);\r\n    if (saved) {\r\n        document.documentElement.setAttribute('data-theme', saved);\r\n    } else {\r\n        document.documentElement.setAttribute('data-theme', 'light');\r\n    }\r\n\r\n    // Обновить иконку после загрузки DOM\r\n    document.addEventListener('DOMContentLoaded', () =\u003E updateIcon());\r\n\r\n    window.toggleTheme = function () {\r\n        const current = document.documentElement.getAttribute('data-theme') || 'light';\r\n        const next = current === 'dark' ? 'light' : 'dark';\r\n        document.documentElement.setAttribute('data-theme', next);\r\n        localStorage.setItem(STORAGE_KEY, next);\r\n        updateIcon();\r\n\r\n        // Колбэк для Chart.js и прочих компонентов\r\n        if (typeof onThemeChange === 'function') {\r\n            onThemeChange(next);\r\n        }\r\n    };\r\n\r\n    function updateIcon() {\r\n        const theme = document.documentElement.getAttribute('data-theme') || 'light';\r\n        document.querySelectorAll('.theme-icon').forEach(el =\u003E {\r\n            el.textContent = theme === 'dark' ? '☀️' : '🌙';\r\n        });\r\n    }\r\n})();\r\n","js/ui.js":"/**\r\n * ICOMBOOST - UI Utilities\r\n * Toast notifications, sparklines, skeleton loading\r\n */\r\n\r\n// =========================================================\r\n// TOAST NOTIFICATIONS\r\n// =========================================================\r\nconst Toast = {\r\n    container: null,\r\n\r\n    init() {\r\n        if (this.container) return;\r\n        this.container = document.createElement('div');\r\n        this.container.className = 'toast-container';\r\n        document.body.appendChild(this.container);\r\n    },\r\n\r\n    show(message, type = 'info', duration = 5000) {\r\n        this.init();\r\n\r\n        const icons = {\r\n            success: '✓',\r\n            error: '✗',\r\n            warning: '⚠',\r\n            info: 'ℹ'\r\n        };\r\n\r\n        const toast = document.createElement('div');\r\n        toast.className = `toast toast-${type}`;\r\n        toast.innerHTML = `\r\n            \u003Cspan class=\"toast-icon\"\u003E${icons[type] || 'ℹ'}\u003C/span\u003E\r\n            \u003Cdiv class=\"toast-content\"\u003E${message}\u003C/div\u003E\r\n            \u003Cbutton class=\"toast-close\" onclick=\"this.parentElement.remove()\"\u003E×\u003C/button\u003E\r\n        `;\r\n\r\n        this.container.appendChild(toast);\r\n\r\n        if (duration \u003E 0) {\r\n            setTimeout(() =\u003E {\r\n                toast.classList.add('toast-out');\r\n                setTimeout(() =\u003E toast.remove(), 300);\r\n            }, duration);\r\n        }\r\n\r\n        return toast;\r\n    },\r\n\r\n    success(msg, dur) { return this.show(msg, 'success', dur); },\r\n    error(msg, dur) { return this.show(msg, 'error', dur); },\r\n    warning(msg, dur) { return this.show(msg, 'warning', dur); },\r\n    info(msg, dur) { return this.show(msg, 'info', dur); }\r\n};\r\n\r\n// =========================================================\r\n// SPARKLINE GENERATOR\r\n// =========================================================\r\nconst Sparkline = {\r\n    generate(data, color = 'var(--accent)', height = 30) {\r\n        if (!data || data.length \u003C 2) return '';\r\n\r\n        // null - это «в этот день метрики не существует», а не ноль.\r\n        //\r\n        // Раньше пропуск превращался в 0 (parseFloat(null) || 0), и на\r\n        // производных метриках это рисовало обвал: день без заказов давал CPO\r\n        // ноль, день без выручки - ДРР ноль. График показывал падение там, где\r\n        // просто нет знаменателя. Теперь пропуски рвут линию, а масштаб\r\n        // считается только по существующим точкам.\r\n        const values = data.map(d =\u003E {\r\n            if (d === null || d === undefined || d === '') return null;\r\n            const v = parseFloat(d);\r\n            return Number.isFinite(v) ? v : null;\r\n        });\r\n        const present = values.filter(v =\u003E v !== null);\r\n        if (present.length \u003C 2) return '';\r\n\r\n        const max = Math.max(...present);\r\n        const min = Math.min(...present);\r\n        const range = max - min || 1;\r\n\r\n        const width = 100;\r\n        const points = values.map((v, i) =\u003E {\r\n            if (v === null) return null;\r\n            const x = (i / (values.length - 1)) * width;\r\n            const y = height - ((v - min) / range) * (height - 4) - 2;\r\n            return `${x},${y}`;\r\n        });\r\n\r\n        // Разрыв линии на пропусках: после null следующая точка начинает новый\r\n        // отрезок (M), а не тянет прямую через дыру.\r\n        let prevWasGap = true;\r\n        const path = points.map((p) =\u003E {\r\n            if (p === null) { prevWasGap = true; return ''; }\r\n            const cmd = prevWasGap ? 'M' : 'L';\r\n            prevWasGap = false;\r\n            return cmd + p;\r\n        }).filter(Boolean).join(' ');\r\n\r\n        return `\u003Csvg viewBox=\"0 0 ${width} ${height}\" preserveAspectRatio=\"none\" style=\"width:100%;height:100%;\"\u003E\r\n            \u003Cpath d=\"${path}\" stroke=\"${color}\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /\u003E\r\n        \u003C/svg\u003E`;\r\n    },\r\n\r\n    renderTo(element, data, color) {\r\n        if (!element) return;\r\n        element.innerHTML = this.generate(data, color);\r\n    },\r\n\r\n    getColor(varName) {\r\n        return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();\r\n    }\r\n};\r\n\r\n// =========================================================\r\n// SKELETON LOADING\r\n// =========================================================\r\nconst Skeleton = {\r\n    kpi(count = 4) {\r\n        return Array(count).fill('\u003Cdiv class=\"skeleton skeleton-kpi\"\u003E\u003C/div\u003E').join('');\r\n    },\r\n\r\n    card() {\r\n        return '\u003Cdiv class=\"skeleton skeleton-card\"\u003E\u003C/div\u003E';\r\n    },\r\n\r\n    text(lines = 3) {\r\n        return Array(lines).fill('\u003Cdiv class=\"skeleton skeleton-text\"\u003E\u003C/div\u003E').join('');\r\n    },\r\n\r\n    table(rows = 5, cols = 6) {\r\n        let html = '\u003Ctable style=\"width:100%\"\u003E\u003Ctbody\u003E';\r\n        for (let i = 0; i \u003C rows; i++) {\r\n            html += '\u003Ctr\u003E';\r\n            for (let j = 0; j \u003C cols; j++) {\r\n                html += '\u003Ctd\u003E\u003Cdiv class=\"skeleton skeleton-text\" style=\"margin:0\"\u003E\u003C/div\u003E\u003C/td\u003E';\r\n            }\r\n            html += '\u003C/tr\u003E';\r\n        }\r\n        html += '\u003C/tbody\u003E\u003C/table\u003E';\r\n        return html;\r\n    }\r\n};\r\n\r\n// =========================================================\r\n// ANIMATED COUNTER\r\n// =========================================================\r\nfunction animateValue(element, start, end, duration = 600) {\r\n    if (!element) return;\r\n\r\n    const startTime = performance.now();\r\n    const isFloat = String(end).includes('.');\r\n    const decimals = isFloat ? (String(end).split('.')[1] || '').length : 0;\r\n\r\n    function update(currentTime) {\r\n        const elapsed = currentTime - startTime;\r\n        const progress = Math.min(elapsed / duration, 1);\r\n        const eased = 1 - Math.pow(1 - progress, 3);\r\n        const current = start + (end - start) * eased;\r\n\r\n        element.textContent = isFloat ? current.toFixed(decimals) : Math.floor(current);\r\n\r\n        if (progress \u003C 1) {\r\n            requestAnimationFrame(update);\r\n        }\r\n    }\r\n\r\n    requestAnimationFrame(update);\r\n}\r\n\r\n// =========================================================\r\n// NAV DROPDOWN (topbar \"Аналитика\" submenu)\r\n// =========================================================\r\nfunction initNavDropdowns() {\r\n    document.querySelectorAll('.nav-dropdown').forEach((dd) =\u003E {\r\n        const btn = dd.querySelector('.nav-dropdown-btn');\r\n        if (!btn) return;\r\n        btn.addEventListener('click', (e) =\u003E {\r\n            e.stopPropagation();\r\n            const wasOpen = dd.classList.contains('open');\r\n            document.querySelectorAll('.nav-dropdown.open').forEach((o) =\u003E o.classList.remove('open'));\r\n            if (!wasOpen) dd.classList.add('open');\r\n        });\r\n    });\r\n    document.addEventListener('click', () =\u003E {\r\n        document.querySelectorAll('.nav-dropdown.open').forEach((o) =\u003E o.classList.remove('open'));\r\n    });\r\n    document.addEventListener('keydown', (e) =\u003E {\r\n        if (e.key === 'Escape') document.querySelectorAll('.nav-dropdown.open').forEach((o) =\u003E o.classList.remove('open'));\r\n    });\r\n}\r\ndocument.addEventListener('DOMContentLoaded', initNavDropdowns);\r\n\r\nfunction initTopbarMenu() {\r\n    document.querySelectorAll('.topbar').forEach((topbar) =\u003E {\r\n        const toggle = topbar.querySelector('.topbar-menu-toggle');\r\n        const menu = topbar.querySelector('.topbar-nav');\r\n        if (!toggle || !menu) return;\r\n\r\n        toggle.addEventListener('click', () =\u003E {\r\n            const open = topbar.classList.toggle('menu-open');\r\n            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');\r\n        });\r\n        menu.querySelectorAll('a').forEach((link) =\u003E link.addEventListener('click', () =\u003E {\r\n            topbar.classList.remove('menu-open');\r\n            toggle.setAttribute('aria-expanded', 'false');\r\n        }));\r\n    });\r\n}\r\ndocument.addEventListener('DOMContentLoaded', initTopbarMenu);\r\n\r\n// Export to global\r\nwindow.Toast = Toast;\r\nwindow.Sparkline = Sparkline;\r\nwindow.Skeleton = Skeleton;\r\nwindow.animateValue = animateValue;\r\n","js/service_panels.js":"/*\r\n * Панели сервисов: одна разметка для нашего раздела и кабинета клиента.\r\n *\r\n * Зачем. Находки по отзывам рисовались двумя независимыми кусками кода, и с\r\n * каждой правкой расходились: одни и те же данные выглядели как два разных\r\n * продукта. Теперь карточку собирает эта функция, а вид задаёт\r\n * css/service_panels.css.\r\n *\r\n * Отличие ролей - только в действиях: менеджер решает судьбу находки кнопками\r\n * («В матрицу», «Не надо»), клиент их не видит, потому что матрицу тем ведём\r\n * мы. Всё остальное - заголовок, числа, цитата, даты - одинаково.\r\n *\r\n * Формат находки (что из чего берётся, чтобы источники данных сходились):\r\n *   kind        emerging | momentum\r\n *   title       заголовок темы\r\n *   reviews_7d  повторов за неделю        reviews_30d  за месяц\r\n *   baseline    обычный недельный уровень (для всплесков)\r\n *   quotes[]    цитаты (кабинет клиента) ИЛИ samples[{quote}] (наш раздел)\r\n *   stale       находка сохранена, но сейчас не подтверждается\r\n *   peak_7d / peak_at  пик, если находка уже не подтверждается\r\n */\r\n\r\n(function (global) {\r\n    'use strict';\r\n\r\n    function esc(s) {\r\n        return String(s == null ? '' : s)\r\n            .replace(/&/g, '&amp;').replace(/\u003C/g, '&lt;').replace(/\u003E/g, '&gt;')\r\n            .replace(/\"/g, '&quot;');\r\n    }\r\n\r\n    function dateRu(iso) {\r\n        if (!iso) return '';\r\n        const [y, m, d] = String(iso).slice(0, 10).split('-');\r\n        return d ? `${d}.${m}.${y}` : String(iso);\r\n    }\r\n\r\n    /** Цитаты приходят из двух источников с разными именами полей. */\r\n    function quotesOf(t) {\r\n        if (Array.isArray(t.quotes) && t.quotes.length) return t.quotes;\r\n        const from = (t.stale ? t.samples_first : null) || t.samples || t.samples_first || [];\r\n        return (Array.isArray(from) ? from : [])\r\n            .map(s =\u003E (typeof s === 'string' ? s : (s && s.quote) || ''))\r\n            .filter(Boolean);\r\n    }\r\n\r\n    /**\r\n     * Числа находки.\r\n     *\r\n     * У зарождающейся темы важен сам факт повторов, у всплеска - во сколько раз\r\n     * чаще обычного. Это разные вопросы, поэтому и подписи разные.\r\n     */\r\n    function numbersOf(t) {\r\n        const week = Number(t.reviews_7d || 0);\r\n        const month = Number(t.reviews_30d || 0);\r\n        const base = Number(t.baseline || 0);\r\n\r\n        if (t.stale) {\r\n            return `сейчас не подтверждается · пик \u003Cb\u003E${Number(t.peak_7d || 0)}\u003C/b\u003E за неделю`\r\n                + (t.peak_at ? ` ${dateRu(t.peak_at)}` : '');\r\n        }\r\n        if (t.kind === 'emerging' || t.emerging) {\r\n            return `\u003Cb\u003E${month}\u003C/b\u003E за месяц, из них \u003Cb\u003E${week}\u003C/b\u003E за неделю`;\r\n        }\r\n        return `\u003Cb\u003E${week}\u003C/b\u003E за неделю против \u003Cb\u003E${base ? base.toFixed(1) : '—'}\u003C/b\u003E обычных`;\r\n    }\r\n\r\n    function skusNote(t) {\r\n        const n = t.skus_count != null ? Number(t.skus_count)\r\n            : (typeof t.skus === 'string' && t.skus !== ''\r\n                ? t.skus.split(',').filter(x =\u003E x.trim() !== '').length : 0);\r\n        return n ? ` · товаров: ${n}` : '';\r\n    }\r\n\r\n    /**\r\n     * Карточка находки.\r\n     *\r\n     * @param {object} t      находка\r\n     * @param {object} opts   { actions: html-строка с кнопками, quotes: сколько цитат }\r\n     */\r\n    function trendCard(t, opts) {\r\n        opts = opts || {};\r\n        const base = Number(t.baseline || 0);\r\n        const week = Number(t.reviews_7d || 0);\r\n        const rate = !t.stale && base \u003E 0 ? week / base : null;\r\n        const quotes = quotesOf(t).slice(0, opts.quotes || 2);\r\n\r\n        return `\u003Cdiv class=\"trend-card${t.stale ? ' is-stale' : ''}\"\u003E\r\n            \u003Cdiv class=\"trend-title\" title=\"${esc(t.title)}\"\u003E${esc(t.title)}\u003C/div\u003E\r\n            \u003Cdiv class=\"trend-num\"\u003E${numbersOf(t)}${skusNote(t)}${\r\n                rate && rate \u003E= 2 ? `\u003Cspan class=\"trend-rate\"\u003E×${rate.toFixed(1)}\u003C/span\u003E` : ''}\u003C/div\u003E\r\n            ${quotes.map(q =\u003E `\u003Cdiv class=\"trend-quote\" title=\"${esc(q)}\"\u003E«${\r\n                esc(q.length \u003E 160 ? q.slice(0, 159) + '…' : q)}»\u003C/div\u003E`).join('')}\r\n            ${t.hint ? `\u003Cdiv class=\"trend-meta\"\u003E${esc(t.hint)}\u003C/div\u003E` : ''}\r\n            ${(t.first_seen || t.last_seen) ? `\u003Cdiv class=\"trend-meta\"\u003E${\r\n                t.first_seen ? 'впервые ' + dateRu(t.first_seen) : ''}${\r\n                t.last_seen ? ' · последний раз ' + dateRu(t.last_seen) : ''}\u003C/div\u003E` : ''}\r\n            ${opts.actions ? `\u003Cdiv class=\"trend-acts\"\u003E${opts.actions(t)}\u003C/div\u003E` : ''}\r\n        \u003C/div\u003E`;\r\n    }\r\n\r\n    /** Список находок одного вида. Пустой список объясняет себя словами. */\r\n    function trendList(list, opts) {\r\n        opts = opts || {};\r\n        if (!list || !list.length) {\r\n            return `\u003Cdiv class=\"trend-empty\"\u003E${esc(opts.empty || 'Находок нет.')}\u003C/div\u003E`;\r\n        }\r\n        return `\u003Cdiv class=\"trend-list\"\u003E${list.map(t =\u003E trendCard(t, opts)).join('')}\u003C/div\u003E`;\r\n    }\r\n\r\n    /* ------------------------------------------------------------------\r\n     * Естественный эксперимент: провал давления, который никто не планировал.\r\n     *\r\n     * Блок один на оба экрана. Правило здесь одно и важнее вёрстки: сначала\r\n     * что видно, сразу следом - чем эпизод испорчен, и только потом что делать\r\n     * дальше. Показать прирост и умолчать о том, что вместе с медийкой росла\r\n     * товарная реклама, значит выдать чужую заслугу за свою.\r\n     * ------------------------------------------------------------------ */\r\n\r\n    function fmtInt(v) {\r\n        return v === null || v === undefined ? '—'\r\n            : Math.round(v).toLocaleString('ru-RU');\r\n    }\r\n\r\n    /** Проценты по-русски: запятая, а не точка - иначе экран выглядит переводным. */\r\n    function pct(v) {\r\n        // Ровный ноль без плюса: «+0%» читается как мелкий рост, которого не\r\n        // было, а именно на нуле и держится вывод «цена не менялась».\r\n        return v === null || v === undefined ? '—'\r\n            : (Number(v) === 0 ? '0' : (v \u003E 0 ? '+' : '') + String(v).replace('.', ','))\r\n              + '%';\r\n    }\r\n\r\n    /** Число без знака, с запятой: «на 23,4% против 4,6%». */\r\n    function plain(v) {\r\n        return v === null || v === undefined ? '—' : String(v).replace('.', ',');\r\n    }\r\n\r\n    /** «в 5 раз», «в 3 раза» - без склонения фраза читается как машинный перевод. */\r\n    function times(n) {\r\n        const k = Math.round(n);\r\n        const last = k % 10, hundred = k % 100;\r\n        const word = (last === 1 && hundred !== 11) ? 'раз'\r\n            : (last \u003E= 2 && last \u003C= 4 && (hundred \u003C 12 || hundred \u003E 14)) ? 'раза' : 'раз';\r\n        return 'в ' + k + ' ' + word;\r\n    }\r\n\r\n    function expCard(label, value, note, tone) {\r\n        return `\u003Cdiv class=\"exp-card exp-${tone || 'neutral'}\"\u003E\r\n            \u003Cdiv class=\"exp-label\"\u003E${esc(label)}\u003C/div\u003E\r\n            \u003Cdiv class=\"exp-value\"\u003E${value}\u003C/div\u003E\r\n            \u003Cdiv class=\"exp-note\"\u003E${esc(note)}\u003C/div\u003E\r\n        \u003C/div\u003E`;\r\n    }\r\n\r\n    /*\r\n     * Выводы эпизода: полный разбор случаев, а не одна ветка на демоданные.\r\n     *\r\n     * Зачем так. Текст под графиком - это то, что человек унесёт в переговоры,\r\n     * и писаться он должен сам на любых данных: и когда бренд просел, и когда\r\n     * замеров поиска нет вовсе, и когда товар кончился. Пока веток было две\r\n     * («рост» и «не подтверждает»), падение бренда мягче рынка печаталось как\r\n     * «вырос на -5%» - формально net \u003E 0, а по-русски бессмыслица.\r\n     *\r\n     * Пороги. 3% - шум замера: поиск снимается срезами, и меньше трёх процентов\r\n     * между окнами не отличить от дрожания выборки. Всё, что внутри порога,\r\n     * называется «вровень», а не приростом.\r\n     *\r\n     * Каждая ветка обязана дать законченную фразу. Отсутствие данных - тоже\r\n     * ветка со своей фразой: молчание читается как «проверено, всё чисто».\r\n     */\r\n    const NOISE = 3;\r\n\r\n    function expDemandVerdict(e, m) {\r\n        const brand = e.brand_delta_pct, control = e.control_delta_pct, net = e.net_pct;\r\n\r\n        if (!e.has_search || brand === null || brand === undefined) {\r\n            return { headline: 'Движение спроса этим эпизодом не измерено: в окне нет замеров '\r\n                        + 'поисковых запросов, видно только движение продаж.',\r\n                     can: 'Про спрос по этому эпизоду утверждать нечего — нужны замеры поиска '\r\n                        + 'за весь период, иначе сравнивать не с чем.' };\r\n        }\r\n\r\n        // Контроля нет - бренд измерен, но сравнить его не с чем. Это не то же\r\n        // самое, что «рынок не рос»: рынок просто не наблюдался.\r\n        if (net === null || net === undefined || control === null || control === undefined) {\r\n            return { headline: `Брендовый спрос после восстановления давления изменился на ${\r\n                        pct(brand)}, но сравнить не с чем: категорийных и конкурентских запросов в окне нет.`,\r\n                     can: 'Движение бренда видно, а вот рынка — нет. Без контроля это наблюдение, '\r\n                        + 'а не измерение: ровно так же выглядел бы общий сезонный подъём.' };\r\n        }\r\n\r\n        if (Math.abs(net) \u003C NOISE) {\r\n            return { headline: `Эпизод эффекта не показывает: бренд и рынок двигались вровень (${\r\n                        pct(brand)} против ${pct(control)}, разница ${plain(net)} п.п.).`,\r\n                     can: 'Утверждать по этому эпизоду нечего — ни в плюс, ни в минус. Разница с '\r\n                        + 'рынком меньше погрешности замера, и это честный результат, а не неудача.' };\r\n        }\r\n\r\n        if (net \u003C= -NOISE) {\r\n            return { headline: `Эпизод не подтверждает влияния медийки: после восстановления бренд ${\r\n                        brand \u003E 0 ? 'рос медленнее рынка' : 'проседал сильнее рынка'} (${\r\n                        pct(brand)} против ${pct(control)}).`,\r\n                     can: 'Списать движение на медийку нельзя: рынок в те же дни двигался в ту же '\r\n                        + 'сторону быстрее. Искать причину надо вне размещения.' };\r\n        }\r\n\r\n        // net \u003E= NOISE. Дальше важно, рос бренд или падал: «вырос на -5%» -\r\n        // именно та фраза, из-за которой этот разбор и появился.\r\n        if (brand \u003C= 0) {\r\n            return { headline: `Медийка удержала спрос: бренд просел на ${plain(Math.abs(brand))}%, `\r\n                        + `но рынок в те же дни упал сильнее — разница ${plain(net)} п.п. в пользу бренда.`,\r\n                     can: 'Это защита, а не рост: падение спроса шло мягче рыночного. Для отчёта '\r\n                        + 'формулировка одна — «без размещения падение было бы глубже».' };\r\n        }\r\n\r\n        return { headline: `Медийка двигает брендовый спрос: при падении давления он просел, после `\r\n                    + `восстановления вырос на ${plain(brand)}% против ${plain(control)}% у рынка — `\r\n                    + `разница ${plain(net)} п.п.`,\r\n                 can: `Размещение создаёт брендовый спрос, и это измерено на живом эпизоде, а не `\r\n                    + `заявлено: рынок в те же дни рос ${control \u003E 0\r\n                        ? times(brand / control) + ' медленнее' : 'без роста'}.` };\r\n    }\r\n\r\n    /** Конкуренты: отдельное утверждение, сильнее общего «рынок не рос». */\r\n    function expCompetitorNote(m) {\r\n        const c = (m.competitor_search || {}).delta_pct;\r\n        if (c === null || c === undefined) return '';\r\n        if (Math.abs(c) \u003C NOISE) {\r\n            return ` Конкурентские запросы за то же время практически не двигались (${pct(c)}), `\r\n                 + `так что списать движение бренда на общую активность рынка не получится.`;\r\n        }\r\n        // Знак уже сказан глаголом, поэтому число без знака: «потеряли -9%» -\r\n        // это двойное отрицание, которое читатель разбирает дважды.\r\n        return c \u003E 0\r\n            ? ` Конкуренты за те же дни прибавили ${plain(c)}% — часть движения может быть общей `\r\n              + `для категории, и это стоит держать в уме.`\r\n            : ` Конкуренты за те же дни потеряли ${plain(Math.abs(c))}% — бренд держался на фоне `\r\n              + `их спада, и это усиливает вывод, а не ослабляет.`;\r\n    }\r\n\r\n    /** Цена: ответ на «вы просто дали скидку» стоит в той же фразе, что и вывод. */\r\n    function expPriceNote(sh) {\r\n        if (!sh || !sh.price) {\r\n            return ' Цену за эти дни не проверяли — ценового мониторинга по клиенту нет, '\r\n                 + 'так что скидку как причину исключить нельзя.';\r\n        }\r\n        return sh.price.moved\r\n            ? ` Цена до СПП при этом двигалась (медиана ${pct(sh.price.median_delta_pct)} по ${\r\n                sh.price.skus} SKU), и часть движения принадлежит ей, а не размещению.`\r\n            : ` Цена до СПП за эти дни не менялась (медиана ${pct(sh.price.median_delta_pct)} по ${\r\n                sh.price.skus} SKU), так что скидкой движение не объясняется.`;\r\n    }\r\n\r\n    /**\r\n     * Продажи: чего утверждать нельзя.\r\n     *\r\n     * Порядок веток - по силе возражения. Товарная реклама и дефицит бьют по\r\n     * выводу сильнее, чем размер самого прироста, поэтому идут первыми.\r\n     */\r\n    function expSalesVerdict(e, m) {\r\n        const units = (m.seller_units || {}).delta_pct;\r\n        const risky = e.shelf && e.shelf.stock && e.shelf.stock.moved;\r\n\r\n        if (units === null || units === undefined) {\r\n            return 'Про продажи по этому эпизоду сказать нечего: данных о заказах в окне нет.';\r\n        }\r\n        if (e.contaminated) {\r\n            return `«Медийка дала ${pct(units)} продаж» — так говорить нельзя. Вместе с ней `\r\n                 + `изменилась товарная реклама (${pct(e.product_delta_pct)}), два фактора `\r\n                 + `двигались одновременно, и разделить их вклад на этих данных невозможно.`;\r\n        }\r\n        if (risky) {\r\n            return `«Медийка дала ${pct(units)} продаж» — так говорить нельзя. В те же дни ушли в `\r\n                 + `ноль артикулы, на которые приходилось ${plain(e.shelf.stock.risk_pct)}% заказов: `\r\n                 + `часть движения объясняется полкой, а не давлением.`;\r\n        }\r\n        if (Math.abs(units) \u003C NOISE) {\r\n            return `Продажи за эпизод практически не сдвинулись (${pct(units)}). Спрос мог вырасти, `\r\n                 + `а заказы — нет: между поиском и покупкой стоят цена, отзывы и выдача.`;\r\n        }\r\n        if (units \u003C 0) {\r\n            return `Продажи при этом упали на ${plain(Math.abs(units))}% при ровной товарной рекламе `\r\n                 + `(${pct(e.product_delta_pct)}). Роста заказов эпизод не показывает, и выдавать `\r\n                 + `движение спроса за движение продаж нельзя.`;\r\n        }\r\n        return `Продажи изменились на ${pct(units)} при ровной товарной рекламе (${\r\n            pct(e.product_delta_pct)}) — это уже ближе к вкладу медийки, но одного эпизода для `\r\n            + `цифры в отчёте мало.`;\r\n    }\r\n\r\n    /**\r\n     * Наличие: товар кончился совсем - и сколько продаж за ним стояло.\r\n     *\r\n     * Доля карточек здесь ничего не значит: три артикула из хвоста дают те же\r\n     * «минус пять пунктов», что и уход локомотива, поэтому дефицит взвешен\r\n     * заказами за месяц до эпизода.\r\n     */\r\n    function expStockVerdict(e) {\r\n        const st = e.shelf && e.shelf.stock;\r\n        if (!st) {\r\n            return 'Наличие по этому эпизоду не проверяли — остатков за эти дни в мониторинге нет. '\r\n                 + 'Уход товара в ноль даёт ровно такое же движение продаж, поэтому эта часть '\r\n                 + 'вывода пока на слово.';\r\n        }\r\n        if (!st.gone) {\r\n            return `Ни один артикул не уходил в ноль (в наличии ${plain(st.inside_pct)}% из ${\r\n                st.skus} SKU), дефицитом движение не объяснить.`;\r\n        }\r\n        if (st.risk_pct === null || st.risk_pct === undefined) {\r\n            return `В ноль ушли ${st.gone} из ${st.skus} артикулов, но заказов за месяц до эпизода `\r\n                 + `по ним нет — взвесить дефицит продажами не на чем.`;\r\n        }\r\n        if (st.risk_pct \u003C 2) {\r\n            return `В ноль ушли ${st.gone} из ${st.skus} артикулов, но на них приходилось ${\r\n                plain(st.risk_pct)}% продаж — на движение это не влияет.`;\r\n        }\r\n        return `В ноль ушли ${st.gone} из ${st.skus} артикулов, а на них приходилось ${\r\n            plain(st.risk_pct)}% продаж — часть движения объясняется дефицитом, а не давлением.`;\r\n    }\r\n\r\n    /**\r\n     * Готовые фразы блока. Отдельной функцией, чтобы их можно было прогнать\r\n     * матрицей вариантов из tools/check_experiment_verdicts.js, не собирая HTML.\r\n     */\r\n    function expVerdict(e) {\r\n        const m = e.metrics || {};\r\n        const d = expDemandVerdict(e, m);\r\n        const strong = e.has_search && e.net_pct !== null && e.net_pct !== undefined\r\n                       && Math.abs(e.net_pct) \u003E= NOISE;\r\n        return {\r\n            headline: d.headline,\r\n            // Конкуренты уточняют утверждение о спросе: если утверждать нечего,\r\n            // уточнять тоже нечего. Цена стоит всегда - она про любое движение.\r\n            can: d.can + (strong ? expCompetitorNote(m) : '') + expPriceNote(e.shelf),\r\n            cant: expSalesVerdict(e, m),\r\n            shelf: expStockVerdict(e),\r\n        };\r\n    }\r\n\r\n    /**\r\n     * @param {object} e      результат mediaLiftNaturalExperiment()\r\n     * @param {object} opts   { canvasId: id для графика }\r\n     */\r\n    function naturalExperiment(e, opts) {\r\n        if (!e) return '';\r\n        opts = opts || {};\r\n        const m = e.metrics || {};\r\n        const brand = e.brand_delta_pct, control = e.control_delta_pct, net = e.net_pct;\r\n        const units = (m.seller_units || {}).delta_pct;\r\n\r\n        const cards = [\r\n            e.has_search ? expCard('Брендовый поиск', pct(brand),\r\n                `${fmtInt((m.brand_search || {}).inside)} в провале → ${fmtInt((m.brand_search || {}).after)} после`,\r\n                brand !== null && brand \u003E 0 ? 'good' : 'neutral') : '',\r\n            // Карточка контроля берёт числа и процент из одного ряда.\r\n            // Раньше процент падал на общий контроль, а «было → стало» читалось\r\n            // из категории: если категорийных запросов у клиента нет, выходило\r\n            // «+4,6%» под прочерками - цифра из ряда, которого на экране нет.\r\n            e.has_search ? (() =\u003E {\r\n                const cat = m.category_search || {};\r\n                const own = cat.delta_pct !== null && cat.delta_pct !== undefined;\r\n                const src = own ? cat : (m.control_search || {});\r\n                return expCard(own ? 'Категория, контроль' : 'Рынок, контроль',\r\n                    pct(own ? cat.delta_pct : control),\r\n                    `${fmtInt(src.inside)} → ${fmtInt(src.after)}`, 'neutral');\r\n            })() : '',\r\n            // Конкуренты - отдельной карточкой, а не внутри контроля: их\r\n            // запросов на порядок меньше категорийных, и в общей сумме\r\n            // движение конкурентов не видно вовсе.\r\n            e.has_search && (m.competitor_search || {}).delta_pct !== null\r\n                && (m.competitor_search || {}).delta_pct !== undefined\r\n                ? expCard('Конкуренты', pct(m.competitor_search.delta_pct),\r\n                    `${fmtInt(m.competitor_search.inside)} → ${fmtInt(m.competitor_search.after)}`,\r\n                    'neutral') : '',\r\n            net !== null ? expCard('Чистая разница', plain(net) + ' п.п.', 'бренд минус рынок', 'accent') : '',\r\n            expCard('Продажи', pct(units),\r\n                `${fmtInt((m.seller_units || {}).inside)} → ${fmtInt((m.seller_units || {}).after)} шт/день`,\r\n                'warn'),\r\n        ].filter(Boolean).join('');\r\n\r\n        const v = expVerdict(e);\r\n        const headline = v.headline, canSay = v.can, cantSay = v.cant, shelfLine = v.shelf;\r\n\r\n        // Возраст эпизода - часть его смысла.\r\n        //\r\n        // Провал давления месячной давности ничего не говорит о том, что идёт\r\n        // сейчас: окно отклика у медийки около 45 дней, и за его пределами\r\n        // эпизод становится историей. Без явного возраста блок читается как\r\n        // свежий результат - и устаревает молча.\r\n        const ageDays = (() =\u003E {\r\n            const t = Date.parse(e.to);\r\n            if (!t) return null;\r\n            return Math.max(0, Math.round((Date.now() - t) / 86400000));\r\n        })();\r\n        const stale = ageDays !== null && ageDays \u003E 30;\r\n\r\n        return `\u003Cdiv class=\"exp-block\"${stale ? ' style=\"opacity:.82\"' : ''}\u003E\r\n            \u003Cdiv class=\"exp-head\"\u003E\r\n                \u003Cspan class=\"exp-title\"\u003EЕстественный эксперимент\u003C/span\u003E\r\n                \u003Cspan class=\"exp-badge\"\u003E${e.days} дн. · ${e.from} — ${e.to}${\r\n                    ageDays !== null ? ` · ${ageDays} дн. назад` : ''}\u003C/span\u003E\r\n            \u003C/div\u003E\r\n            ${stale ? `\u003Cdiv class=\"exp-line exp-line-warn\"\u003E\u003Cb\u003EЭпизод устарел.\u003C/b\u003E\r\n                Он закончился ${ageDays} дн. назад, а окно отклика медийки около 45 дней —\r\n                к текущему размещению эти цифры уже не относятся. Нужен свежий провал давления\r\n                или спланированная пауза.\u003C/div\u003E` : ''}\r\n            \u003Cdiv class=\"exp-headline\"\u003E${esc(headline)}\u003C/div\u003E\r\n            \u003Cdiv class=\"exp-intro\"\u003EФлайт провисал: ${fmtInt(e.spend_inside)} ₽ в день против обычных ${\r\n                fmtInt(e.spend_median)} ₽. Это и есть сравнение, которого не хватает в ровном размещении.\u003C/div\u003E\r\n            \u003Cdiv class=\"exp-cards\"\u003E${cards}\u003C/div\u003E\r\n            ${opts.canvasId ? `\u003Cdiv class=\"exp-chart\"\u003E\u003Ccanvas id=\"${esc(opts.canvasId)}\"\u003E\u003C/canvas\u003E\u003C/div\u003E` : ''}\r\n            \u003Cdiv class=\"exp-line exp-line-good\"\u003E\u003Cb\u003EЧто можно утверждать.\u003C/b\u003E ${esc(canSay)}\u003C/div\u003E\r\n            \u003Cdiv class=\"exp-line exp-line-warn\"\u003E\u003Cb\u003EЧего утверждать нельзя.\u003C/b\u003E ${esc(cantSay)}\u003C/div\u003E\r\n            \u003Cdiv class=\"exp-line\"\u003E\u003Cb\u003EНаличие.\u003C/b\u003E ${esc(shelfLine)}\u003C/div\u003E\r\n            \u003Cdiv class=\"exp-line\"\u003E\u003Cb\u003EЧто сделает вывод сильнее.\u003C/b\u003E Спланированная пауза на 5-7 дней при\r\n                неизменной товарной рекламе: тогда движение спроса и заказов будет объясняться только\r\n                медийкой, и в отчёте появится цифра, а не направление.\u003C/div\u003E\r\n        \u003C/div\u003E`;\r\n    }\r\n\r\n    /**\r\n     * График эпизода: давление столбцами, спрос линиями.\r\n     *\r\n     * Линии считаются в процентах к уровню провала, а не в запросах.\r\n     *\r\n     * Раньше у каждой был своя скрытая ось, и Chart.js растягивал каждый ряд на\r\n     * всю высоту по его же минимуму и максимуму. Категория с её тысячами\r\n     * запросов ложилась поверх бренда с его сотнями, шевеление на 4,6%\r\n     * выглядело таким же, как рост бренда на 23,4% - и график опровергал\r\n     * карточки прямо над собой. На общей шкале «провал = 100%» равный рост\r\n     * значит совпадение линий, а разный - расхождение, и 18,8 п.п. видно\r\n     * глазами.\r\n     */\r\n    function drawExperiment(canvasId, e) {\r\n        if (!e || !window.Chart) return null;\r\n        const el = document.getElementById(canvasId);\r\n        if (!el) return null;\r\n        const rows = e.series || [];\r\n        const inDip = (d) =\u003E d \u003E= e.from && d \u003C= e.to;\r\n\r\n        // База - средний уровень внутри провала: именно с ним сравнивают\r\n        // карточки, и точка отсчёта у графика с ними должна быть одна.\r\n        const baseOf = (key) =\u003E {\r\n            const v = rows.filter(r =\u003E inDip(r.date) && r[key] !== null && r[key] !== undefined)\r\n                          .map(r =\u003E Number(r[key]));\r\n            return v.length ? v.reduce((a, b) =\u003E a + b, 0) / v.length : null;\r\n        };\r\n        const indexOf = (key) =\u003E {\r\n            const base = baseOf(key);\r\n            if (!base) return rows.map(() =\u003E null);\r\n            return rows.map(r =\u003E (r[key] === null || r[key] === undefined)\r\n                ? null : Math.round(Number(r[key]) / base * 1000) / 10);\r\n        };\r\n        const absOf = (key) =\u003E rows.map(r =\u003E r[key]);\r\n\r\n        const brandIdx = indexOf('brand_search');\r\n        const ctrlIdx = indexOf('control_search');\r\n        const brandAbs = absOf('brand_search');\r\n        const ctrlAbs = absOf('control_search');\r\n\r\n        return new Chart(el, {\r\n            data: {\r\n                labels: rows.map(r =\u003E r.date.slice(5)),\r\n                datasets: [\r\n                    { type: 'bar', label: 'Медийный расход, ₽', yAxisID: 'y',\r\n                      data: rows.map(r =\u003E r.media_spend),\r\n                      backgroundColor: rows.map(r =\u003E inDip(r.date)\r\n                          ? 'rgba(229,72,77,.45)' : 'rgba(139,92,246,.45)'),\r\n                      borderRadius: 3 },\r\n                    { type: 'line', label: 'Брендовый поиск, % к провалу', yAxisID: 'y1',\r\n                      data: brandIdx, abs: brandAbs,\r\n                      borderColor: '#f59e0b', backgroundColor: 'transparent',\r\n                      tension: .3, pointRadius: 2, borderWidth: 2, spanGaps: true },\r\n                    { type: 'line', label: 'Категория и конкуренты, % к провалу', yAxisID: 'y1',\r\n                      data: ctrlIdx, abs: ctrlAbs,\r\n                      borderColor: '#94a3b8', backgroundColor: 'transparent',\r\n                      borderDash: [5, 4], tension: .3, pointRadius: 0, borderWidth: 2, spanGaps: true },\r\n                ],\r\n            },\r\n            options: {\r\n                responsive: true, maintainAspectRatio: false,\r\n                plugins: {\r\n                    legend: { labels: { boxWidth: 10, font: { size: 11 } } },\r\n                    tooltip: { callbacks: {\r\n                        // В подсказке - и процент, и сами запросы: по индексу\r\n                        // порядок величин не виден, а он нужен, чтобы понимать,\r\n                        // насколько выборка вообще устойчива.\r\n                        label: (ctx) =\u003E {\r\n                            if (ctx.dataset.type !== 'line') {\r\n                                return ctx.dataset.label + ': ' + fmtInt(ctx.parsed.y) + ' ₽';\r\n                            }\r\n                            const abs = (ctx.dataset.abs || [])[ctx.dataIndex];\r\n                            return ctx.dataset.label.replace(', % к провалу', '') + ': '\r\n                                + plain(ctx.parsed.y) + '%'\r\n                                + (abs === null || abs === undefined ? '' : ' (' + fmtInt(abs) + ' запр.)');\r\n                        },\r\n                    } },\r\n                },\r\n                scales: {\r\n                    x: { ticks: { font: { size: 10 } } },\r\n                    y: { display: false, beginAtZero: true },\r\n                    y1: { position: 'right', grid: { drawOnChartArea: false },\r\n                          ticks: { font: { size: 10 }, callback: (v) =\u003E v + '%' } },\r\n                },\r\n            },\r\n        });\r\n    }\r\n\r\n    global.ServicePanels = { trendCard, trendList, quotesOf, numbersOf,\r\n                             naturalExperiment, drawExperiment, expVerdict };\r\n})(window);\r\n","js/design.js":"/** Visual redesign. Functional page code and data stay unchanged. */\r\n(function () {\r\n    const originalCharts = new WeakMap();\r\n    const palette = ['#327d9e', '#6aa9be', '#728ba6', '#9ab8c3'];\r\n    document.documentElement.dataset.design = 'fresh';\r\n\r\n    // Chart.js is loaded before this script on the pages that use it. The plugin\r\n    // only changes presentation. Original series data are left untouched.\r\n    if (window.Chart && typeof Chart.register === 'function') {\r\n        Chart.register({\r\n            id: 'icomFreshPalette',\r\n            beforeUpdate(chart) {\r\n                const fresh = true;\r\n                (chart.data.datasets || []).forEach((dataset, index) =\u003E {\r\n                    if (!originalCharts.has(dataset)) {\r\n                        originalCharts.set(dataset, {\r\n                            borderColor: dataset.borderColor,\r\n                            backgroundColor: dataset.backgroundColor,\r\n                            pointBackgroundColor: dataset.pointBackgroundColor,\r\n                            tension: dataset.tension,\r\n                            borderWidth: dataset.borderWidth,\r\n                            pointRadius: dataset.pointRadius,\r\n                            borderRadius: dataset.borderRadius\r\n                        });\r\n                    }\r\n                    const original = originalCharts.get(dataset);\r\n                    const brandSeries = /ozon|wildberries|\\bwb\\b|авито|яндекс|yandex/i.test(String(dataset.label || ''));\r\n                    for (const prop of ['borderColor', 'backgroundColor', 'pointBackgroundColor']) {\r\n                        const value = original[prop];\r\n                        if (!fresh || brandSeries || typeof value !== 'string') {\r\n                            dataset[prop] = value;\r\n                            continue;\r\n                        }\r\n                        const bluePurple = /#(?:7c5cfc|8b5cf6|a78bfa|7c3aed|a855f7|60a5fa|0ea5e9|38bdf8|3b82f6|2563eb|4f46e5|6366f1)\\b/i.test(value);\r\n                        const rgbaBluePurple = /rgba?\\(\\s*(?:124\\s*,\\s*92\\s*,\\s*252|96\\s*,\\s*165\\s*,\\s*250|59\\s*,\\s*130\\s*,\\s*246|139\\s*,\\s*92\\s*,\\s*246)/i.test(value);\r\n                        if (!bluePurple && !rgbaBluePurple) { dataset[prop] = value; continue; }\r\n                        const color = palette[index % palette.length];\r\n                        if (rgbaBluePurple) {\r\n                            const alpha = value.match(/,\\s*(0?\\.\\d+|1(?:\\.0+)?)\\s*\\)$/)?.[1] || '1';\r\n                            const rgb = color.match(/[a-f\\d]{2}/gi).map(x =\u003E parseInt(x, 16));\r\n                            dataset[prop] = `rgba(${rgb.join(',')},${alpha})`;\r\n                        } else {\r\n                            dataset[prop] = color;\r\n                        }\r\n                    }\r\n                    const type = dataset.type || chart.config.type;\r\n                    if (type === 'line') {\r\n                        dataset.tension = fresh ? 0.32 : original.tension;\r\n                        dataset.borderWidth = fresh ? 2.8 : original.borderWidth;\r\n                        // Dense time series read better as uninterrupted lines. Hover and\r\n                        // tooltip interaction still work through Chart.js hit testing.\r\n                        dataset.pointRadius = fresh ? 0 : original.pointRadius;\r\n                        dataset.pointHoverRadius = fresh ? 4 : dataset.pointHoverRadius;\r\n                        dataset.pointHitRadius = fresh ? 10 : dataset.pointHitRadius;\r\n                    } else if (type === 'bar') {\r\n                        dataset.borderRadius = fresh ? 6 : original.borderRadius;\r\n                    }\r\n                });\r\n            }\r\n        });\r\n    }\r\n\r\n    document.addEventListener('DOMContentLoaded', () =\u003E {\r\n        document.querySelectorAll('.home-hero').forEach(hero =\u003E {\r\n            if (hero.querySelector('.design-planets')) return;\r\n            const orbit = document.createElement('div');\r\n            orbit.className = 'design-planets';\r\n            orbit.setAttribute('aria-hidden', 'true');\r\n            orbit.innerHTML = '\u003Ci\u003E\u003C/i\u003E\u003Ci\u003E\u003C/i\u003E';\r\n            hero.appendChild(orbit);\r\n        });\r\n    });\r\n})();\r\n"},"data":{"GET /api/clients_ajax.php?action=list_clients&include_reviews_only=1":{"t":"application/json; charset=utf-8","b":"{\"ok\":true,\"clients\":[{\"id\":6,\"name\":\"ICOMBOOST Demo\",\"slug\":\"icomboost-demo\",\"logo_url\":\"\",\"is_active\":1,\"created_at\":\"2026-07-24 12:52:07\",\"reviews_only\":0,\"connections_count\":8,\"campaigns_count\":27,\"categories\":[],\"category_labels\":[]},{\"id\":21,\"name\":\"Материя Медика\",\"slug\":\"materia-medica\",\"logo_url\":\"\",\"is_active\":1,\"created_at\":\"2026-09-09 13:34:57\",\"reviews_only\":0,\"connections_count\":2,\"campaigns_count\":0,\"categories\":[\"pharma\"],\"category_labels\":[\"Фарма\"]}]}","q":{"action":"list_clients","include_reviews_only":"1"},"p":"/api/clients_ajax.php","m":"GET"},"GET /api/reviews_ajax.php?action=brands&client_id=21":{"t":"application/json; charset=utf-8","b":"{\"ok\":true,\"brands\":[{\"brand\":\"Проспекта\",\"is_resale\":0,\"skus\":9,\"active_skus\":9,\"reviews\":408,\"negative\":\"9\",\"last_review\":\"2026-09-26\",\"categories\":[{\"category\":\"Препараты для улучшения работы мозга\",\"skus\":6,\"reviews\":398},{\"category\":\"ЛЕКАРСТВЕННЫЕ СРЕДСТВА\",\"skus\":1,\"reviews\":10},{\"category\":\"Ноотропные препараты\",\"skus\":1,\"reviews\":0},{\"category\":\"Средства для нервной системы\",\"skus\":1,\"reviews\":0}]}]}","q":{"action":"brands","client_id":"21"},"p":"/api/reviews_ajax.php","m":"GET"},"GET /api/reviews_ajax.php?action=overview&brand=%D0%9F%D1%80%D0%BE%D1%81%D0%BF%D0%B5%D0%BA%D1%82%D0%B0&category=&client     if (DATA[exact]) return DATA[exact];
    // Близкий ответ: тот же адрес и действие, тот же клиент; больше совпавших параметров - лучше, даты не обязательны.
    let best = null, bestScore = -1;

          const a = Date.parse(req.q[kk]), b = Date.parse(d.q[kk] || '');

function buildPage(page) {
  let h = PAYLOAD.pages[page];
  h = h.replace(/<style data-asset="([^"]+)"><\/style>/g, (m, rel) => '<style>' + (PAYLOAD.assets[rel] || '') + '</style>');
  h = h.replace(/<script data-asset="([^"]+)"><\/script>/g, (m, rel) => '<script>' + (PAYLOAD.assets[rel] || '').replace(/<\/script/gi, '<\\/script') + '<\/script>');
  const pre = prelude(page);
  h = /<head[^>]*>/i.test(h) ? h.replace(/<head([^>]*)>/i, '<head$1>' + pre) : pre + h;
  return h;
}

const view = document.getElementById('view');

function open(page, push) {
  if (!META[page] || !META[page].has) page = HOME;
