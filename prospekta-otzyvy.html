\u003C/th\u003E\u003Cth\u003EЗадание\u003C/th\u003E\u003Cth\u003EСостояние\u003C/th\u003E\r\n        \u003Cth\u003EХод работы\u003C/th\u003E\u003Cth\u003EСоздано\u003C/th\u003E\u003Cth\u003E\u003C/th\u003E\u003C/tr\u003E\u003C/thead\u003E\u003Ctbody\u003E\r\n        ${d.tasks.map(t =\u003E `\u003Ctr\u003E\r\n            \u003Ctd class=\"num\"\u003E${t.id}\u003C/td\u003E\r\n            \u003Ctd\u003E\u003Cb\u003E${esc(d.kinds[t.kind] || t.kind)}\u003C/b\u003E\r\n                ${t.params ? `\u003Cdiv class=\"task-blob\" title=\"${esc(t.params)}\"\u003E${esc(t.params)}\u003C/div\u003E` : ''}\u003C/td\u003E\r\n            \u003Ctd\u003E${statusTag(t.status)}${Number(t.attempts) \u003E 1 ? `\u003Cbr\u003E\u003Cspan class=\"muted\" style=\"font-size:11px\"\u003Eпопытка ${t.attempts} из ${t.max_attempts}\u003C/span\u003E` : ''}\u003C/td\u003E\r\n            \u003Ctd\u003E${esc(t.last_log || '')}${t.error ? `\u003Cbr\u003E\u003Cspan style=\"color:var(--red)\"\u003E${esc(t.error)}\u003C/span\u003E` : ''}\r\n                ${t.result ? `\u003Cdiv class=\"task-blob\" title=\"${esc(t.result)}\"\u003E${esc(t.result)}${\r\n                    Number(t.result_len) \u003E 400 ? ` … (всего ${num(t.result_len)} знаков)` : ''}\u003C/div\u003E` : ''}\u003C/td\u003E\r\n            \u003Ctd class=\"muted\"\u003E${esc((t.created_at||'').slice(0,16))}\u003C/td\u003E\r\n            \u003Ctd\u003E${t.status === 'draft'\r\n                ? `\u003Cbutton class=\"btn btn-primary btn-sm\" onclick=\"approveTask(${t.id})\"\u003EПодтвердить\u003C/button\u003E ` : ''}\r\n                ${['draft','pending','claimed','failed'].includes(t.status)\r\n                ? `\u003Cbutton class=\"btn btn-outline btn-sm\" onclick=\"cancelTask(${t.id})\"\u003EОтменить\u003C/button\u003E` : ''}\u003C/td\u003E\r\n        \u003C/tr\u003E`).join('')}\u003C/tbody\u003E\u003C/table\u003E`;\r\n}\r\n\r\nlet taskInfo = {}, taskSteps = {}, REVIEW_MALLS = [];\r\n// План сбора по клиенту: экран установки объясняет сроки по нему, а не по\r\n// общим словам - у клиента без кабинета всё идёт витриной, и обещать «минуты\r\n// по API» там было бы неправдой.\r\nlet taskPlan = [];\r\n\r\n/**\r\n * Пояснение к выбранному виду задания и гашение ненужных полей.\r\n *\r\n * В форме всегда висят «бренд», «глубина» и «конкуренты», и без подсказки\r\n * непонятно, что из этого относится к делу: классификации не нужно ничего из\r\n * трёх, а пустые поля читаются как «забыли заполнить».\r\n */\r\nfunction onKindChange() {\r\n    const info = taskInfo[document.getElementById('taskKind').value];\r\n    const hint = document.getElementById('kindHint');\r\n    if (!info) { hint.textContent = ''; return; }\r\n\r\n    hint.innerHTML = '\u003Cb\u003E' + esc(info.what) + '\u003C/b\u003E ' + esc(info.when);\r\n\r\n    // Ненужные поля скрываем целиком, а не гасим прозрачностью: тусклое поле\r\n    // читается как «забыли заполнить», и человек лез в него разбираться.\r\n    const need = info.fields || [];\r\n    document.querySelectorAll('.nt-field[data-field], .nt-hint[data-field]').forEach(el =\u003E {\r\n        el.hidden = !need.includes(el.dataset.field);\r\n    });\r\n\r\n    // Шаг без единого нужного поля не показываем: «насколько глубоко» у\r\n    // классификации это пустая рамка с номером.\r\n    const groupFields = { target: ['brand', 'competitors', 'skus', 'category'],\r\n                          malls: ['brand', 'skus', 'competitors'], months: ['months'] };\r\n    document.querySelectorAll('.nt-step[data-field-group]').forEach(step =\u003E {\r\n        const fields = groupFields[step.dataset.fieldGroup] || [];\r\n        step.hidden = !fields.some(f =\u003E need.includes(f));\r\n    });\r\n\r\n    // Номера шагов пересчитываем по видимым: «1, 3» вместо «1, 2, 3» выглядит\r\n    // как пропущенный шаг.\r\n    let n = 0;\r\n    document.querySelectorAll('.nt-step').forEach(step =\u003E {\r\n        if (step.hidden) return;\r\n        const num = step.querySelector('.nt-num');\r\n        if (num) num.textContent = String(++n);\r\n    });\r\n\r\n    renderTaskPreview();\r\n\r\n    // Подпись бренда честная по каждому заданию: у первого сбора без цели\r\n    // обработчику нечего искать, у догона пустое поле значит «все бренды».\r\n    const label = document.getElementById('taskBrandLabel');\r\n    if (label) {\r\n        label.textContent = info.brand_required ? 'Бренд (или товары ниже)'\r\n            : (need.includes('brand') ? 'Бренд (пусто - все бренды клиента)' : 'Бренд');\r\n    }\r\n}\r\n\r\n/**\r\n * Раздел внутри аналитики: что происходит / отзывы по одному / настройка.\r\n *\r\n * Выбор запоминается: менеджер живёт в «что происходит», а в настройку заходит\r\n * раз в неделю - открывать её при каждом входе значит показывать форму вместо\r\n * ответа.\r\n */\r\nconst SECTION_KEY = 'reviews.section';\r\n\r\nfunction setSection(sec) {\r\n    if (!['analytics', 'texts', 'setup'].includes(sec)) sec = 'analytics';\r\n    document.body.dataset.sec = sec;\r\n    localStorage.setItem(SECTION_KEY, sec);\r\n    document.querySelectorAll('.sec-tab').forEach(b =\u003E\r\n        b.classList.toggle('active', b.dataset.sec === sec));\r\n\r\n    // Тексты грузятся лениво: открытие раздела - тот же повод, что раскрытие\r\n    // карточки.\r\n    if (sec === 'texts') {\r\n        const card = document.getElementById('textsCard');\r\n        if (card && !card.open) card.open = true;\r\n    }\r\n}\r\n\r\n/** Счётчики на полосе разделов: сколько текстов и сколько тем - видно сразу. */\r\nfunction renderSectionBadges() {\r\n    const s = taskSteps || {};\r\n    const set = (sec, text) =\u003E {\r\n        const btn = document.querySelector(`.sec-tab[data-sec=\"${sec}\"]`);\r\n        if (!btn) return;\r\n        let badge = btn.querySelector('.sec-badge');\r\n        if (!badge) { badge = document.createElement('span'); badge.className = 'sec-badge'; btn.appendChild(badge); }\r\n        badge.textContent = text;\r\n    };\r\n    set('texts', s.reviews ? num(s.reviews) : '');\r\n    set('setup', s.themes ? num(s.themes) + ' тем' : 'не настроено');\r\n}\r\n\r\n/**\r\n * Карточка установки: путь от пустого клиента до работающего сбора.\r\n *\r\n * Раньше новый клиент открывался на пустых графиках и нулях, а порядок действий\r\n * держался в подсказке внизу страницы. Человек видел «поломку» там, где просто\r\n * ещё нечего показывать. Теперь пока отзывов нет, страница работает как\r\n * установщик: четыре шага, на каждом видно, сделан он или нет, и кнопка ведёт\r\n * ровно туда, где его делают.\r\n *\r\n * Шаги считаются по фактам из базы (steps в ответе `tasks`), а не по нажатым\r\n * кнопкам: если сбор шёл ночью и уже принёс отзывы, шаг закрыт сам.\r\n */\r\nfunction renderSetupWizard() {\r\n    const box = document.getElementById('setupWizard');\r\n    if (!box) return;\r\n\r\n    const s = taskSteps || {};\r\n    const reviews = +s.reviews || 0, themes = +s.themes || 0,\r\n          classified = +s.classified || 0, competitors = +s.competitors || 0;\r\n\r\n    // Режим установки - только пока нет ни одного отзыва. Дальше человеку нужна\r\n    // аналитика, а не инструкция: подсказку «что дальше» даёт renderNextStep().\r\n    const setup = reviews === 0;\r\n    document.body.classList.toggle('setup-mode', setup);\r\n    box.style.display = setup ? 'block' : 'none';\r\n\r\n    // Пока сбора нет, показывать «что происходит» нечем: открываем настройку и\r\n    // не заставляем человека искать, где запустить сбор.\r\n    if (setup) setSection('setup');\r\n    if (!setup) return;\r\n\r\n    const steps = [\r\n        {\r\n            title: 'Собрать отзывы',\r\n            done: reviews \u003E 0,\r\n            body: 'Задание «Бэкфилл истории»: бренд, глубина в месяцах и площадки. '\r\n                + (taskPlan.some(p =\u003E p.route === 'api')\r\n                    ? 'По части площадок у этого клиента открыт API - там сбор занимает минуты и '\r\n                      + 'ничего не стоит. Остальное идёт обходом витрины, это часы.'\r\n                    : 'Кабинетов с доступом к отзывам у этого клиента нет, поэтому всё пойдёт обходом '\r\n                      + 'витрины: это часы, зато кабинет и не нужен - карточки ищутся по названию '\r\n                      + 'бренда. Правило общее: где API есть, идём в него первым.')\r\n                + ' Что именно и почему - в списке «Сейчас по этому клиенту» ниже.',\r\n            action: ['Перейти к заданию', \"document.getElementById('taskKind').scrollIntoView({block:'center'});\"\r\n                + \"document.getElementById('taskBrand').focus()\"],\r\n        },\r\n        {\r\n            title: 'Собрать матрицу тем',\r\n            done: themes \u003E 0,\r\n            body: themes \u003E 0\r\n                ? 'Тем заведено: ' + themes + '. Можно добавить ещё из каталога или дописать свои.'\r\n                : 'Это то, по чему классификатор раскладывает отзывы. Половина тем у всех одинаковая - '\r\n                  + 'доставка, упаковка, некомплект, шаблонный ответ продавца: берите их галочками из '\r\n                  + 'каталога, а специфику продукта дописывайте руками. Матрицу можно менять и потом.',\r\n            action: ['Взять из каталога', \"document.getElementById('themeCatalog')\"\r\n                + \".scrollIntoView({block:'center'});openThemeCatalog()\"],\r\n        },\r\n        {\r\n            title: 'Разметить собранное',\r\n            done: classified \u003E 0,\r\n            body: 'Классификация - отдельная операция: сбор её не делает специально, чтобы не тратить '\r\n                + 'разметку на корпус, который ещё не смотрели глазами. Ставится заданием, а дальше '\r\n                + 'идёт каждую ночь сама - по новым отзывам.',\r\n            action: null,\r\n        },\r\n        {\r\n            title: 'Конкуренты и наблюдение',\r\n            done: competitors \u003E 0,\r\n            body: 'Задание «Собрать конкурентов» - до пяти брендов через запятую. После него сравнение '\r\n                + 'долей негатива, зарождающиеся темы и поиск отклонений считаются по расписанию: '\r\n                + 'ежедневный догон, недельное саммари, ночной скан целостности.',\r\n            action: null,\r\n        },\r\n    ];\r\n\r\n    const firstOpen = steps.findIndex(st =\u003E !st.done);\r\n\r\n    box.innerHTML = `\r\n        \u003Cdiv class=\"card-title\"\u003E🛠 Установка сбора отзывов\r\n            \u003Cspan class=\"muted\" style=\"font-size:11.5px;font-weight:400\"\u003E\r\n                Аналитика появится на этом экране, как только придёт первый отзыв -\r\n                пустые графики до этого мы не показываем.\u003C/span\u003E\r\n        \u003C/div\u003E\r\n        ${steps.map((st, i) =\u003E `\u003Cdiv class=\"setup-step ${st.done ? 'done' : (i === firstOpen ? 'now' : '')}\"\u003E\r\n            \u003Cdiv class=\"setup-num\"\u003E${st.done ? '✓' : i + 1}\u003C/div\u003E\r\n            \u003Cdiv class=\"setup-body\"\u003E\r\n                \u003Cb\u003E${esc(st.title)}\u003C/b\u003E\r\n                ${st.done ? '\u003Cspan class=\"tag tag-green\" style=\"font-size:10px\"\u003Eсделано\u003C/span\u003E' : ''}\r\n                \u003Cdiv class=\"muted\" style=\"margin-top:3px\"\u003E${st.body}\u003C/div\u003E\r\n                ${st.action && !st.done\r\n                    ? `\u003Cbutton class=\"btn btn-primary btn-sm\" style=\"margin-top:8px\"\r\n                         onclick=\"${st.action[1]}\"\u003E${esc(st.action[0])}\u003C/button\u003E` : ''}\r\n            \u003C/div\u003E\r\n        \u003C/div\u003E`).join('')}\r\n        \u003Cdiv class=\"muted\" style=\"font-size:11.5px;margin-top:12px;line-height:1.7\"\u003E\r\n            \u003Ca href=\"docs/reviews_onboarding.md\" target=\"_blank\"\u003EПолная инструкция по запуску клиента\u003C/a\u003E -\r\n            там же сроки по каждому шагу и что делать, если экран выглядит пустым.\u003Cbr\u003E\r\n            \u003Cb\u003EЧто делается само, а что руками.\u003C/b\u003E Отзывы Wildberries по кабинету с токеном собираются\r\n            ночью без заданий, классификация и ночной скан идут из нашего крона. Обход витрины\r\n            (Ozon, Яндекс Маркет) выполняет обработчик - задание для него надо подтвердить, и\r\n            запускается он не сам.\r\n        \u003C/div\u003E`;\r\n}\r\n\r\n/** Что логично сделать следующим - по тому, что у клиента уже есть. */\r\nfunction renderNextStep() {\r\n    const el = document.getElementById('nextStep');\r\n    if (!el) return;\r\n    const s = taskSteps || {};\r\n    const reviews = +s.reviews || 0, themes = +s.themes || 0,\r\n          classified = +s.classified || 0, competitors = +s.competitors || 0;\r\n\r\n    let text;\r\n    if (!reviews) {\r\n        text = '\u003Cb\u003EШаг 1 из 4 - собрать.\u003C/b\u003E Отзывов по клиенту ещё нет. Поставьте «Бэкфилл истории», '\r\n             + 'укажите бренд и глубину в месяцах. Это самое долгое задание, запускайте на ночь.';\r\n    } else if (!themes) {\r\n        text = '\u003Cb\u003EШаг 2 из 4 - матрица тем.\u003C/b\u003E Отзывы есть (' + num(reviews) + '), а тем пока нет. '\r\n             + 'Заведите 3–10 тем в блоке выше: без них классифицировать не по чему.';\r\n    } else if (!classified) {\r\n        text = '\u003Cb\u003EШаг 3 из 4 - классификация.\u003C/b\u003E Матрица готова (тем: ' + themes + '), разметки нет. '\r\n             + 'Поставьте «Классификация по матрице» - это отдельная операция, сбор её не делает.';\r\n    } else if (!competitors) {\r\n        text = '\u003Cb\u003EШаг 4 из 4 - конкуренты и алерты.\u003C/b\u003E Свой бренд размечен. '\r\n             + 'Дальше «Собрать конкурентов» для сравнения и «Поиск отклонений» для сигналов.';\r\n    } else {\r\n        text = '\u003Cb\u003EВсё основное готово.\u003C/b\u003E Дальше по расписанию: ежедневно «Догон новых отзывов», '\r\n             + 'раз в неделю «Перечитать ответы продавца» и «Недельное саммари».';\r\n    }\r\n    el.innerHTML = '\u003Cdiv class=\"warn-box\" style=\"border-color:var(--accent);background:var(--accent-glow);'\r\n        + 'margin:0 0 12px\"\u003E' + text + '\u003C/div\u003E';\r\n}\r\n\r\n/** Кто и чем будет собирать по этому клиенту - фактическое положение дел. */\r\nfunction renderPlan(plan, engine) {\r\n    const el = document.getElementById('planNote');\r\n    if (!el) return;\r\n    if (!plan || !plan.length) { el.innerHTML = ''; return; }\r\n\r\n    const rows = plan.map(p =\u003E '\u003Cli\u003E\u003Cb\u003E' + esc(p.label) + '\u003C/b\u003E — '\r\n        + (p.route === 'api' ? 'по API' : 'через обработчик')\r\n        + ': ' + esc(p.why) + '\u003C/li\u003E').join('');\r\n\r\n    el.innerHTML = '\u003Cdiv class=\"muted\" style=\"font-weight:600;margin-bottom:4px\"\u003EСейчас по этому клиенту:\u003C/div\u003E'\r\n        + '\u003Cul style=\"margin:0 0 0 18px;padding:0\"\u003E' + rows\r\n        + '\u003Cli\u003E\u003Cb\u003EКлассификация\u003C/b\u003E — ' + esc((engine || {}).note || '') + '\u003C/li\u003E\u003C/ul\u003E';\r\n}\r\n\r\n/** Отмеченные площадки. Пустой список = «как у клиента заведено». */\r\nfunction selectedMalls() {\r\n    return [...document.querySelectorAll('#taskMalls input:checked')].map(i =\u003E i.value);\r\n}\r\n\r\n/**\r\n * Список площадок в форме.\r\n *\r\n * По умолчанию отмечены те, где у клиента уже есть карточки: обычное задание -\r\n * догон по тому, что собрано. У нового клиента не отмечено ничего, и выбор\r\n * приходится сделать - иначе маршрут собирать не из чего.\r\n */\r\nfunction renderMalls(known) {\r\n    const box = document.getElementById('taskMalls');\r\n    if (!box) return;\r\n    box.innerHTML = REVIEW_MALLS.map(m =\u003E `\u003Clabel style=\"display:flex;gap:6px;align-items:center\"\u003E\r\n        \u003Cinput type=\"checkbox\" value=\"${m.key}\"${known.includes(m.key) ? \" checked\" : \"\"} onchange=\"renderTaskPreview()\"\u003E\r\n        ${esc(m.label)}\u003C/label\u003E`).join('')\r\n        + (known.length ? '' : '\u003Cspan class=\"muted\"\u003Eкарточек ещё нет - отметьте, где искать бренд\u003C/span\u003E');\r\n}\r\n\r\n/**\r\n * Подсказка категорий площадки.\r\n *\r\n * Дерево большое - у Ozon почти девять тысяч типов товара, - поэтому не список,\r\n * а поиск по вводу: два знака и запрос. Пришедшее кладём в datalist, а полный\r\n * путь запоминаем отдельно: в задание уходит и он, чтобы обработчик понимал, в\r\n * каком разделе искать, а не угадывал по одному слову.\r\n */\r\nlet categoryPaths = {};   // выбранное значение =\u003E полный путь и площадка\r\nlet categoryTimer = null;\r\n\r\nfunction onCategoryInput() {\r\n    const el = document.getElementById('taskCategory');\r\n    const hint = document.getElementById('taskCategoryHint');\r\n    const q = el.value.trim();\r\n\r\n    const known = categoryPaths[q];\r\n    if (hint) {\r\n        hint.textContent = known\r\n            ? known.path + (known.note ? ' - ' + known.note : '')\r\n            : (q.length ? 'Своё название тоже можно - оно уйдёт в задание как есть.' : '');\r\n    }\r\n    if (q.length \u003C 2) return;\r\n\r\n    // Не дёргаем поиск на каждую букву: 137 тысяч строк и LIKE по трём полям.\r\n    clearTimeout(categoryTimer);\r\n    categoryTimer = setTimeout(() =\u003E loadCategorySuggest(q), 250);\r\n}\r\n\r\nasync function loadCategorySuggest(q) {\r\n    const d = await api('categories_catalog', {\r\n        client_id: clientId(), q, malls: selectedMalls().join(','),\r\n    });\r\n    if (!d.ok) return;\r\n\r\n    const list = document.getElementById('taskCategoryList');\r\n    // Уровень пишем словом: выбирать не обязательно самый узкий, и это должно\r\n    // быть видно. «Детская одежда» - осмысленная граница, «Детская одежда /\r\n    // Брюки» уже отрежет половину карточек бренда.\r\n    const levelWord = { 1: 'раздел', 2: 'подраздел', 3: 'тип товара' };\r\n    const mallWord = { ozon: 'Ozon', wildberries: 'WB', yandex_market: 'Маркет' };\r\n    categoryPaths = {};\r\n    list.innerHTML = (d.items || []).map(i =\u003E {\r\n        categoryPaths[i.value] = i;\r\n        // Площадки перечисляем в одной строке, отдельных списков по Ozon и WB\r\n        // нет: человек думает про товар, а не про то, как площадка назвала\r\n        // раздел. Где название есть у обеих - стоят обе метки.\r\n        const malls = (i.malls || []).map(m =\u003E mallWord[m] || m).join(' + ');\r\n        const bits = [esc(i.path), esc(malls)];\r\n        if (i.level) bits.push(levelWord[i.level] || '');\r\n        if (i.note) bits.push(esc(i.note));\r\n        return `\u003Coption value=\"${esc(i.value)}\"\u003E${bits.filter(Boolean).join(' · ')}\u003C/option\u003E`;\r\n    }).join('');\r\n\r\n    const hint = document.getElementById('taskCategoryHint');\r\n    if (hint && d.note) hint.textContent = d.note;\r\n}\r\n\r\n/**\r\n * Предпросмотр задания одной фразой.\r\n *\r\n * Раньше человек нажимал «Создать» и только потом, в таблице ниже, видел, что\r\n * именно он создал. Фраза собирается из тех же полей, что уйдут в задание, и\r\n * сразу показывает, чего не хватает: пустой бренд у первого сбора или ни одной\r\n * отмеченной площадки - это не ошибка сервера, а незаполненная форма.\r\n */\r\nfunction renderTaskPreview() {\r\n    const box = document.getElementById('taskPreview');\r\n    if (!box) return;\r\n\r\n    const kind = document.getElementById('taskKind').value;\r\n    const info = taskInfo[kind] || {};\r\n    const need = info.fields || [];\r\n    const val = id =\u003E (document.getElementById(id) || {}).value?.trim() || '';\r\n\r\n    const brand = val('taskBrand'), skus = val('taskSkus'), category = val('taskCategory');\r\n    const competitors = val('taskCompetitors'), months = val('taskMonths');\r\n    const capCards = val('taskCapCards');\r\n    const malls = selectedMalls();\r\n    const mallWord = { wildberries: 'Wildberries', ozon: 'Ozon', yandex_market: 'Яндекс Маркет' };\r\n\r\n    // Не сбор - объяснять нечего: у классификации и скана нет ни площадок, ни\r\n    // глубины, и фраза про «соберём» была бы неправдой.\r\n    if (!need.includes('brand') && !need.includes('competitors') && !need.includes('skus')) {\r\n        box.innerHTML = `\u003Cspan class=\"muted\"\u003E${esc(info.what || '')}\u003C/span\u003E`;\r\n        return;\r\n    }\r\n\r\n    const missing = [];\r\n    if (info.brand_required && !brand && !skus) missing.push('бренд или товары');\r\n    if (need.includes('competitors') && !competitors) missing.push('бренды конкурентов');\r\n    if (!malls.length) missing.push('площадки');\r\n\r\n    if (missing.length) {\r\n        box.innerHTML = `\u003Cspan class=\"nt-warn\"\u003EНе хватает: ${esc(missing.join(', '))}.\u003C/span\u003E`;\r\n        return;\r\n    }\r\n\r\n    const what = need.includes('competitors') && competitors\r\n        ? `отзывы конкурентов: \u003Cb\u003E${esc(competitors)}\u003C/b\u003E`\r\n        : (skus ? `отзывы по указанным товарам (${skus.split(/[\\s,;]+/).filter(Boolean).length} шт)`\r\n                : `отзывы бренда \u003Cb\u003E${esc(brand)}\u003C/b\u003E`);\r\n\r\n    const where = malls.length ? malls.map(m =\u003E mallWord[m] || m).join(' и ') : '';\r\n    const depth = need.includes('months') && months ? ` за ${esc(months)} мес` : '';\r\n    const inCat = category ? ` в категории «${esc(category)}»` : '';\r\n\r\n    // Потолок называем до нажатия: первая порция это не весь корпус, и узнавать\r\n    // об этом из результата - плохая новость не вовремя.\r\n    const cap = capCards\r\n        ? ` Первым заходом - не больше ${esc(capCards)} карточек, остаток доберём следующим заданием.`\r\n        : '';\r\n\r\n    box.innerHTML = `Соберём ${what}${inCat}${where ? ' на ' + esc(where) : ''}${depth}.${cap}`;\r\n}\r\n\r\nasync function createTask() {\r\n    const res = await apiPost('create_task', {\r\n        client_id: clientId(),\r\n        kind: document.getElementById('taskKind').value,\r\n        brand: document.getElementById('taskBrand').value,\r\n        months: document.getElementById('taskMonths').value,\r\n        competitors: document.getElementById('taskCompetitors').value,\r\n        skus: document.getElementById('taskSkus').value,\r\n        category: document.getElementById('taskCategory').value,\r\n        // Полный путь и площадка - только если категорию выбрали из подсказки.\r\n        // Своё название уходит как есть: обработчик разберётся по нему сам.\r\n        category_path: (categoryPaths[document.getElementById('taskCategory').value.trim()] || {}).path || '',\r\n        category_level: (categoryPaths[document.getElementById('taskCategory').value.trim()] || {}).level || '',\r\n        category_malls: ((categoryPaths[document.getElementById('taskCategory').value.trim()] || {}).malls || []).join(','),\r\n        malls: selectedMalls().join(','),\r\n        cap_cards: document.getElementById('taskCapCards').value,\r\n    });\r\n    if (!res.ok) return Toast.error(res.error);\r\n\r\n    // Показываем цену вопроса до запуска, а не после: сбор идёт часами, и\r\n    // случайно поставленное задание стоит реального времени.\r\n    const est = res.estimate || {};\r\n    const parts = [];\r\n    if (est.minutes) parts.push('оценка работы: ~' + est.minutes + ' мин');\r\n    if (est.requests) parts.push(est.requests + ' обращений к источнику');\r\n    if (est.texts !== undefined) parts.push(est.texts + ' текстов на разметку');\r\n    document.getElementById('taskPreflight').innerHTML =\r\n        '\u003Cdiv class=\"warn-box\" style=\"margin:12px 0 0\"\u003E' +\r\n        '\u003Cb\u003EЗадание #' + res.id + ' создано, но не запущено.\u003C/b\u003E ' + esc(parts.join(' · ')) +\r\n        ((res.warnings || []).length\r\n            ? '\u003Cbr\u003E' + res.warnings.map(w =\u003E '⚠ ' + esc(w)).join('\u003Cbr\u003E') : '') +\r\n        '\u003Cbr\u003EНажмите «Подтвердить» в списке ниже - обработчик берёт только подтверждённые.' +\r\n        '\u003C/div\u003E';\r\n    loadTasks();\r\n}\r\n\r\nasync function approveTask(id) {\r\n    const res = await apiPost('approve_task', { id });\r\n    if (!res.ok) return Toast.error(res.error);\r\n    Toast.success('Подтверждено, задание в очереди');\r\n    loadTasks();\r\n}\r\n\r\nasync function cancelTask(id) {\r\n    const res = await apiPost('cancel_task', { id });\r\n    if (!res.ok) return Toast.error(res.error);\r\n    Toast.success('Отменено');\r\n    loadTasks();\r\n}\r\n\r\nasync function loadAlerts() {\r\n    const d = await api('alerts', { client_id: clientId() });\r\n    const el = document.getElementById('alerts');\r\n    if (!d.ok) { el.innerHTML = `\u003Cdiv class=\"empty\"\u003E${esc(d.error)}\u003C/div\u003E`; return; }\r\n    if (!(d.alerts || []).length) {\r\n        el.innerHTML = `\u003Cdiv class=\"empty\"\u003EАлертов нет. Они появляются после задания «Поиск отклонений».\u003C/div\u003E`;\r\n        return;\r\n    }\r\n    el.innerHTML = `\u003Ctable\u003E\u003Cthead\u003E\u003Ctr\u003E\u003Cth\u003EЧто\u003C/th\u003E\u003Cth\u003EТовар\u003C/th\u003E\u003Cth\u003EПорог\u003C/th\u003E\u003Cth\u003EСостояние\u003C/th\u003E\u003Cth\u003E\u003C/th\u003E\u003C/tr\u003E\u003C/thead\u003E\u003Ctbody\u003E\r\n        ${d.alerts.map(a =\u003E `\u003Ctr\u003E\r\n            \u003Ctd\u003E\u003Cspan class=\"tag ${a.severity === 'critical' ? 'tag-red' : a.severity === 'warning' ? 'tag-yellow' : ''}\"\u003E${esc(a.severity)}\u003C/span\u003E\r\n                \u003Cb style=\"margin-left:6px\"\u003E${esc(a.title)}\u003C/b\u003E\r\n                ${a.detail ? `\u003Cbr\u003E\u003Cspan class=\"muted\" style=\"font-size:11.5px\"\u003E${esc(a.detail)}\u003C/span\u003E` : ''}\u003C/td\u003E\r\n            \u003Ctd\u003E${esc(a.sku_title || '—')}${a.external_sku ? `\u003Cbr\u003E\u003Cspan class=\"muted\" style=\"font-size:11px\"\u003E${esc(a.mall)} ${esc(a.external_sku)}\u003C/span\u003E` : ''}\u003C/td\u003E\r\n            \u003Ctd class=\"muted\" style=\"font-size:11.5px\"\u003E${esc(a.baseline || '')}\u003C/td\u003E\r\n            \u003Ctd\u003E${a.status === 'draft' ? '\u003Cspan class=\"tag tag-yellow\"\u003Eчерновик\u003C/span\u003E'\r\n                : a.status === 'approved' ? '\u003Cspan class=\"tag tag-green\"\u003Eпринят\u003C/span\u003E'\r\n                : a.status === 'sent' ? '\u003Cspan class=\"tag tag-green\"\u003Eотправлен\u003C/span\u003E'\r\n                : '\u003Cspan class=\"tag\"\u003Eотклонён\u003C/span\u003E'}\r\n                ${a.reviewed_by_name ? `\u003Cbr\u003E\u003Cspan class=\"muted\" style=\"font-size:11px\"\u003E${esc(a.reviewed_by_name)}\u003C/span\u003E` : ''}\u003C/td\u003E\r\n            \u003Ctd\u003E${a.status === 'draft' ? `\r\n                \u003Cbutton class=\"btn btn-outline btn-sm\" onclick=\"reviewAlert(${a.id},'approved')\"\u003EПринять\u003C/button\u003E\r\n                \u003Cbutton class=\"btn btn-outline btn-sm\" onclick=\"reviewAlert(${a.id},'rejected')\"\u003EОтклонить\u003C/button\u003E` : ''}\u003C/td\u003E\r\n        \u003C/tr\u003E`).join('')}\u003C/tbody\u003E\u003C/table\u003E`;\r\n}\r\n\r\nasync function reviewAlert(id, decision) {\r\n    const res = await apiPost('review_alert', { id, decision });\r\n    if (!res.ok) return Toast.error(res.error);\r\n    Toast.success(decision === 'approved' ? 'Алерт принят' : 'Алерт отклонён');\r\n    loadAlerts();\r\n}\r\n\r\n// ============ Период ============\r\nconst fmtD = d =\u003E d.toISOString().slice(0, 10);\r\nlet corpusStart = null;\r\n\r\nfunction setPeriod(days, btn) {\r\n    const to = new Date();\r\n    // «Весь период» - от начала данных корпуса, а не наугад.\r\n    const from = days ? new Date(Date.now() - (days - 1) * 86400000)\r\n                      : new Date(corpusStart || '2024-01-01');\r\n    document.getElementById('dateFrom').value = fmtD(from);\r\n    document.getElementById('dateTo').value = fmtD(to);\r\n    document.querySelectorAll('.presets .chip').forEach(c =\u003E c.classList.remove('active'));\r\n    if (btn) btn.classList.add('active');\r\n    loadAnalytics();\r\n}\r\n\r\n// ============ Графики ============\r\nconst charts = {};\r\nconst CSS = v =\u003E getComputedStyle(document.documentElement).getPropertyValue(v).trim();\r\n\r\nfunction drawChart(id, config) {\r\n    const el = document.getElementById(id);\r\n    if (!el) return;\r\n    // Если раньше на месте графика висело объяснение - убираем его.\r\n    const note = el.parentNode.querySelector('.chart-blank');\r\n    if (note) note.remove();\r\n    el.style.display = '';\r\n    if (charts[id]) charts[id].destroy();\r\n    charts[id] = new Chart(el.getContext('2d'), config);\r\n}\r\n\r\n/**\r\n * Пустой график вместо пустого холста.\r\n *\r\n * Пустая рамка не говорит ничего: сломалось, не собрано, не размечено или\r\n * просто период не тот. Пишем причину и следующий шаг - иначе человек идёт\r\n * спрашивать, а не делать.\r\n */\r\nfunction chartBlank(id, html) {\r\n    const el = document.getElementById(id);\r\n    if (!el) return;\r\n    if (charts[id]) { charts[id].destroy(); delete charts[id]; }\r\n    el.style.display = 'none';\r\n\r\n    let note = el.parentNode.querySelector('.chart-blank');\r\n    if (!note) {\r\n        note = document.createElement('div');\r\n        note.className = 'chart-blank';\r\n        el.parentNode.appendChild(note);\r\n    }\r\n    note.innerHTML = html;\r\n}\r\n\r\n/** Почему тематических графиков нет и что с этим делать. */\r\nfunction themesBlankReason(d) {\r\n    const st = d.state || {};\r\n    if (!(+st.reviews)) return '\u003Cb\u003EОтзывов за период нет.\u003C/b\u003E\u003Cbr\u003EСмените период.';\r\n    if (!(+st.themes)) return '\u003Cb\u003EМатрица тем пуста.\u003C/b\u003E\u003Cbr\u003EЗаведите темы ниже.';\r\n    if (!(+st.classified)) {\r\n        return '\u003Cb\u003EСобрано, но не размечено.\u003C/b\u003E\u003Cbr\u003EПоставьте задание «Классификация».';\r\n    }\r\n    return '\u003Cb\u003EЗа период разметки нет.\u003C/b\u003E\u003Cbr\u003EРасширьте период.';\r\n}\r\n\r\nfunction baseOpts() {\r\n    return {\r\n        responsive: true, maintainAspectRatio: false,\r\n        plugins: { legend: { labels: { color: CSS('--text-muted'), font: { size: 11 } } } },\r\n        scales: {\r\n            x: { ticks: { color: CSS('--text-muted'), font: { size: 10 } }, grid: { display: false } },\r\n            y: { ticks: { color: CSS('--text-muted'), font: { size: 10 } },\r\n                 grid: { color: CSS('--border') }, beginAtZero: true },\r\n        },\r\n    };\r\n}\r\n\r\n/**\r\n * Стрелка динамики к прошлому периоду. Цвет по смыслу, а не по направлению:\r\n * рост числа жалоб - это плохо. Изменение меньше 5% считаем шумом.\r\n */\r\nfunction trendMark(now, prev, growthIsGood) {\r\n    // Направление указывать обязательно. Без него функция считала рост плохим\r\n    // по умолчанию, и падение потока отзывов на две трети красилось зелёным.\r\n    if (typeof growthIsGood !== 'boolean') {\r\n        console.warn('trendMark вызван без указания, хорош ли рост:', now, prev);\r\n    }\r\n    now = Number(now) || 0; prev = Number(prev) || 0;\r\n    if (!prev) return now ? '\u003Cspan class=\"trend-flat\"\u003Eновое\u003C/span\u003E' : '';\r\n    const rel = (now - prev) / prev;\r\n    if (Math.abs(rel) \u003C 0.05) return '\u003Cspan class=\"trend-flat\"\u003Eпочти без изменений\u003C/span\u003E';\r\n    const p = Math.round(Math.abs(rel) * 100);\r\n    const up = rel \u003E 0;\r\n    // Цвет по смыслу, а не по направлению: у жалоб хорошо снижение, у похвалы - рост.\r\n    const good = growthIsGood ? up : !up;\r\n    return '\u003Cspan class=\"' + (good ? 'trend-down' : 'trend-up') + '\"\u003E' +\r\n        (up ? 'рост ' : 'снижение ') + p + '%\u003C/span\u003E';\r\n}\r\n\r\n/**\r\n * Вывод словами над числами.\r\n *\r\n * Пять плашек отвечают «сколько», но не отвечают «что происходит»: это\r\n * приходилось складывать в голове, переводя взгляд между KPI, графиком по\r\n * неделям и таблицей товаров. Здесь то же самое сказано одним абзацем - поток и\r\n * его направление, доля негатива против прошлого периода, главная тема и товар,\r\n * где негатив концентрируется.\r\n *\r\n * Ничего не додумываем: если сравнивать не с чем или корпус мал для доли -\r\n * так и написано. Порог тот же, что в сравнении с конкурентами: на корпусе\r\n * меньше 30 отзывов доля скачет от одного отзыва.\r\n */\r\nconst VERDICT_MIN_REVIEWS = 30;\r\n\r\nfunction renderVerdict(d, total, neg) {\r\n    const t = d.totals || {}, prev = d.prev_totals || {};\r\n    const days = (d.period || {}).days || 0;\r\n    const prevTotal = parseInt(prev.total) || 0;\r\n    const prevNeg = parseInt(prev.negative) || 0;\r\n\r\n    const share = total \u003E 0 ? neg / total * 100 : null;\r\n    const prevShare = prevTotal \u003E= VERDICT_MIN_REVIEWS ? prevNeg / prevTotal * 100 : null;\r\n\r\n    const parts = [];\r\n\r\n    // Поток. Рост потока сам по себе не беда - он идёт за продажами; беда,\r\n    // когда он обрывается, потому что тогда и сравнивать нечего.\r\n    let flow = `\u003Cb\u003E${num(total)}\u003C/b\u003E отзывов` + (days ? ` за ${num(days)} дн` : '');\r\n    if (prevTotal \u003E 0) {\r\n        const dPct = (total - prevTotal) / prevTotal * 100;\r\n        flow += Math.abs(dPct) \u003C 5\r\n            ? ', поток как в прошлом периоде'\r\n            : `, поток ${dPct \u003E 0 ? 'вырос' : 'просел'} на ${Math.abs(dPct).toFixed(0)}%`;\r\n        if (dPct \u003C -50) {\r\n            flow += ' \u003Cspan class=\"v-bad\"\u003E- проверьте, не оборвался ли сбор\u003C/span\u003E';\r\n        }\r\n    } else {\r\n        flow += ', сравнивать не с чем - это первый период';\r\n    }\r\n    parts.push(flow);\r\n\r\n    // Доля негатива и её движение.\r\n    if (share === null || total \u003C VERDICT_MIN_REVIEWS) {\r\n        parts.push(`негатива ${num(neg)}; доля не считается - на корпусе меньше `\r\n            + `${VERDICT_MIN_REVIEWS} отзывов процент скачет от одного отзыва`);\r\n    } else {\r\n        let s = `негатив \u003Cb\u003E${share.toFixed(0)}%\u003C/b\u003E потока`;\r\n        if (prevShare !== null) {\r\n            const dPp = share - prevShare;\r\n            s += Math.abs(dPp) \u003C 1\r\n                ? ' - столько же, сколько в прошлом периоде'\r\n                : (dPp \u003E 0\r\n                    ? ` - \u003Cspan class=\"v-bad\"\u003Eна ${dPp.toFixed(0)} п.п. выше\u003C/span\u003E прошлого периода`\r\n                    : ` - \u003Cspan class=\"v-ok\"\u003Eна ${Math.abs(dPp).toFixed(0)} п.п. ниже\u003C/span\u003E прошлого периода`);\r\n        }\r\n        parts.push(s);\r\n    }\r\n\r\n    // Главная тема негатива - если разметка есть.\r\n    const problem = (d.top_themes || []).filter(x =\u003E x.polarity === 'problem')[0];\r\n    if (problem) {\r\n        parts.push(`главная тема - «${esc(problem.title)}», ${num(problem.n)} отзывов`);\r\n    }\r\n\r\n    // Товар, где негатив концентрируется. Смотрим долю внутри товара, а не\r\n    // абсолютное число: у ходового товара негатива всегда больше просто потому,\r\n    // что его больше покупают.\r\n    const skus = (d.skus || []).filter(s =\u003E +s.total \u003E= 10);\r\n    let worst = null;\r\n    skus.forEach(s =\u003E {\r\n        const sh = +s.negative / +s.total;\r\n        if (!worst || sh \u003E worst.share) worst = { row: s, share: sh };\r\n    });\r\n    if (worst && worst.share \u003E (share !== null ? share / 100 : 0)) {\r\n        parts.push(`хуже всего у «${esc((worst.row.title || worst.row.external_sku || '').slice(0, 40))}»`\r\n            + ` - ${(worst.share * 100).toFixed(0)}% негатива из ${num(worst.row.total)} отзывов`);\r\n    }\r\n\r\n    // Что делать дальше - одна строка, по фактическому состоянию.\r\n    const unanswered = parseInt(t.negative_unanswered) || 0;\r\n    let next = '';\r\n    if (unanswered \u003E 0) {\r\n        next = `Без ответа продавца ${num(unanswered)} негативных отзывов - это то, что видно покупателю на карточке.`;\r\n    } else if (!(d.state || {}).classified) {\r\n        next = 'Разметки по темам ещё нет: поставьте классификацию, иначе видно только оценки, а не причины.';\r\n    } else if (!(d.competitors || []).some(c =\u003E !c.is_own)) {\r\n        next = 'Конкуренты не собраны - долю негатива не с чем сравнить: 18% это много или мало, зависит от категории.';\r\n    }\r\n\r\n    return `\u003Cdiv class=\"verdict\"\u003E${parts.join('; ')}.`\r\n        + (next ? `\u003Cdiv class=\"verdict-next\"\u003E${next}\u003C/div\u003E` : '')\r\n        + '\u003C/div\u003E';\r\n}\r\n\r\nasync function loadAnalytics() {\r\n    if (!clientId()) return;\r\n    const d = await api('analytics', {\r\n        client_id: clientId(),\r\n        date_from: document.getElementById('dateFrom').value,\r\n        date_to: document.getElementById('dateTo').value,\r\n        mall: document.getElementById('mallFilter').value,\r\n        brand: currentBrand,\r\n        category: currentCategory,\r\n    });\r\n    const box = document.getElementById('summaryBox');\r\n    if (!d.ok) { box.innerHTML = '\u003Cdiv class=\"empty\"\u003E' + esc(d.error) + '\u003C/div\u003E'; return; }\r\n\r\n    const t = d.totals || {}, prevT = d.prev_totals || {};\r\n    const total = parseInt(t.total) || 0;\r\n\r\n    const grid = document.getElementById('chartsGrid');\r\n    if (!total) {\r\n        box.innerHTML = '\u003Cdiv class=\"empty\"\u003EЗа этот период отзывов нет.\u003Cbr\u003E' +\r\n            'Графики появятся после выполнения задания сбора - поставьте «Бэкфилл истории» ' +\r\n            'и запустите обработчик.\u003C/div\u003E';\r\n        // Пустые графики прячем целиком: четыре серых прямоугольника без данных\r\n        // выглядят сломанным экраном, хотя всё в порядке - сбор ещё не шёл.\r\n        if (grid) grid.style.display = 'none';\r\n        ['chWeekly', 'chThemes', 'chThemeTrend', 'chRatings', 'chCompetitors', 'chCompTrend', 'chCompVolume']\r\n            .forEach(id =\u003E { if (charts[id]) { charts[id].destroy(); delete charts[id]; } });\r\n        document.getElementById('skuTable').innerHTML = '';\r\n        const cw = document.getElementById('competitorsWrap');\r\n        if (cw) cw.style.display = 'none';\r\n        return;\r\n    }\r\n    if (grid) grid.style.display = '';\r\n\r\n    const neg = parseInt(t.negative) || 0;\r\n    box.innerHTML = renderVerdict(d, total, neg) +\r\n        '\u003Cdiv class=\"kpis\" style=\"margin-bottom:14px\"\u003E' +\r\n        // Поток отзывов: рост - хорошо. Он идёт за продажами и даёт материал для\r\n        // анализа, а падение на две трети значит, что или продажи просели, или\r\n        // сбор оборвался. Раньше здесь не передавали направление, и снижение\r\n        // красилось зелёным - как у жалоб.\r\n        '\u003Cdiv class=\"kpi\"\u003E\u003Cdiv class=\"kpi-label\"\u003EОтзывов за период\u003C/div\u003E\u003Cdiv class=\"kpi-value\"\u003E' + num(total) + '\u003C/div\u003E' +\r\n            '\u003Cdiv class=\"kpi-sub\"\u003E' + trendMark(total, prevT.total, true) + '\u003C/div\u003E\u003C/div\u003E' +\r\n        '\u003Cdiv class=\"kpi\"\u003E\u003Cdiv class=\"kpi-label\"\u003EНегатив\u003C/div\u003E\u003Cdiv class=\"kpi-value\"\u003E' + num(neg) + '\u003C/div\u003E' +\r\n            '\u003Cdiv class=\"kpi-sub\"\u003E' + pct(neg, total) + ' потока, ' + trendMark(neg, prevT.negative, false) + '\u003C/div\u003E\u003C/div\u003E' +\r\n        '\u003Cdiv class=\"kpi\"\u003E\u003Cdiv class=\"kpi-label\"\u003EБез ответа продавца\u003C/div\u003E' +\r\n            '\u003Cdiv class=\"kpi-value\" style=\"color:' + (parseInt(t.negative_unanswered) ? 'var(--red)' : 'var(--green)') + '\"\u003E' +\r\n            num(t.negative_unanswered) + '\u003C/div\u003E\u003Cdiv class=\"kpi-sub\"\u003E' + pct(t.negative_unanswered, neg) + ' от негатива\u003C/div\u003E\u003C/div\u003E' +\r\n        '\u003Cdiv class=\"kpi\"\u003E\u003Cdiv class=\"kpi-label\"\u003EСредняя оценка\u003C/div\u003E\u003Cdiv class=\"kpi-value\"\u003E' +\r\n            (t.avg_rating ? Number(t.avg_rating).toFixed(2) : '—') + '\u003C/div\u003E' +\r\n            '\u003Cdiv class=\"kpi-sub\"\u003Eсправка, не триггер\u003C/div\u003E\u003C/div\u003E' +\r\n        '\u003Cdiv class=\"kpi\"\u003E\u003Cdiv class=\"kpi-label\"\u003EТекстовое покрытие\u003C/div\u003E\u003Cdiv class=\"kpi-value\"\u003E' +\r\n            pct(t.with_text, total) + '\u003C/div\u003E\u003Cdiv class=\"kpi-sub\"\u003Eпо текстам строится матрица\u003C/div\u003E\u003C/div\u003E' +\r\n        '\u003C/div\u003E' +\r\n        (d.summary ? '\u003Cdiv class=\"warn-box\" style=\"border-color:var(--accent);background:var(--accent-glow)\"\u003E' +\r\n            '\u003Cb\u003EСаммари обработчика\u003C/b\u003E (' + esc((d.summary.finished_at || '').slice(0, 16)) + '): ' +\r\n            esc((d.summary.result || '').slice(0, 800)) + '\u003C/div\u003E' : '');\r\n\r\n    const wk = d.weekly || [];\r\n    const labels = wk.map(w =\u003E w.wk);\r\n\r\n    drawChart('chWeekly', {\r\n        type: 'line',\r\n        data: {\r\n            labels: labels,\r\n            datasets: [\r\n                { label: 'Всего отзывов', data: wk.map(w =\u003E +w.total), borderColor: CSS('--accent'),\r\n                  backgroundColor: 'rgba(124,92,255,.10)', fill: true, tension: .3, borderWidth: 2, pointRadius: 2 },\r\n                { label: 'Негатив', data: wk.map(w =\u003E +w.negative), borderColor: CSS('--red'),\r\n                  fill: false, tension: .3, borderWidth: 2, pointRadius: 2 },\r\n            ],\r\n        },\r\n        options: baseOpts(),\r\n    });\r\n\r\n    const th = (d.top_themes || []).slice(0, 10);\r\n    const cutTitle = (s, n) =\u003E s.length \u003E n ? s.slice(0, n) + '…' : s;\r\n\r\n    // Оба графика ниже живут на разметке. Нет разметки - вместо пустой рамки\r\n    // пишем причину и следующий шаг.\r\n    const series = d.theme_series || {};\r\n\r\n    if (!th.length) {\r\n        const why = themesBlankReason(d);\r\n        chartBlank('chThemes', why);\r\n        chartBlank('chThemeTrend', why);\r\n        document.getElementById('themesNote').textContent = '';\r\n    } else {\r\n        drawChart('chThemes', {\r\n            type: 'bar',\r\n            data: {\r\n                labels: th.map(x =\u003E cutTitle(x.title, 30)),\r\n                datasets: [{ label: 'Отзывов', data: th.map(x =\u003E +x.n),\r\n                    backgroundColor: th.map(x =\u003E x.polarity === 'praise' ? 'rgba(34,197,94,.65)' : 'rgba(239,68,68,.65)') }],\r\n            },\r\n            options: Object.assign(baseOpts(), { indexAxis: 'y', plugins: { legend: { display: false } } }),\r\n        });\r\n        // Направление считаем по характеру темы: рост жалоб - плохо, рост похвалы -\r\n        // хорошо. Одинаковая раскраска для тех и других врала бы в обе стороны.\r\n        document.getElementById('themesNote').innerHTML = 'К прошлому периоду: '\r\n            + th.slice(0, 3).map(x =\u003E esc(cutTitle(x.title, 20)) + ' — '\r\n                + trendMark(x.n, x.prev, x.polarity === 'praise')).join(' · ');\r\n\r\n        const palette = [CSS('--red'), CSS('--yellow'), CSS('--accent')];\r\n        const codes = Object.keys(series);\r\n\r\n        if (!codes.length) {\r\n            // Темы есть, а недельного разреза нет: так бывает, когда все\r\n            // размеченные отзывы попали в одну неделю периода.\r\n            chartBlank('chThemeTrend', '\u003Cb\u003EДинамику пока не построить.\u003C/b\u003E\u003Cbr\u003E'\r\n                + 'Разметка укладывается в одну неделю — возьмите период длиннее.');\r\n        } else {\r\n            drawChart('chThemeTrend', {\r\n                type: 'line',\r\n                data: {\r\n                    labels: labels,\r\n                    datasets: codes.map((code, i) =\u003E {\r\n                        const found = th.find(x =\u003E x.theme_code === code);\r\n                        return {\r\n                            label: cutTitle(found ? found.title : code, 24),\r\n                            data: labels.map(l =\u003E series[code][l] || 0),\r\n                            borderColor: palette[i % palette.length], fill: false, tension: .3,\r\n                            borderWidth: 2, pointRadius: 2,\r\n                        };\r\n                    }),\r\n                },\r\n                options: baseOpts(),\r\n            });\r\n        }\r\n    }\r\n\r\n    const rt = d.ratings || [];\r\n    drawChart('chRatings', {\r\n        type: 'bar',\r\n        data: {\r\n            labels: rt.map(r =\u003E r.rating + '*'),\r\n            datasets: [{ label: 'Отзывов', data: rt.map(r =\u003E +r.n),\r\n                backgroundColor: rt.map(r =\u003E +r.rating \u003C= 3 ? 'rgba(239,68,68,.65)' : 'rgba(34,197,94,.65)') }],\r\n        },\r\n        options: Object.assign(baseOpts(), { plugins: { legend: { display: false } } }),\r\n    });\r\n\r\n    const skus = d.skus || [];\r\n    document.getElementById('skuTable').innerHTML = skus.length\r\n        ? '\u003Cdiv class=\"chart-head\"\u003EТовары: где концентрируется негатив\u003C/div\u003E' +\r\n          '\u003Ctable\u003E\u003Cthead\u003E\u003Ctr\u003E\u003Cth\u003EТовар\u003C/th\u003E\u003Cth\u003EПлощадка\u003C/th\u003E\u003Cth class=\"num\"\u003EОтзывов\u003C/th\u003E' +\r\n          '\u003Cth class=\"num\"\u003EНегатив\u003C/th\u003E\u003Cth class=\"num\"\u003EДоля\u003C/th\u003E\u003Cth class=\"num\"\u003EБез ответа\u003C/th\u003E' +\r\n          '\u003Cth class=\"num\"\u003EОценка\u003C/th\u003E\u003C/tr\u003E\u003C/thead\u003E\u003Ctbody\u003E' +\r\n          skus.map(x =\u003E '\u003Ctr\u003E\u003Ctd\u003E' + esc((x.title || x.external_sku || '').slice(0, 60)) + '\u003C/td\u003E' +\r\n            '\u003Ctd\u003E' + esc(x.mall) + '\u003C/td\u003E\u003Ctd class=\"num\"\u003E' + num(x.total) + '\u003C/td\u003E' +\r\n            '\u003Ctd class=\"num\"\u003E' + num(x.negative) + '\u003C/td\u003E\u003Ctd class=\"num\"\u003E' + pct(x.negative, x.total) + '\u003C/td\u003E' +\r\n            '\u003Ctd class=\"num\" style=\"color:' + (+x.unanswered ? 'var(--red)' : 'inherit') + '\"\u003E' + num(x.unanswered) + '\u003C/td\u003E' +\r\n            '\u003Ctd class=\"num\"\u003E' + (x.avg_rating === null ? '—' : x.avg_rating) + '\u003C/td\u003E\u003C/tr\u003E').join('') +\r\n          '\u003C/tbody\u003E\u003C/table\u003E'\r\n        : '';\r\n\r\n    renderCompetitors(d);\r\n}\r\n\r\n/**\r\n * Конкуренты. Свой бренд и до пяти конкурентов в одной системе координат:\r\n * доля негатива и как она меняется. Абсолютное число отзывов сравнивать\r\n * бессмысленно - у конкурента может быть вдесятеро больше карточек.\r\n */\r\n/**\r\n * Что именно собрано по брендам - словами и по группам.\r\n *\r\n * Раньше в пояснении стояло одно на все случаи: «у конкурентов собран только\r\n * негатив». Это перестало быть правдой: по части брендов собирается весь поток,\r\n * по части - оба полюса выборочно. Текст должен совпадать с базой, иначе он\r\n * объясняет не то, что человек видит.\r\n */\r\nfunction scopeSummary(items) {\r\n    const names = {\r\n        negative_only: 'только жалобы',\r\n        positive_only: 'только похвала',\r\n        mixed_partial: 'оба полюса, но выборочно',\r\n        full: 'весь поток',\r\n    };\r\n    const groups = {};\r\n    items.forEach(c =\u003E {\r\n        const key = c.scope || 'full';\r\n        (groups[key] = groups[key] || []).push(c.label);\r\n    });\r\n    return Object.entries(groups)\r\n        .map(([scope, labels]) =\u003E (names[scope] || scope) + ' — ' + labels.join(', '))\r\n        .join('; ');\r\n}\r\n\r\nfunction renderCompetitors(d) {\r\n    const wrap = document.getElementById('competitorsWrap');\r\n    const comp = d.competitors || [];\r\n    if (!wrap) return;\r\n    if (!comp.length) {\r\n        wrap.style.display = 'none';\r\n        return;\r\n    }\r\n    wrap.style.display = '';\r\n\r\n    // Доля негатива - только по брендам с полным сбором. У кого собран один\r\n    // негатив, доля равна 100% по построению: это артефакт отбора, а не оценка\r\n    // бренда. Такие бренды сравниваем по объёму негатива, отдельным графиком.\r\n    // В график попадают все, у кого доля вообще посчиталась. Раньше одна\r\n    // выборочная карточка отменяла долю у целого бренда, и график пустовал при\r\n    // трёх полных корпусах по двести отзывов.\r\n    const full = comp.filter(c =\u003E c.neg_share !== null && c.neg_share !== undefined);\r\n    const partial = comp.filter(c =\u003E c.neg_share === null || c.neg_share === undefined);\r\n\r\n    if (full.length \u003E 1) {\r\n        drawChart('chCompetitors', {\r\n            type: 'bar',\r\n            data: {\r\n                labels: full.map(c =\u003E c.label.length \u003E 18 ? c.label.slice(0, 18) + '…' : c.label),\r\n                datasets: [{\r\n                    label: 'Доля негатива, %',\r\n                    data: full.map(c =\u003E c.neg_share),\r\n                    backgroundColor: full.map(c =\u003E c.is_own ? 'rgba(124,92,255,.75)' : 'rgba(148,163,184,.55)'),\r\n                }],\r\n            },\r\n            options: Object.assign(baseOpts(), { plugins: { legend: { display: false } } }),\r\n        });\r\n        // Пишем основание расчёта: по скольким отзывам посчитана доля. Процент\r\n        // без основания читается как оценка бренда, хотя может стоять на трёх\r\n        // десятках отзывов.\r\n        const basis = full.map(c =\u003E esc(c.label) + ' — ' + num(c.share_reviews) + ' отз.').join(', ');\r\n        document.getElementById('compShareNote').innerHTML =\r\n            'Доля считается по полностью собранным карточкам: ' + basis + '.'\r\n            + (partial.length ? ' Данных не хватило: ' + scopeSummary(partial) + '.' : '');\r\n    } else {\r\n        if (charts['chCompetitors']) { charts['chCompetitors'].destroy(); delete charts['chCompetitors']; }\r\n\r\n        // Текст собираем по фактической полноте сбора, а не по одному\r\n        // предположению «у конкурентов только негатив». Полнота у брендов\r\n        // разная: где-то собран весь поток, где-то только жалобы, где-то оба\r\n        // полюса выборочно - и объяснение должно совпадать с тем, что в базе.\r\n        document.getElementById('compShareNote').innerHTML =\r\n            '\u003Cb\u003EДоля негатива не показана.\u003C/b\u003E ' + (full.length === 1\r\n                ? 'Полный корпус есть только у одного бренда — сравнивать долю не с кем. '\r\n                : 'Ни по одному бренду нет полного корпуса от ' + num(30) + ' отзывов. ')\r\n            + (partial.length ? 'Что собрано: ' + scopeSummary(partial) + '. ' : '')\r\n            + 'Доля негатива честна только при полном сборе: если собирали одни жалобы, '\r\n            + 'она по построению равна сотне процентов. Сравниваем объём негатива справа.';\r\n    }\r\n\r\n    // Объём негатива по неделям: единственная честная ось, когда сборы разной полноты.\r\n    const volLabels = d.competitor_weeks || [];\r\n    const vol = d.competitor_volume || {};\r\n    const palette0 = [CSS('--accent'), CSS('--red'), CSS('--yellow'), CSS('--green'), '#0ea5e9', '#a855f7'];\r\n    drawChart('chCompVolume', {\r\n        type: 'line',\r\n        data: {\r\n            labels: volLabels,\r\n            datasets: Object.keys(vol).map((k, i) =\u003E ({\r\n                label: k.length \u003E 16 ? k.slice(0, 16) + '…' : k,\r\n                data: volLabels.map(l =\u003E vol[k][l] === undefined ? null : vol[k][l]),\r\n                borderColor: palette0[i % palette0.length],\r\n                borderWidth: comp.find(c =\u003E c.label === k && c.is_own) ? 3 : 2,\r\n                fill: false, tension: .3, pointRadius: 2, spanGaps: true,\r\n            })),\r\n        },\r\n        options: baseOpts(),\r\n    });\r\n\r\n    const labels = (d.competitor_weeks || []);\r\n    const series = d.competitor_series || {};\r\n    const base = d.competitor_base || {};\r\n    const palette = [CSS('--accent'), CSS('--red'), CSS('--yellow'), CSS('--green'), '#0ea5e9', '#a855f7'];\r\n    const fullLabels = new Set(full.map(c =\u003E c.label));\r\n    const fullKeys = Object.keys(series).filter(k =\u003E fullLabels.has(k));\r\n\r\n    // Одна линия и одна ось. Объём недели показываем размером точки, а не\r\n    // второй серией: столбики базы рядом с линией доли читались как второй\r\n    // бренд, а в подсказке было видно только одно число из двух.\r\n    // Маленькая точка = маленькая база = долю двигает один отзыв.\r\n    const dotFor = n =\u003E n === undefined || n === null ? 2\r\n        : Math.max(2, Math.min(8, Math.round(2 + n / 9)));\r\n\r\n    drawChart('chCompTrend', {\r\n        type: 'line',\r\n        data: {\r\n            labels: labels,\r\n            datasets: fullKeys.map((k, i) =\u003E ({\r\n                label: k.length \u003E 16 ? k.slice(0, 16) + '…' : k,\r\n                data: labels.map(l =\u003E series[k][l] === undefined ? null : series[k][l]),\r\n                borderColor: palette[i % palette.length],\r\n                backgroundColor: palette[i % palette.length],\r\n                borderWidth: comp.find(c =\u003E c.label === k && c.is_own) ? 3 : 2,\r\n                fill: false, tension: .3, spanGaps: true,\r\n                pointRadius: labels.map(l =\u003E dotFor(base[k] && base[k][l])),\r\n                pointHoverRadius: labels.map(l =\u003E dotFor(base[k] && base[k][l]) + 2),\r\n            })),\r\n        },\r\n        options: Object.assign(baseOpts(), {\r\n            scales: Object.assign(baseOpts().scales, {\r\n                y: { ticks: { color: CSS('--text-muted'), font: { size: 10 },\r\n                              callback: v =\u003E v + '%' },\r\n                     grid: { color: CSS('--border') }, beginAtZero: true },\r\n            }),\r\n            plugins: {\r\n                legend: { labels: { color: CSS('--text-muted'), font: { size: 11 } } },\r\n                tooltip: {\r\n                    callbacks: {\r\n                        // В подсказке - откуда взялась доля. «15,4%» ни о чём не\r\n                        // говорит, «2 из 13 отзывов» говорит всё.\r\n                        label: ctx =\u003E {\r\n                            const k = fullKeys[ctx.datasetIndex];\r\n                            const wk = labels[ctx.dataIndex];\r\n                            const b = base[k] && base[k][wk];\r\n                            const n = vol[k] && vol[k][wk];\r\n                            return ctx.dataset.label + ': ' + ctx.parsed.y + '%'\r\n                                + (b ? '  (' + (n || 0) + ' из ' + b + ' отзывов)' : '');\r\n                        },\r\n                    },\r\n                },\r\n            },\r\n        }),\r\n    });\r\n\r\n    document.getElementById('competitorsTable').innerHTML =\r\n        '\u003Ctable\u003E\u003Cthead\u003E\u003Ctr\u003E\u003Cth\u003EБренд\u003C/th\u003E\u003Cth class=\"num\"\u003EТоваров\u003C/th\u003E\u003Cth class=\"num\"\u003EОтзывов\u003C/th\u003E' +\r\n        '\u003Cth class=\"num\"\u003EНегатив\u003C/th\u003E\u003Cth class=\"num\"\u003EДоля негатива\u003C/th\u003E\u003Cth class=\"num\"\u003EОценка\u003C/th\u003E' +\r\n        '\u003Cth class=\"num\"\u003EБез ответа\u003C/th\u003E\u003C/tr\u003E\u003C/thead\u003E\u003Ctbody\u003E' +\r\n        comp.map(c =\u003E '\u003Ctr' + (c.is_own ? ' style=\"background:var(--accent-glow)\"' : '') + '\u003E' +\r\n            '\u003Ctd\u003E' + (c.is_own ? '\u003Cb\u003E' + esc(c.label) + '\u003C/b\u003E \u003Cspan class=\"tag tag-accent\"\u003Eмы\u003C/span\u003E' : esc(c.label)) + '\u003C/td\u003E' +\r\n            '\u003Ctd class=\"num\"\u003E' + num(c.skus) + '\u003C/td\u003E\u003Ctd class=\"num\"\u003E' + num(c.total) + '\u003C/td\u003E' +\r\n            '\u003Ctd class=\"num\"\u003E' + num(c.negative) + '\u003C/td\u003E' +\r\n            '\u003Ctd class=\"num\"\u003E' + (c.partial\r\n                ? '\u003Cspan class=\"muted\"\u003E' + (c.scope === 'positive_only' ? 'только позитив'\r\n                    : (c.scope === 'mixed_partial' ? 'позитив + негатив, выборочно' : 'только негатив')) + '\u003C/span\u003E'\r\n                : pct(c.negative, c.total)) + '\u003C/td\u003E' +\r\n            '\u003Ctd class=\"num\"\u003E' + (c.avg_rating === null ? '—' : c.avg_rating) + '\u003C/td\u003E' +\r\n            '\u003Ctd class=\"num\"\u003E' + num(c.unanswered) + '\u003C/td\u003E\u003C/tr\u003E').join('') +\r\n        '\u003C/tbody\u003E\u003C/table\u003E';\r\n}\r\n\r\nasync function exportReport() {\r\n    const msg = document.getElementById('exportMsg');\r\n    msg.textContent = 'Собираю файл…';\r\n    const d = await api('export', {\r\n        client_id: clientId(),\r\n        date_from: document.getElementById('dateFrom').value,\r\n        date_to: document.getElementById('dateTo').value,\r\n    });\r\n    if (!d.ok) { msg.innerHTML = '\u003Cspan style=\"color:var(--red)\"\u003E' + esc(d.error) + '\u003C/span\u003E'; return; }\r\n    msg.innerHTML = 'Готово: \u003Ca href=\"' + esc(d.url) + '\" download style=\"color:var(--accent)\"\u003E' +\r\n        esc(d.file) + '\u003C/a\u003E — темы ' + num(d.rows.themes) + ', товары ' + num(d.rows.skus) +\r\n        ', негатив с текстом ' + num(d.rows.negative) + ' строк.';\r\n}\r\n\r\n/**\r\n * Тексты отзывов - сырьё для матрицы тем и проверка того, что собралось.\r\n *\r\n * Показываем страницами по 50: тысяча отзывов на одной странице не читается,\r\n * а матрица собирается по первым двум-трём десяткам.\r\n */\r\n/** Открыли блок - грузим. Закрыли - ничего не делаем, запрос не нужен. */\r\nfunction onTextsToggle() {\r\n    if (document.getElementById('textsCard').open) loadTexts(0);\r\n}\r\n\r\nasync function loadTexts(offset = 0) {\r\n    const el = document.getElementById('texts');\r\n    if (!clientId()) return;\r\n\r\n    const d = await api('texts', {\r\n        client_id: clientId(),\r\n        date_from: document.getElementById('dateFrom').value,\r\n        date_to: document.getElementById('dateTo').value,\r\n        only: document.getElementById('textsFilter').value,\r\n        brand: currentBrand,\r\n        category: currentCategory,\r\n        offset,\r\n    });\r\n    if (!d.ok) { el.innerHTML = `\u003Cdiv class=\"empty\"\u003E${esc(d.error)}\u003C/div\u003E`; return; }\r\n\r\n    const cnt = document.getElementById('textsCount');\r\n    if (!(d.rows || []).length) {\r\n        cnt.textContent = '';\r\n        el.innerHTML = `\u003Cdiv class=\"empty\"\u003EПод этот фильтр текстов нет.\r\n            Если отзывы собраны, но текстов ноль - значит собрались одни оценки без слов,\r\n            и классифицировать пока нечего.\u003C/div\u003E`;\r\n        return;\r\n    }\r\n\r\n    cnt.textContent = 'Всего под фильтр: ' + num(d.total)\r\n        + ' · показаны ' + (d.offset + 1) + '–' + (d.offset + d.rows.length);\r\n    document.getElementById('textsBadge').textContent = num(d.total) + ' под текущим фильтром';\r\n\r\n    el.innerHTML = `\u003Ctable\u003E\u003Cthead\u003E\u003Ctr\u003E\u003Cth\u003EДата\u003C/th\u003E\u003Cth\u003EОценка\u003C/th\u003E\u003Cth\u003EТовар\u003C/th\u003E\r\n        \u003Cth\u003EТекст\u003C/th\u003E\u003Cth\u003EТемы\u003C/th\u003E\u003Cth\u003EОтвет\u003C/th\u003E\u003C/tr\u003E\u003C/thead\u003E\u003Ctbody\u003E\r\n        ${d.rows.map(r =\u003E `\u003Ctr\u003E\r\n            \u003Ctd class=\"muted\" style=\"white-space:nowrap\"\u003E${esc((r.created_at||'').slice(0,10))}\u003C/td\u003E\r\n            \u003Ctd class=\"num\"\u003E${r.rating || '—'}\u003C/td\u003E\r\n            \u003Ctd style=\"max-width:180px\"\u003E${esc(r.title || r.external_sku || '')}\u003C/td\u003E\r\n            \u003Ctd class=\"rv-text\"\u003E${esc(r.text || '')}\u003C/td\u003E\r\n            \u003Ctd\u003E${r.themes ? esc(r.themes) : '\u003Cspan class=\"muted\"\u003Eне размечен\u003C/span\u003E'}\u003C/td\u003E\r\n            \u003Ctd\u003E${r.answer_text ? '\u003Cspan class=\"tag tag-green\"\u003Eесть\u003C/span\u003E'\r\n                                : '\u003Cspan class=\"tag tag-red\"\u003Eнет\u003C/span\u003E'}\u003C/td\u003E\r\n        \u003C/tr\u003E`).join('')}\u003C/tbody\u003E\u003C/table\u003E\r\n        \u003Cdiv class=\"row\" style=\"margin-top:10px;gap:8px\"\u003E\r\n            ${d.offset \u003E 0 ? `\u003Cbutton class=\"btn btn-outline btn-sm\"\r\n                onclick=\"loadTexts(${Math.max(0, d.offset - 50)})\"\u003E← Назад\u003C/button\u003E` : ''}\r\n            ${d.offset + d.rows.length \u003C d.total ? `\u003Cbutton class=\"btn btn-outline btn-sm\"\r\n                onclick=\"loadTexts(${d.offset + 50})\"\u003EЕщё 50 →\u003C/button\u003E` : ''}\r\n        \u003C/div\u003E`;\r\n}\r\n\r\n/**\r\n * Находки: что зарождается и что выросло.\r\n *\r\n * Показываем списком, а не графиком: по находке принимают решение - завести\r\n * тему или отклонить, - а по столбику решение не принимают.\r\n */\r\n\r\n/**\r\n * Состав наблюдения по текущему бренду.\r\n *\r\n * Снятый товар остаётся в базе вместе с отзывами - его просто не видно в\r\n * сводках. Так возврат стоит одного нажатия, а не повторного сбора.\r\n */\r\nasync function onSkusToggle() {\r\n    const card = document.getElementById('skuCard');\r\n    if (card && card.open) loadSkus();\r\n}\r\n\r\nasync function loadSkus() {\r\n    const el = document.getElementById('skuList');\r\n    if (!el || !clientId()) return;\r\n\r\n    const d = await api('skus', { client_id: clientId(), brand: currentBrand });\r\n    if (!d.ok) { el.innerHTML = `\u003Cdiv class=\"empty\"\u003E${esc(d.error)}\u003C/div\u003E`; return; }\r\n    if (!(d.skus || []).length) { el.innerHTML = '\u003Cdiv class=\"empty\"\u003EТоваров нет\u003C/div\u003E'; return; }\r\n\r\n    const on = d.skus.filter(s =\u003E +s.is_active).length;\r\n    el.innerHTML = `\u003Cdiv class=\"muted\" style=\"font-size:12px;margin-bottom:8px\"\u003E\r\n            Под наблюдением ${on} из ${d.skus.length}. Снятый товар не попадает в сводки,\r\n            но отзывы по нему остаются в базе.\r\n        \u003C/div\u003E\r\n        \u003Ctable\u003E\u003Cthead\u003E\u003Ctr\u003E\u003Cth\u003E\u003C/th\u003E\u003Cth\u003EТовар\u003C/th\u003E\u003Cth\u003EКатегория\u003C/th\u003E\r\n            \u003Cth class=\"num\"\u003EОтзывов\u003C/th\u003E\u003Cth class=\"num\"\u003EНегатив\u003C/th\u003E\u003Cth\u003EСвежий\u003C/th\u003E\u003C/tr\u003E\u003C/thead\u003E\u003Ctbody\u003E\r\n        ${d.skus.map(s =\u003E `\u003Ctr${+s.is_active ? '' : ' style=\"opacity:.5\"'}\u003E\r\n            \u003Ctd\u003E\u003Cinput type=\"checkbox\" ${+s.is_active ? 'checked' : ''}\r\n                       onchange=\"toggleSku(${s.id}, this.checked)\"\u003E\u003C/td\u003E\r\n            \u003Ctd\u003E${esc(s.title || s.external_sku)}\r\n                \u003Cdiv class=\"muted\" style=\"font-size:11px\"\u003E${esc(s.brand || '')} · ${esc(s.external_sku)}\u003C/div\u003E\u003C/td\u003E\r\n            \u003Ctd class=\"muted\"\u003E${esc(s.category || '—')}\u003C/td\u003E\r\n            \u003Ctd class=\"num\"\u003E${num(s.reviews)}\u003C/td\u003E\r\n            \u003Ctd class=\"num\"\u003E${num(s.negative || 0)}\u003C/td\u003E\r\n            \u003Ctd class=\"muted\"\u003E${esc(s.last_review || '—')}\u003C/td\u003E\r\n        \u003C/tr\u003E`).join('')}\u003C/tbody\u003E\u003C/table\u003E`;\r\n}\r\n\r\nasync function toggleSku(id, active) {\r\n    const res = await apiPost('toggle_sku', { id, active: active ? '1' : '0' });\r\n    if (!res.ok) { Toast.error(res.error); loadSkus(); return; }\r\n    if (res.notice) Toast.warning(res.notice); else Toast.success('Товар вернулся под наблюдение');\r\n    loadSkus(); loadBrands(); loadOverview(); loadAnalytics();\r\n}\r\n/**\r\n * Вкладки брендов.\r\n *\r\n * Выбранный бренд запоминается вместе с клиентом: аналитик работает по одному\r\n * бренду подряд, и сбрасывать выбор при каждом обновлении - мучение. Ключ\r\n * привязан к клиенту, иначе бренд одного клиента подставлялся бы другому.\r\n */\r\nlet currentBrand = '';\r\nlet currentCategory = '';\r\nlet brandsCache = [];\r\n// Выключены ли категории у клиента: сервер в этом случае их не отдаёт вовсе,\r\n// и без флага кнопку «вернуть категории» было бы негде показать.\r\nlet brandsCategoriesOff = false;\r\n\r\nfunction brandKey() { return 'reviews.brand.' + clientId(); }\r\n\r\nasync function loadBrands() {\r\n    const box = document.getElementById('brandTabs');\r\n    if (!box || !clientId()) return;\r\n\r\n    const d = await api('brands', { client_id: clientId() });\r\n    if (!d.ok) { box.innerHTML = ''; return; }\r\n\r\n    const brands = (d.brands || []).filter(b =\u003E +b.reviews \u003E 0 || +b.skus \u003E 0);\r\n\r\n    brandsCache = brands;\r\n    brandsCategoriesOff = !!d.categories_off;\r\n\r\n    // Вкладка привязана к бренду: одна вкладка - один бренд. По умолчанию\r\n    // открывается самый крупный, а не «все сразу»: общая сводка по разным\r\n    // продуктам смешивает несмешиваемое.\r\n    // Бренд выбран всегда: раздел показывает одну сущность за раз. Пустое\r\n    // значение означало «все вместе» и смешивало разные продукты в одной доле\r\n    // негатива - число, которое выглядит осмысленным и не значит ничего.\r\n    const saved = localStorage.getItem(brandKey()) || '';\r\n    const firstOwn = brands.find(b =\u003E !+b.is_resale);\r\n    currentBrand = brands.some(b =\u003E b.brand === saved) ? saved\r\n                 : (firstOwn ? firstOwn.brand : (brands.length ? brands[0].brand : ''));\r\n\r\n    if (brands.length \u003C= 1) {\r\n        // Один бренд - вкладок не нужно, но название показываем: без него на\r\n        // экране безымянный «клиент», и какой корпус открыт, непонятно.\r\n        currentBrand = brands.length ? brands[0].brand : '';\r\n        box.innerHTML = brands.length\r\n            ? `\u003Cdiv class=\"brand-single\"\u003EБренд: \u003Cb\u003E${esc(brands[0].brand || 'без названия')}\u003C/b\u003E\r\n                 \u003Cspan class=\"muted\"\u003E· товаров ${brands[0].active_skus} из ${brands[0].skus},\r\n                 отзывов ${num(brands[0].reviews)}\u003C/span\u003E\u003C/div\u003E`\r\n            : '';\r\n    } else {\r\n        // Свои бренды и перепродажа - разные вещи, и в одном ряду их путают.\r\n        // Жалоба на чужой роутер, который клиент просто перепродаёт, ничего не\r\n        // говорит о его собственном бренде, поэтому в «Все свои» она не входит.\r\n        const own = brands.filter(b =\u003E !+b.is_resale);\r\n        const resale = brands.filter(b =\u003E +b.is_resale);\r\n\r\n        const tab = b =\u003E `\r\n            \u003Cbutton class=\"brand-tab${b.brand === currentBrand ? ' active' : ''}\"\r\n                    onclick=\"setBrand(${JSON.stringify(b.brand).replace(/\"/g, '&quot;')})\"\u003E\r\n                ${esc(b.brand || 'Без бренда')}\r\n                \u003Cspan class=\"brand-tab-n\"\u003E${num(b.reviews)}\u003C/span\u003E\r\n            \u003C/button\u003E`;\r\n\r\n        box.innerHTML = own.map(tab).join('')\r\n            + (resale.length\r\n                ? `\u003Cspan class=\"brand-group\"\u003Eперепродажа:\u003C/span\u003E` + resale.map(tab).join('')\r\n                : '');\r\n    }\r\n\r\n    renderCategories();\r\n}\r\n\r\n/**\r\n * Категории внутри бренда.\r\n *\r\n * Показываем только когда их больше одной: у бренда это роутеры и ключи от\r\n * домофона, и жалобы у них разные - «не активируется» против «теряет сеть».\r\n * Список из одного пункта только занимал бы место.\r\n */\r\nfunction renderCategories() {\r\n    const box = document.getElementById('brandCats');\r\n    if (!box) return;\r\n\r\n    const brand = brandsCache.find(b =\u003E b.brand === currentBrand);\r\n    const cats = (brand && brand.categories) ? brand.categories : [];\r\n\r\n    if (brandsCategoriesOff) {\r\n        // Выключено осознанно - но выход должен быть виден, иначе решение\r\n        // становится необратимым для того, кто его не принимал.\r\n        currentCategory = '';\r\n        box.innerHTML = '\u003Cspan class=\"muted\" style=\"font-size:12px\"\u003EКатегории выключены: '\r\n            + 'сводка считается по бренду целиком.\u003C/span\u003E '\r\n            + '\u003Cbutton class=\"btn btn-outline btn-sm\" onclick=\"setCategoriesOff(false)\"\u003EВернуть категории\u003C/button\u003E';\r\n        return;\r\n    }\r\n\r\n    if (!currentBrand || cats.length \u003C= 1) {\r\n        currentCategory = '';\r\n        box.innerHTML = '';\r\n        return;\r\n    }\r\n\r\n    if (!cats.some(c =\u003E c.category === currentCategory)) currentCategory = '';\r\n\r\n    box.innerHTML = '\u003Cspan class=\"muted\" style=\"font-size:12px\"\u003EКатегория:\u003C/span\u003E '\r\n        + `\u003Cselect class=\"select brand-cat-select\" onchange=\"setCategory(this.value)\"\u003E\r\n             \u003Coption value=\"\"\u003EВсе категории (${cats.length})\u003C/option\u003E\r\n             ${cats.map(c =\u003E `\u003Coption value=\"${esc(c.category)}\"\r\n                ${c.category === currentCategory ? 'selected' : ''}\u003E\r\n                ${esc(c.category)} — ${num(c.reviews)}\u003C/option\u003E`).join('')}\r\n           \u003C/select\u003E`\r\n        // Категории приезжают из источника вместе с карточками и бывают\r\n        // мусорными - тогда сводка фильтрует по несуществующей категории и\r\n        // выглядит пустой. Раньше это лечилось правкой app_settings руками:\r\n        // менеджер сделать этого не мог и видел «поломку».\r\n        + ` \u003Cbutton class=\"btn btn-outline btn-sm\" style=\"margin-left:8px\"\r\n              onclick=\"setCategoriesOff(true)\"\r\n              title=\"Считать по бренду целиком, не разбивая на товарные линейки\"\u003EНе делить на категории\u003C/button\u003E`;\r\n}\r\n\r\n/** Включить или выключить разбивку на категории внутри бренда. */\r\nasync function setCategoriesOff(off) {\r\n    const res = await apiPost('set_categories_off', { client_id: clientId(), off: off ? '1' : '0' });\r\n    if (!res.ok) return Toast.error(res.error);\r\n    Toast.success(res.notice);\r\n    currentCategory = '';\r\n    loadBrands();\r\n}\r\n\r\nfunction setCategory(cat) {\r\n    currentCategory = cat || '';\r\n    loadOverview(); loadAnalytics();\r\n    const card = document.getElementById('textsCard');\r\n    if (card && card.open) loadTexts(0);\r\n}\r\n\r\nfunction setBrand(brand) {\r\n    currentBrand = brand || '';\r\n    // Категория принадлежит бренду: при смене бренда прежний выбор бессмыслен.\r\n    currentCategory = '';\r\n    localStorage.setItem(brandKey(), currentBrand);\r\n    loadBrands();\r\n    loadOverview(); loadAnalytics(); loadTrends();\r\n    const skus = document.getElementById('skuCard');\r\n    if (skus && skus.open) loadSkus();\r\n    const card = document.getElementById('textsCard');\r\n    if (card && card.open) loadTexts(0);\r\n    if (activeReviewsMode === 'beta') loadCoordinationBeta();\r\n}\r\nasync function loadTrends() {\r\n    const em = document.getElementById('trendsEmerging');\r\n    const mo = document.getElementById('trendsMomentum');\r\n    const meta = document.getElementById('trendsMeta');\r\n    if (!em) return;\r\n\r\n    const d = await api('trends', { client_id: clientId(), brand: currentBrand });\r\n    if (!d.ok) { em.innerHTML = `\u003Cdiv class=\"empty\"\u003E${esc(d.error)}\u003C/div\u003E`; return; }\r\n\r\n    if (d.no_table) {\r\n        em.innerHTML = mo.innerHTML =\r\n            '\u003Cdiv class=\"empty\"\u003EРаздел не готов: не применена миграция rv_trend.\u003C/div\u003E';\r\n        return;\r\n    }\r\n\r\n    // Одна короткая строка: и что это за блок, и по каким правилам искали.\r\n    meta.textContent = 'Повторы среди отзывов без темы. Окно ' + d.window_days\r\n        + ' дней, порог от ' + d.min_reviews + '.';\r\n\r\n    // Карточка находки компактная: она стоит в одной сетке с графиками, и\r\n    // места здесь столько же, сколько у графика. Цитату показываем одну -\r\n    // остальные видно по клику на отзывы.\r\n    const card = (t, isEmerging) =\u003E {\r\n        // Цитаты и числа выбирает общий модуль: у устаревшей находки он берёт\r\n        // первую цитату (по ней её можно узнать и через полгода) и показывает\r\n        // пик вместо текущей недели.\r\n        //\r\n        // Разметку собирает общий модуль (js/service_panels.js) - тот же, что в\r\n        // кабинете клиента. Здесь добавляются только кнопки решения: судьбу\r\n        // находки определяет менеджер, и это единственное отличие ролей.\r\n        return ServicePanels.trendCard({ ...t, kind: isEmerging ? 'emerging' : 'momentum' }, {\r\n            quotes: 1,\r\n            actions: (x) =\u003E x.status === 'new'\r\n                ? `${isEmerging ? `\u003Cbutton class=\"btn btn-primary btn-sm\"\r\n                        onclick=\"decideTrend(${x.id},'added')\"\u003EВ матрицу\u003C/button\u003E` : ''}\r\n                   \u003Cbutton class=\"btn btn-outline btn-sm\"\r\n                        onclick=\"decideTrend(${x.id},'dismissed')\"\u003EНе надо\u003C/button\u003E`\r\n                : '\u003Cspan class=\"tag tag-green\"\u003Eпринято\u003C/span\u003E',\r\n        });\r\n    };\r\n\r\n    em.innerHTML = d.emerging.length\r\n        ? d.emerging.map(t =\u003E card(t, true)).join('')\r\n        : '\u003Cdiv class=\"empty\"\u003EПовторов нет — это хорошая новость.\u003C/div\u003E';\r\n\r\n    mo.innerHTML = d.momentum.length\r\n        ? d.momentum.map(t =\u003E card(t, false)).join('')\r\n        : '\u003Cdiv class=\"empty\"\u003EНи одна тема не выросла выше порога.\u003C/div\u003E';\r\n}\r\n\r\nasync function decideTrend(id, decision) {\r\n    if (decision === 'dismissed' && !confirm('Убрать находку? Больше она показываться не будет.')) return;\r\n    const res = await apiPost('trend_decide', { id, decision });\r\n    if (!res.ok) return Toast.error(res.error);\r\n    if (res.notice) Toast.warning(res.notice); else Toast.success('Готово');\r\n    loadTrends();\r\n    if (decision === 'added') loadThemes();\r\n}\r\n\r\nfunction setReviewsMode(mode, load = true) {\r\n    activeReviewsMode = mode === 'beta' ? 'beta' : 'main';\r\n    localStorage.setItem(REVIEWS_MODE_KEY, activeReviewsMode);\r\n    document.getElementById('reviewsMainView').style.display = activeReviewsMode === 'main' ? '' : 'none';\r\n    document.getElementById('reviewsBetaView').style.display = activeReviewsMode === 'beta' ? '' : 'none';\r\n    document.getElementById('reviewsMainTab').classList.toggle('active', activeReviewsMode === 'main');\r\n    document.getElementById('reviewsBetaTab').classList.toggle('active', activeReviewsMode === 'beta');\r\n    document.getElementById('reviewsHowto').style.display = activeReviewsMode === 'main' ? '' : 'none';\r\n    if (load && activeReviewsMode === 'beta') loadCoordinationBeta();\r\n}\r\n\r\n/**\r\n * Чем этот сигнал отличается от соседнего.\r\n *\r\n * Раньше на графике и в карточках стояло название бренда - и четыре разных\r\n * кластера выглядели как «Мы: DemoBag» четыре раза подряд. Название цели не\r\n * различает сигналы: цель у них одна, различаются повод и период. Поэтому в\r\n * подпись идёт то, что человек может узнать: общая фраза кластера, а у\r\n * всплесков - слово «всплеск» и его даты.\r\n */\r\nfunction betaSignalHeadline(s) {\r\n    const phrase = (s.shared_phrases || [])[0];\r\n    if (s.pattern_kind === 'possible_negative_burst') return 'всплеск негатива';\r\n    if (s.pattern_kind === 'possible_incentivized_reviews') return 'всплеск позитива';\r\n    return phrase ? '«' + phrase + '»' : 'повторяющийся текст';\r\n}\r\n\r\n/** Период коротко: год в подписи только мешает, а месяцы различают сигналы. */\r\nfunction betaPeriod(s) {\r\n    const short = d =\u003E (d || '').slice(5).split('-').reverse().join('.');\r\n    return s.period_from === s.period_to ? short(s.period_from)\r\n        : short(s.period_from) + '—' + short(s.period_to);\r\n}\r\n\r\n/** Русские названия признаков: text/temporal/cross_sku человеку ничего не говорят. */\r\nconst BETA_SCORE_LABELS = {\r\n    text: 'совпадение текста', temporal: 'плотность во времени',\r\n    distribution: 'доля в потоке', cross_sku: 'перенос между товарами',\r\n    context: 'контекст',\r\n};\r\n\r\nfunction coordinationScoreLabel(status) {\r\n    return ({\r\n        weak_anomaly: 'Слабая аномалия',\r\n        possible_coordination: 'Признаки возможной координации',\r\n        strong_anomalous_cluster: 'Сильный аномальный кластер',\r\n    })[status] || status;\r\n}\r\n\r\nasync function loadCoordinationBeta() {\r\n    const el = document.getElementById('coordinationBeta');\r\n    if (!el || !clientId()) return;\r\n    if (!currentBrand) {\r\n        el.innerHTML = '\u003Cdiv class=\"empty\"\u003EВыберите бренд — смешивать разные продукты нельзя.\u003C/div\u003E';\r\n        return;\r\n    }\r\n    el.innerHTML = '\u003Cdiv class=\"empty\"\u003EЗагружаю сохранённые BETA-сигналы…\u003C/div\u003E';\r\n\r\n    try {\r\n        const d = await api('coordination_beta', {\r\n            client_id: clientId(), brand: currentBrand,\r\n        });\r\n        if (!d.ok) throw new Error(d.error || 'Не удалось выполнить анализ');\r\n        betaInventoryData = d.inventory || { own: {}, competitors: [], tasks: [] };\r\n\r\n        const pipelineTasks = betaInventoryData.tasks || [];\r\n        const activeClassify = pipelineTasks.find(t =\u003E t.kind === 'classify' && ['pending','claimed'].includes(t.status));\r\n        const activeScan = pipelineTasks.find(t =\u003E t.kind === 'coordination_scan_beta' && ['pending','claimed'].includes(t.status));\r\n        const unclassified = +betaInventoryData.unclassified_texts || 0;\r\n        const waitingText = activeScan\r\n            ? 'BETA-скан #' + activeScan.id + ' уже ' + (activeScan.status === 'claimed' ? 'выполняется' : 'стоит в очереди') + '.'\r\n            : (unclassified \u003E 0\r\n                ? 'Сбор завершён; ' + num(unclassified) + ' новых текстов нашего бренда ожидают API-классификации' +\r\n                  (activeClassify ? ' в задании #' + activeClassify.id : '') + '. После неё BETA-скан сохранится автоматически.'\r\n                : 'Корпус готов; ночной конвейер сохранит BETA-скан без ручного запуска.');\r\n        let coverageNote = d.not_scanned\r\n            ? '\u003Cdiv class=\"warn-box\" style=\"margin-bottom:12px\"\u003E' + esc(waitingText) + '\u003C/div\u003E'\r\n            : '\u003Cdiv class=\"chart-note\"\u003EПоследний сохранённый результат: ' +\r\n              esc(d.last_scanned_at || 'дата не указана') + '.\u003C/div\u003E';\r\n\r\n        const signalCard = s =\u003E {\r\n            const incentive = s.pattern_kind === 'possible_incentivized_reviews';\r\n            // Всплеск объёма - отдельный признак от шаблона: тексты разные, но\r\n            // поток вырос в разы. Называть его так же, как найденное лекало,\r\n            // значит путать два разных повода для проверки.\r\n            const negBurst = s.pattern_kind === 'possible_negative_burst';\r\n            const weekly = (s.metrics || {}).window === 'week';\r\n            const type = incentive ? 'Возможное стимулирование отзывов'\r\n                : negBurst ? 'Всплеск негатива без общего шаблона'\r\n                : (s.signal_type === 'own_negative'\r\n                    ? 'Признаки негативного давления на нас'\r\n                    : 'Признаки шаблонного позитива конкурента');\r\n            const examples = (s.examples || []).map(x =\u003E\r\n                '\u003Cli style=\"margin:6px 0\"\u003E\u003Cspan class=\"muted\"\u003E' + esc(x.date) + ' · ' +\r\n                (x.rating || '—') + '★\u003C/span\u003E — ' + esc(x.text) + '\u003C/li\u003E').join('');\r\n            // Только то, что действительно набрало балл, и по-русски. Нули в\r\n            // списке («context: 0») занимают строку и не значат ничего.\r\n            const scores = Object.entries(s.score_breakdown || {})\r\n                .filter(([, v]) =\u003E +v \u003E 0)\r\n                .sort((a, b) =\u003E b[1] - a[1])\r\n                .map(([k, v]) =\u003E esc(BETA_SCORE_LABELS[k] || k) + ' — ' + num(v)).join(' · ');\r\n            const phrases = (s.shared_phrases || []).length\r\n                ? esc(s.shared_phrases.join(', ')) : 'устойчивая общая фраза не вы
