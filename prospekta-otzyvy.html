делена';\r\n            const m = s.metrics || {};\r\n            const baseline = m.weekly_baseline_median ?? m.baseline_daily_median;\r\n            // Голое «36 отзывов» ничего не значит без ответа «а сколько было\r\n            // обычно». Показываем фон, порог и во сколько раз его превысили.\r\n            const scale = baseline !== undefined\r\n                ? ' Обычный уровень — ' + num(baseline) + (weekly ? ' в неделю' : ' в день') +\r\n                  ', порог срабатывания — ' + num(m.burst_threshold || 0) +\r\n                  (m.times_above_baseline ? ', превышение в ' + num(m.times_above_baseline) + ' раза' : '') + '.'\r\n                : '';\r\n            const method = incentive\r\n                ? '\u003Cdiv class=\"chart-note\" style=\"margin-top:6px\"\u003EТексты различаются, но положительные отзывы вышли нетипично плотной серией. Возможна механика наподобие «Отзывы за баллы».' + scale + '\u003C/div\u003E'\r\n                : negBurst\r\n                ? '\u003Cdiv class=\"chart-note\" style=\"margin-top:6px\"\u003EТексты разные — общего шаблона нет. Сигнал даёт сама плотность: поток негатива вырос в разы против собственной истории бренда.' + scale +\r\n                  ' Это может быть и организованный залив, и реальная проблема партии или доставки — проверять нужно оба объяснения.\u003C/div\u003E'\r\n                : '';\r\n            // В заголовке - то, чем сигнал отличается от соседнего: повод и\r\n            // период. Четыре карточки с одинаковой шапкой «Признаки негативного\r\n            // давления на нас · DemoBag» читались как одна и та же, повторённая\r\n            // по ошибке. Тип признака ушёл строкой ниже, где он и нужен.\r\n            return '\u003Cdiv class=\"trend-item\" style=\"margin:10px 0;padding:14px;border:1px solid var(--border);border-radius:10px\"\u003E' +\r\n                '\u003Cdiv class=\"row\" style=\"align-items:center\"\u003E' +\r\n                '\u003Cspan class=\"tag\" style=\"background:#ffca28;color:#3d2c00\"\u003EBETA\u003C/span\u003E' +\r\n                '\u003Cb\u003E' + esc(betaSignalHeadline(s)) + '\u003C/b\u003E' +\r\n                '\u003Cb style=\"margin-left:auto;font-size:20px\" title=\"Балл приоритета проверки, от 0 до 100\"\u003E' +\r\n                num(s.coordination_risk) + '\u003C/b\u003E\u003C/div\u003E' +\r\n                '\u003Cdiv class=\"trend-title\" style=\"margin-top:8px\"\u003E' +\r\n                esc(s.target) + ' · ' + num(s.cluster_size) + ' отзывов · ' + esc(betaPeriod(s)) + '\u003C/div\u003E' +\r\n                '\u003Cdiv class=\"muted\"\u003E' + esc(type) + ' · ' + esc(coordinationScoreLabel(s.status)) + '\u003C/div\u003E' +\r\n                // Голое «совпадение текста 35» вызывает вопрос «35 чего?».\r\n                // Балл складывается из этих слагаемых, и так и написано.\r\n                '\u003Cdiv style=\"margin-top:8px\"\u003E\u003Cb\u003EИз чего сложился балл ' + num(s.coordination_risk) +\r\n                ' из 100:\u003C/b\u003E ' + scores + '\u003C/div\u003E' +\r\n                '\u003Cdiv style=\"margin-top:5px\"\u003E\u003Cb\u003EОбщие фразы:\u003C/b\u003E ' + phrases + '\u003C/div\u003E' +\r\n                method +\r\n                // Приёмка. Сигнал - гипотеза, и решение по нему принимает\r\n                // человек. Пока решений не накопится, честно сказать, как часто\r\n                // BETA права, нельзя - а без этого метку BETA не снять.\r\n                '\u003Cdiv class=\"row\" style=\"margin-top:9px;gap:8px\"\u003E' +\r\n                (s.review_status === 'approved'\r\n                    ? '\u003Cspan class=\"tag tag-green\"\u003Eподтверждено\u003C/span\u003E'\r\n                    : '\u003Cbutton class=\"btn btn-outline btn-sm\" onclick=\"reviewBetaSignal(' + s.id + \", 'approved')\\\"\u003EПодтвердить\u003C/button\u003E\") +\r\n                (s.review_status === 'rejected'\r\n                    ? '\u003Cspan class=\"tag\"\u003Eотклонено\u003C/span\u003E'\r\n                    : '\u003Cbutton class=\"btn btn-outline btn-sm\" onclick=\"reviewBetaSignal(' + s.id + \", 'rejected')\\\"\u003EНе подтвердилось\u003C/button\u003E\") +\r\n                (s.review_status && s.review_status !== 'draft'\r\n                    ? '\u003Cbutton class=\"btn btn-outline btn-sm\" onclick=\"reviewBetaSignal(' + s.id + \", 'draft')\\\"\u003EВернуть в работу\u003C/button\u003E\"\r\n                    : '') +\r\n                '\u003C/div\u003E' +\r\n                '\u003Cdetails class=\"hint-box\" style=\"margin-top:9px\"\u003E\u003Csummary\u003EПримеры и альтернативные объяснения\u003C/summary\u003E' +\r\n                '\u003Col style=\"margin:8px 0 8px 18px;padding:0\"\u003E' + examples + '\u003C/ol\u003E' +\r\n                '\u003Cdiv class=\"muted\"\u003E' + (s.alternative_explanations || []).map(esc).join(' · ') + '\u003C/div\u003E\u003C/details\u003E' +\r\n                '\u003Cdiv class=\"chart-note\" style=\"margin-top:8px\"\u003E' + esc(s.disclaimer) + '\u003C/div\u003E\u003C/div\u003E';\r\n        };\r\n\r\n        const ownSignals = (d.signals || []).filter(s =\u003E s.signal_type === 'own_negative');\r\n        const compSignals = (d.signals || []).filter(s =\u003E s.signal_type === 'competitor_positive');\r\n        const own = betaInventoryData.own || {};\r\n        const competitors = betaInventoryData.competitors || [];\r\n        const positiveTotal = competitors.reduce((sum, c) =\u003E sum + (+c.positive_reviews || 0), 0);\r\n        const readySkus = competitors.reduce((sum, c) =\u003E sum + (+c.full_skus || 0) +\r\n            (+c.positive_only_skus || 0) + (+c.mixed_partial_skus || 0), 0);\r\n        const allSkus = competitors.reduce((sum, c) =\u003E sum + (+c.skus || 0), 0);\r\n\r\n        const scopeText = c =\u003E {\r\n            const parts = [];\r\n            if (+c.full_skus) parts.push('полный: ' + num(c.full_skus));\r\n            if (+c.negative_only_skus) parts.push('только негатив: ' + num(c.negative_only_skus));\r\n            if (+c.positive_only_skus) parts.push('только позитив: ' + num(c.positive_only_skus));\r\n            if (+c.mixed_partial_skus) parts.push('оба полюса выборочно: ' + num(c.mixed_partial_skus));\r\n            return parts.join(' · ') || 'нет данных';\r\n        };\r\n        const competitorRows = competitors.map(c =\u003E '\u003Ctr\u003E\u003Ctd\u003E\u003Cb\u003E' + esc(c.label) + '\u003C/b\u003E\u003C/td\u003E' +\r\n            '\u003Ctd\u003E' + esc((c.malls || '').replaceAll(',', ', ')) + '\u003C/td\u003E\u003Ctd class=\"num\"\u003E' + num(c.skus) + '\u003C/td\u003E' +\r\n            '\u003Ctd class=\"num\"\u003E' + num(c.positive_reviews) + '\u003C/td\u003E\u003Ctd\u003E' + esc(scopeText(c)) + '\u003C/td\u003E' +\r\n            '\u003Ctd class=\"muted\"\u003E' + esc((c.latest_positive || '—').toString().slice(0,10)) + '\u003C/td\u003E\u003C/tr\u003E').join('');\r\n\r\n        const taskLabels = { competitors_positive_beta: 'Добор позитива конкурентов',\r\n            coordination_scan_beta: 'BETA-скан', classify: 'Классификация' };\r\n        const statusLabels = { draft:'черновик', pending:'в очереди', claimed:'в работе',\r\n            needs_review:'на проверке', done:'готово', failed:'ошибка', cancelled:'отменено' };\r\n        const taskRows = (betaInventoryData.tasks || []).map(t =\u003E '\u003Ctr\u003E\u003Ctd class=\"num\"\u003E#' + t.id + '\u003C/td\u003E' +\r\n            '\u003Ctd\u003E' + esc(taskLabels[t.kind] || t.kind) + '\u003C/td\u003E\u003Ctd\u003E\u003Cspan class=\"tag\"\u003E' +\r\n            esc(statusLabels[t.status] || t.status) + '\u003C/span\u003E\u003C/td\u003E\u003Ctd class=\"muted\"\u003E' +\r\n            esc(t.last_log || '') + '\u003C/td\u003E\u003Ctd class=\"muted\"\u003E' + esc((t.created_at || '').slice(0,16)) + '\u003C/td\u003E\u003C/tr\u003E').join('');\r\n\r\n        el.innerHTML = coverageNote +\r\n            '\u003Cdiv class=\"beta-dashboard\" style=\"margin:14px 0\"\u003E' +\r\n              '\u003Cdiv class=\"kpi\"\u003E\u003Cdiv class=\"kpi-label\"\u003EНегативных текстов у нас\u003C/div\u003E\u003Cdiv class=\"kpi-value\"\u003E' + num(own.eligible_negative) + '\u003C/div\u003E\u003Cdiv class=\"kpi-sub\"\u003Eкандидаты для анализа давления\u003C/div\u003E\u003C/div\u003E' +\r\n              '\u003Cdiv class=\"kpi\"\u003E\u003Cdiv class=\"kpi-label\"\u003EПозитивных текстов конкурентов\u003C/div\u003E\u003Cdiv class=\"kpi-value\"\u003E' + num(positiveTotal) + '\u003C/div\u003E\u003Cdiv class=\"kpi-sub\"\u003Eтолько выбранные конкуренты\u003C/div\u003E\u003C/div\u003E' +\r\n              '\u003Cdiv class=\"kpi\"\u003E\u003Cdiv class=\"kpi-label\"\u003EГотовность конкурентных SKU\u003C/div\u003E\u003Cdiv class=\"kpi-value\"\u003E' + num(readySkus) + ' / ' + num(allSkus) + '\u003C/div\u003E\u003Cdiv class=\"kpi-sub\"\u003Eесть позитивный корпус\u003C/div\u003E\u003C/div\u003E' +\r\n              '\u003Cdiv class=\"kpi\"\u003E\u003Cdiv class=\"kpi-label\"\u003EСигналов BETA\u003C/div\u003E\u003Cdiv class=\"kpi-value\"\u003E' + num(d.summary.signals_total) + '\u003C/div\u003E\u003Cdiv class=\"kpi-sub\"\u003Eпосле последнего скана\u003C/div\u003E\u003C/div\u003E' +\r\n            '\u003C/div\u003E' +\r\n            '\u003Cdiv class=\"card\" style=\"margin-left:0;margin-right:0\"\u003E\u003Cdiv class=\"card-title\"\u003EДашборд риска\u003C/div\u003E' +\r\n              '\u003Cdiv class=\"charts\"\u003E\u003Cdiv class=\"chart-box\"\u003E\u003Cdiv class=\"chart-head\"\u003EНайденные сигналы по приоритету\u003C/div\u003E\u003Cdiv class=\"chart-wrap\"\u003E\u003Ccanvas id=\"chBetaRisk\"\u003E\u003C/canvas\u003E\u003C/div\u003E\u003Cdiv class=\"chart-note\" id=\"betaRiskNote\"\u003EКаждая строка - отдельный кластер отзывов: чем он вызван, за какой период и сколько в нём отзывов. Балл - приоритет ручной проверки, а не вероятность вины.\u003C/div\u003E\u003C/div\u003E' +\r\n              '\u003Cdiv class=\"chart-box\"\u003E\u003Cdiv class=\"chart-head\"\u003EИз чего складывается сигнал\u003C/div\u003E\u003Cdiv class=\"chart-wrap\"\u003E\u003Ccanvas id=\"chBetaEvidence\"\u003E\u003C/canvas\u003E\u003C/div\u003E\u003Cdiv class=\"chart-note\"\u003EИз чего сложился балл каждого сигнала. Шкала - те же 100 баллов приоритета: насколько совпали тексты, насколько плотно они легли во времени, какую долю потока заняли и разошлись ли по разным товарам.\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E' +\r\n            '\u003Cdiv class=\"card\" style=\"margin-left:0;margin-right:0\"\u003E\u003Cdiv class=\"card-title\"\u003EПокрытие выбранных конкурентов\u003C/div\u003E' +\r\n              (competitorRows ? '\u003Ctable\u003E\u003Cthead\u003E\u003Ctr\u003E\u003Cth\u003EКонкурент\u003C/th\u003E\u003Cth\u003EПлощадки\u003C/th\u003E\u003Cth class=\"num\"\u003ESKU\u003C/th\u003E\u003Cth class=\"num\"\u003EПозитивных текстов\u003C/th\u003E\u003Cth\u003EПолнота корпуса\u003C/th\u003E\u003Cth\u003EПоследний позитив\u003C/th\u003E\u003C/tr\u003E\u003C/thead\u003E\u003Ctbody\u003E' + competitorRows + '\u003C/tbody\u003E\u003C/table\u003E'\r\n                : '\u003Cdiv class=\"empty\"\u003EДля бренда ещё не выбраны конкуренты.\u003C/div\u003E') + '\u003C/div\u003E' +\r\n            '\u003Cdiv class=\"card\" style=\"margin-left:0;margin-right:0\"\u003E\u003Cdiv class=\"card-title\"\u003EКонвейер данных и последние задания\u003C/div\u003E' +\r\n              (taskRows ? '\u003Ctable\u003E\u003Cthead\u003E\u003Ctr\u003E\u003Cth\u003E#\u003C/th\u003E\u003Cth\u003EЭтап\u003C/th\u003E\u003Cth\u003EСтатус\u003C/th\u003E\u003Cth\u003EПоследнее сообщение\u003C/th\u003E\u003Cth\u003EСоздано\u003C/th\u003E\u003C/tr\u003E\u003C/thead\u003E\u003Ctbody\u003E' + taskRows + '\u003C/tbody\u003E\u003C/table\u003E'\r\n                : '\u003Cdiv class=\"empty\"\u003EBETA-заданий по бренду ещё не было.\u003C/div\u003E') + '\u003C/div\u003E' +\r\n            '\u003Cdiv class=\"beta-signal-grid\"\u003E\u003Cdiv class=\"card\"\u003E\u003Cdiv class=\"card-title\"\u003EНегативное давление на нас\u003C/div\u003E\u003Cdiv class=\"beta-signal-list\"\u003E' +\r\n              (ownSignals.length ? ownSignals.map(signalCard).join('') : '\u003Cdiv class=\"empty\"\u003EСохранённых сигналов нет.\u003C/div\u003E') + '\u003C/div\u003E\u003C/div\u003E' +\r\n              '\u003Cdiv class=\"card\"\u003E\u003Cdiv class=\"card-title\"\u003EПозитив и стимулирование у конкурентов\u003C/div\u003E\u003Cdiv class=\"beta-signal-list\"\u003E' +\r\n              (compSignals.length ? compSignals.map(signalCard).join('') : '\u003Cdiv class=\"empty\"\u003EСохранённых сигналов нет.\u003C/div\u003E') + '\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E';\r\n\r\n        // Подпись в две строки: чем сигнал вызван и когда. Одно название бренда,\r\n        // повторённое четыре раза, не отвечало ни на один вопрос читателя.\r\n        const cut = (t, n) =\u003E t.length \u003E n ? t.slice(0, n - 1) + '…' : t;\r\n\r\n        // В график попадают только первые сигналы по приоритету.\r\n        //\r\n        // У демо их тридцать шесть, и в карточке высотой в 230 пикселей подписи\r\n        // налезали друг на друга неразборчивой кашей. График, который нельзя\r\n        // прочитать, хуже отсутствующего. Полный список остаётся ниже\r\n        // карточками - там места столько, сколько нужно.\r\n        const CHART_SIGNALS = 8;\r\n        const chartSignals = (d.signals || []).slice(0, CHART_SIGNALS);\r\n        const hiddenSignals = (d.signals || []).length - chartSignals.length;\r\n\r\n        const signalLabels = chartSignals.map(s =\u003E [\r\n            cut((s.signal_type === 'own_negative' ? 'Мы' : s.target) + ': ' + betaSignalHeadline(s), 34),\r\n            betaPeriod(s) + ' · ' + s.cluster_size + ' отз.',\r\n        ]);\r\n        if (signalLabels.length) {\r\n            drawChart('chBetaRisk', { type:'bar', data:{ labels:signalLabels,\r\n                datasets:[{ label:'Риск', data:chartSignals.map(s =\u003E +s.coordination_risk),\r\n                    backgroundColor:chartSignals.map(s =\u003E s.signal_type === 'own_negative' ? 'rgba(239,68,68,.7)' : 'rgba(234,179,8,.75)') }] },\r\n                options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,\r\n                    scales:{ x:{beginAtZero:true,max:100}, y:{ticks:{font:{size:11},autoSkip:false}} },\r\n                    plugins:{ legend:{display:false}, tooltip:{ callbacks:{\r\n                        // В подсказке - то, что не влезло в подпись: что это за\r\n                        // признак и как читать балл.\r\n                        afterLabel: ctx =\u003E {\r\n                            const s = chartSignals[ctx.dataIndex] || {};\r\n                            return [coordinationScoreLabel(s.status),\r\n                                'балл — приоритет ручной проверки'];\r\n                        } } } } } });\r\n            // «Контекст» в легенде не показываем: детектор его пока не считает,\r\n            // и пустой цвет в шкале только добавляет вопросов.\r\n            const evidence = [{key:'text',label:'Совпадение текста'},{key:'temporal',label:'Плотность во времени'},\r\n                {key:'distribution',label:'Доля в потоке'},{key:'cross_sku',label:'Перенос между товарами'}];\r\n            drawChart('chBetaEvidence', { type:'bar', data:{ labels:signalLabels,\r\n                datasets:evidence.map((x,i) =\u003E ({label:x.label,data:chartSignals.map(s =\u003E +(s.score_breakdown || {})[x.key] || 0),\r\n                    backgroundColor:['#7c3aed','#2563eb','#eab308','#f97316','#64748b'][i]})) },\r\n                options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,\r\n                    scales:{ x:{stacked:true,beginAtZero:true,max:100},\r\n                             y:{stacked:true,ticks:{font:{size:11},autoSkip:false}} } } });\r\n            const riskNote = document.getElementById(\"betaRiskNote\");\r\n            if (riskNote && hiddenSignals \u003E 0) {\r\n                riskNote.innerHTML = \"Показаны \" + num(chartSignals.length) + \" сигналов с наибольшим баллом, \"\r\n                    + \"ещё \" + num(hiddenSignals) + \" - карточками ниже. Каждая строка - отдельный кластер \"\r\n                    + \"отзывов: чем он вызван, за какой период и сколько в нём отзывов. \"\r\n                    + \"Балл - приоритет ручной проверки, а не вероятность вины.\";\r\n            }\r\n        } else if (d.not_scanned) {\r\n            chartBlank('chBetaRisk', '\u003Cb\u003EВыводы готовятся.\u003C/b\u003E\u003Cbr\u003E' + esc(waitingText));\r\n            chartBlank('chBetaEvidence', '\u003Cb\u003EСтруктура признаков появится автоматически.\u003C/b\u003E\u003Cbr\u003EРучной повторный сбор не нужен.');\r\n        } else {\r\n            // Скан прошёл и ничего не нашёл - это результат, а не ожидание.\r\n            // Прежний текст «выводы готовятся» висел и здесь, из-за чего\r\n            // выполненная проверка выглядела незавершённой.\r\n            const scanned = esc(d.last_scanned_at || '');\r\n            chartBlank('chBetaRisk', '\u003Cb\u003EПризнаков координации не найдено.\u003C/b\u003E\u003Cbr\u003E'\r\n                + 'Проверено ' + num(d.eligible_reviews || 0) + ' отзывов'\r\n                + (scanned ? ', последний скан ' + scanned : '') + '.');\r\n            chartBlank('chBetaEvidence', '\u003Cb\u003EРаскладывать нечего.\u003C/b\u003E\u003Cbr\u003E'\r\n                + 'Ни один кластер не набрал порог: повторов текста и всплесков объёма нет.');\r\n        }\r\n    } catch (e) {\r\n        el.innerHTML = '\u003Cdiv class=\"empty\"\u003EBETA-вкладка временно недоступна: ' + esc(e.message) +\r\n            '. Основной раздел отзывов продолжает работать.\u003C/div\u003E';\r\n    }\r\n}\r\n\r\n/**\r\n * Решение человека по сигналу: подтвердился или нет.\r\n *\r\n * Это не косметика: по накопленным решениям потом считается, как часто детектор\r\n * прав. Пока таких решений нет, метка BETA останется навсегда - снимать её будет\r\n * не на чем основании.\r\n */\r\nasync function reviewBetaSignal(signalId, verdict) {\r\n    const res = await apiPost('coordination_beta_review',\r\n        { client_id: clientId(), signal_id: signalId, verdict });\r\n\r\n    if (!res.ok) return Toast.error(res.error || 'Не удалось сохранить решение');\r\n    Toast.success(res.message || 'Сохранено');\r\n    loadCoordinationBeta();\r\n}\r\n\r\n/**\r\n * Пересчитать признаки, не уходя со страницы.\r\n *\r\n * Скан считается у нас и наружу не ходит, поэтому обычный корпус\r\n * пересчитывается тут же за секунду. Большой сервер ставит в очередь и честно\r\n * об этом говорит - вместо того чтобы держать запрос десяток секунд.\r\n */\r\nasync function rescanCoordinationBeta() {\r\n    const btn = document.getElementById('betaRescanBtn');\r\n    if (!currentBrand) return Toast.error('Сначала выберите бренд');\r\n\r\n    btn.disabled = true;\r\n    const was = btn.textContent;\r\n    btn.textContent = 'Считаю…';\r\n\r\n    const res = await apiPost('coordination_beta_run',\r\n        { client_id: clientId(), brand: currentBrand });\r\n\r\n    btn.disabled = false;\r\n    btn.textContent = was;\r\n\r\n    if (!res.ok) return Toast.error(res.error || 'Не удалось пересчитать');\r\n    Toast.success(res.message || 'Готово');\r\n    loadCoordinationBeta();\r\n}\r\n\r\nasync function loadAll() {\r\n    if (!clientId()) return;\r\n\r\n    // Сначала бренды, и обязательно с ожиданием: вкладка выбирается здесь, и\r\n    // без await остальные запросы уходили с пустым брендом. На экране вкладка\r\n    // выглядела выбранной, а данные приходили сборной солянкой по всем\r\n    // продуктам сразу - и «помогает от аллергии» соседствовало с «помогает\r\n    // при простуде».\r\n    await loadBrands();\r\n\r\n    loadOverview(); loadThemes(); loadTasks(); loadAlerts(); loadAnalytics(); loadTrends();\r\n\r\n    // Тексты грузим только если блок раскрыт - иначе это лишний запрос и\r\n    // полсотни строк, которые никто не просил.\r\n    const card = document.getElementById('textsCard');\r\n    if (card.open) loadTexts(0);\r\n    else document.getElementById('textsBadge').textContent =\r\n        'разверните, чтобы прочитать собранные отзывы - по ним собирается матрица тем';\r\n\r\n    // Отдельная BETA-вкладка загружается только когда выбрана. Сбой её API не\r\n    // участвует в основной аналитике и остаётся внутри своего экрана.\r\n    if (activeReviewsMode === 'beta') loadCoordinationBeta();\r\n}\r\n\r\n(async function init() {\r\n    const to = new Date(), from = new Date(Date.now() - 89 * 86400000);\r\n    document.getElementById('dateFrom').value = fmtD(from);\r\n    document.getElementById('dateTo').value = fmtD(to);\r\n    setReviewsMode(activeReviewsMode, false);\r\n    // Раздел, в котором человек был в прошлый раз. Менеджер живёт в «что\r\n    // происходит», а настройку открывает раз в неделю - и наоборот, пока сбор\r\n    // настраивают, аналитика ему не нужна.\r\n    setSection(localStorage.getItem(SECTION_KEY) || 'analytics');\r\n    await loadClients();\r\n    loadAll();\r\n})();\r\n\u003C/script\u003E\r\n\u003C/body\u003E\r\n\u003C/html\u003E\r\n"},"assets":{"css/theme.css":"/* =====================================================\r\n   ICOMBOOST - Shared Theme (Dark / Light)\r\n   Подключается в index.php и campaigns.php\r\n   Переключение: js/theme.js\r\n   ===================================================== */\r\n\r\n/* === DARK (default) === */\r\n:root, [data-theme=\"dark\"] {\r\n    --bg-primary: #0a0a0f;\r\n    --bg-card: #12121a;\r\n    --bg-card-hover: #1a1a25;\r\n    --bg-input: #1a1a25;\r\n    --border: #2a2a3a;\r\n    --border-focus: #7C5CFC;\r\n    --text-primary: #e8e8f0;\r\n    --text-secondary: #8888a0;\r\n    --text-muted: #555570;\r\n    --accent: #7C5CFC;\r\n    --accent-glow: rgba(124,92,252,0.15);\r\n    --green: #34D399;\r\n    --green-bg: rgba(52,211,153,0.1);\r\n    --red: #F87171;\r\n    --red-bg: rgba(248,113,113,0.1);\r\n    --yellow: #FBBF24;\r\n    --yellow-bg: rgba(251,191,36,0.1);\r\n    --blue: #60A5FA;\r\n    --blue-bg: rgba(96,165,250,0.1);\r\n    --radius: 12px;\r\n    --radius-sm: 8px;\r\n    --shadow: 0 4px 24px rgba(0,0,0,0.4);\r\n    --chart-grid: rgba(42,42,58,0.5);\r\n    --chart-grid-soft: rgba(42,42,58,0.3);\r\n    --gradient-brand: linear-gradient(135deg, #7C5CFC 0%, #60A5FA 100%);\r\n\r\n    /* Platform colors */\r\n    --ozon: #005BFF;\r\n    --wb: #CB11AB;\r\n    --avito: #00AAFF;\r\n    --urban: #F59E0B;\r\n}\r\n\r\n/* === LIGHT === */\r\n[data-theme=\"light\"] {\r\n    --bg-primary: #F8F9FC;\r\n    --bg-card: #ffffff;\r\n    --bg-card-hover: #f0f0f5;\r\n    --bg-input: #f0f0f5;\r\n    --border: #e0e0e8;\r\n    --border-focus: #7C5CFC;\r\n    --text-primary: #1a1a2e;\r\n    --text-secondary: #555570;\r\n    --text-muted: #8888a0;\r\n    --accent: #6B4FDB;\r\n    --accent-glow: rgba(107,79,219,0.1);\r\n    --green: #10B981;\r\n    --green-bg: rgba(16,185,129,0.08);\r\n    --red: #EF4444;\r\n    --red-bg: rgba(239,68,68,0.06);\r\n    --yellow: #F59E0B;\r\n    --yellow-bg: rgba(245,158,11,0.08);\r\n    --blue: #3B82F6;\r\n    --blue-bg: rgba(59,130,246,0.06);\r\n    --shadow: 0 2px 12px rgba(0,0,0,0.06);\r\n    --chart-grid: rgba(0,0,0,0.06);\r\n    --chart-grid-soft: rgba(0,0,0,0.04);\r\n    --gradient-brand: linear-gradient(135deg, #6B4FDB 0%, #3B82F6 100%);\r\n\r\n    /* Platform colors (same for both themes) */\r\n    --ozon: #005BFF;\r\n    --wb: #CB11AB;\r\n    --avito: #00AAFF;\r\n    --urban: #F59E0B;\r\n}\r\n\r\n/* === THEME TOGGLE BUTTON === */\r\n.theme-toggle {\r\n    background: var(--bg-input);\r\n    border: 1px solid var(--border);\r\n    border-radius: 20px;\r\n    padding: 5px 12px;\r\n    cursor: pointer;\r\n    font-size: 16px;\r\n    line-height: 1;\r\n    transition: all 0.2s;\r\n    display: flex; align-items: center; gap: 6px;\r\n    color: var(--text-muted);\r\n}\r\n.theme-toggle:hover {\r\n    border-color: var(--accent);\r\n    color: var(--text-primary);\r\n}\r\n.theme-toggle .theme-icon { font-size: 14px; }\r\n\r\n/* === PLATFORM BADGES === */\r\n.badge-ozon { background: rgba(0,91,255,0.12); color: var(--ozon); }\r\n.badge-wb { background: rgba(203,17,171,0.12); color: var(--wb); }\r\n.badge-avito { background: rgba(0,170,255,0.12); color: var(--avito); }\r\n.badge-urban { background: rgba(245,158,11,0.12); color: var(--urban); }\r\n\r\n/* === SKELETON LOADING === */\r\n.skeleton {\r\n    background: var(--bg-input);\r\n    border-radius: var(--radius-sm);\r\n    position: relative;\r\n    overflow: hidden;\r\n}\r\n.skeleton::after {\r\n    content: '';\r\n    position: absolute;\r\n    inset: 0;\r\n    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);\r\n    animation: shimmer 1.5s infinite;\r\n}\r\n[data-theme=\"light\"] .skeleton::after {\r\n    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.04), transparent);\r\n}\r\n@keyframes shimmer {\r\n    0% { transform: translateX(-100%); }\r\n    100% { transform: translateX(100%); }\r\n}\r\n\r\n.skeleton-text { height: 14px; margin-bottom: 8px; }\r\n.skeleton-text:last-child { width: 60%; }\r\n.skeleton-title { height: 24px; width: 40%; margin-bottom: 12px; }\r\n.skeleton-card { height: 120px; border-radius: var(--radius); }\r\n.skeleton-kpi { height: 80px; border-radius: var(--radius); }\r\n\r\n/* === TOAST NOTIFICATIONS === */\r\n.toast-container {\r\n    position: fixed;\r\n    bottom: 24px;\r\n    right: 24px;\r\n    z-index: 9999;\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 12px;\r\n    pointer-events: none;\r\n}\r\n\r\n.toast {\r\n    background: var(--bg-card);\r\n    border: 1px solid var(--border);\r\n    border-radius: var(--radius);\r\n    padding: 14px 20px;\r\n    box-shadow: var(--shadow);\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 12px;\r\n    min-width: 280px;\r\n    max-width: 400px;\r\n    pointer-events: auto;\r\n    animation: toast-in 0.3s ease-out;\r\n}\r\n\r\n.toast.toast-out {\r\n    animation: toast-out 0.3s ease-in forwards;\r\n}\r\n\r\n.toast-icon {\r\n    font-size: 20px;\r\n    flex-shrink: 0;\r\n}\r\n\r\n.toast-content {\r\n    flex: 1;\r\n    font-size: 13px;\r\n    line-height: 1.5;\r\n}\r\n\r\n.toast-close {\r\n    background: none;\r\n    border: none;\r\n    color: var(--text-muted);\r\n    cursor: pointer;\r\n    font-size: 18px;\r\n    padding: 0;\r\n    line-height: 1;\r\n}\r\n\r\n.toast-success { border-left: 3px solid var(--green); }\r\n.toast-error { border-left: 3px solid var(--red); }\r\n.toast-warning { border-left: 3px solid var(--yellow); }\r\n.toast-info { border-left: 3px solid var(--blue); }\r\n\r\n@keyframes toast-in {\r\n    from { opacity: 0; transform: translateX(100%); }\r\n    to { opacity: 1; transform: translateX(0); }\r\n}\r\n\r\n@keyframes toast-out {\r\n    from { opacity: 1; transform: translateX(0); }\r\n    to { opacity: 0; transform: translateX(100%); }\r\n}\r\n\r\n/* === KPI SPARKLINE === */\r\n.kpi-sparkline {\r\n    margin-top: 8px;\r\n    height: 30px;\r\n    width: 100%;\r\n}\r\n\r\n.kpi-sparkline svg {\r\n    width: 100%;\r\n    height: 100%;\r\n}\r\n\r\n.kpi-sparkline path {\r\n    fill: none;\r\n    stroke-width: 1.5;\r\n    stroke-linecap: round;\r\n    stroke-linejoin: round;\r\n}\r\n\r\n/* === KPI STATUS BAR === */\r\n.kpi-card {\r\n    position: relative;\r\n    overflow: hidden;\r\n}\r\n\r\n.kpi-card::before {\r\n    content: '';\r\n    position: absolute;\r\n    top: 0;\r\n    left: 0;\r\n    right: 0;\r\n    height: 3px;\r\n    background: var(--border);\r\n    transition: background 0.3s;\r\n}\r\n\r\n.kpi-card.good::before { background: var(--green); }\r\n.kpi-card.warn::before { background: var(--yellow); }\r\n.kpi-card.bad::before { background: var(--red); }\r\n\r\n/* === ANIMATED COUNTERS === */\r\n@keyframes count-up {\r\n    from { opacity: 0; transform: translateY(10px); }\r\n    to { opacity: 1; transform: translateY(0); }\r\n}\r\n\r\n.kpi-value {\r\n    animation: count-up 0.4s ease-out;\r\n}\r\n\r\n/* === RECOMMENDATIONS AI === */\r\n.rec-summary {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 16px;\r\n    padding: 16px 20px;\r\n    background: var(--bg-input);\r\n    border-radius: var(--radius);\r\n    margin-bottom: 20px;\r\n    flex-wrap: wrap;\r\n}\r\n\r\n.rec-summary-item {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 6px;\r\n    font-size: 13px;\r\n    font-weight: 600;\r\n    color: var(--text-secondary);\r\n    cursor: pointer;\r\n    padding: 6px 12px;\r\n    border-radius: 20px;\r\n    transition: all 0.2s;\r\n}\r\n\r\n.rec-summary-item:hover {\r\n    background: var(--bg-card-hover);\r\n    color: var(--text-primary);\r\n}\r\n\r\n.rec-summary-item.active {\r\n    background: var(--accent-glow);\r\n    color: var(--accent);\r\n}\r\n\r\n.rec-summary-dot {\r\n    width: 8px;\r\n    height: 8px;\r\n    border-radius: 50%;\r\n}\r\n\r\n.rec-summary-dot.critical { background: var(--red); }\r\n.rec-summary-dot.warning { background: var(--yellow); }\r\n.rec-summary-dot.info { background: var(--blue); }\r\n.rec-summary-dot.good { background: var(--green); }\r\n\r\n.rec-summary-reset {\r\n    margin-left: auto;\r\n    background: none;\r\n    border: 1px solid var(--border);\r\n    color: var(--text-muted);\r\n    font-size: 12px;\r\n    padding: 5px 12px;\r\n    border-radius: 6px;\r\n    cursor: pointer;\r\n    transition: all 0.2s;\r\n}\r\n\r\n.rec-summary-reset:hover {\r\n    border-color: var(--accent);\r\n    color: var(--text-primary);\r\n}\r\n\r\n.rec-cards {\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 12px;\r\n}\r\n\r\n.rec-card {\r\n    display: flex;\r\n    gap: 16px;\r\n    padding: 20px;\r\n    background: var(--bg-card);\r\n    border: 1px solid var(--border);\r\n    border-radius: var(--radius);\r\n    position: relative;\r\n    overflow: hidden;\r\n    transition: all 0.2s;\r\n}\r\n\r\n.rec-card:hover {\r\n    border-color: var(--border-focus);\r\n    transform: translateY(-2px);\r\n    box-shadow: var(--shadow);\r\n}\r\n\r\n.rec-card::before {\r\n    content: '';\r\n    position: absolute;\r\n    left: 0;\r\n    top: 0;\r\n    bottom: 0;\r\n    width: 3px;\r\n}\r\n\r\n.rec-card.critical::before { background: var(--red); }\r\n.rec-card.warning::before { background: var(--yellow); }\r\n.rec-card.info::before { background: var(--blue); }\r\n.rec-card.good::before { background: var(--green); }\r\n\r\n/* AI-style gradient border for critical */\r\n.rec-card.critical {\r\n    background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,\r\n                linear-gradient(135deg, var(--red), var(--yellow)) border-box;\r\n    border: 1px solid transparent;\r\n}\r\n\r\n.rec-card-icon {\r\n    font-size: 28px;\r\n    flex-shrink: 0;\r\n    width: 40px;\r\n    text-align: center;\r\n}\r\n\r\n.rec-card-content {\r\n    flex: 1;\r\n    min-width: 0;\r\n}\r\n\r\n.rec-card-header {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 12px;\r\n    margin-bottom: 8px;\r\n}\r\n\r\n.rec-card-metric {\r\n    font-family: 'Unbounded', sans-serif;\r\n    font-size: 15px;\r\n    font-weight: 600;\r\n    color: var(--text-primary);\r\n}\r\n\r\n.rec-card-value {\r\n    font-family: 'JetBrains Mono', monospace;\r\n    font-size: 14px;\r\n    font-weight: 600;\r\n    padding: 3px 10px;\r\n    border-radius: 6px;\r\n    background: var(--bg-input);\r\n    color: var(--text-secondary);\r\n}\r\n\r\n.rec-card-text {\r\n    font-size: 13px;\r\n    line-height: 1.6;\r\n    color: var(--text-secondary);\r\n    margin-bottom: 12px;\r\n}\r\n\r\n.rec-card-action {\r\n    background: var(--accent-glow);\r\n    border: none;\r\n    color: var(--accent);\r\n    font-size: 12px;\r\n    font-weight: 600;\r\n    padding: 8px 16px;\r\n    border-radius: 6px;\r\n    cursor: pointer;\r\n    transition: all 0.2s;\r\n}\r\n\r\n.rec-card-action:hover {\r\n    background: var(--accent);\r\n    color: #fff;\r\n}\r\n\r\n/* === REC CARD EXPANDABLE DETAILS === */\r\n.rec-card-details {\r\n    max-height: 0;\r\n    overflow: hidden;\r\n    transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;\r\n    opacity: 0;\r\n    margin-top: 0;\r\n}\r\n\r\n.rec-card-details.open {\r\n    max-height: 1200px;\r\n    opacity: 1;\r\n    margin-top: 16px;\r\n    padding-top: 16px;\r\n    border-top: 1px solid var(--border);\r\n}\r\n\r\n.rec-detail-empty {\r\n    text-align: center;\r\n    color: var(--text-muted);\r\n    padding: 20px;\r\n    font-size: 13px;\r\n}\r\n\r\n/* === SUB-CAMPAIGN LIST (inside \"Показать проблемные кампании\") === */\r\n.rec-subcampaign {\r\n    background: var(--bg-input);\r\n    border-radius: var(--radius-sm);\r\n    margin-bottom: 8px;\r\n    overflow: hidden;\r\n}\r\n\r\n.rec-subcampaign-header {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 12px;\r\n    padding: 12px 14px;\r\n    cursor: pointer;\r\n    transition: background 0.2s;\r\n}\r\n\r\n.rec-subcampaign-header:hover {\r\n    background: var(--bg-card-hover);\r\n}\r\n\r\n.rec-subcampaign-title {\r\n    flex: 1;\r\n    font-size: 13px;\r\n    font-weight: 600;\r\n    color: var(--text-primary);\r\n    min-width: 0;\r\n    overflow: hidden;\r\n    text-overflow: ellipsis;\r\n    white-space: nowrap;\r\n}\r\n\r\n.rec-subcampaign-toggle {\r\n    color: var(--text-muted);\r\n    font-size: 11px;\r\n    flex-shrink: 0;\r\n}\r\n\r\n.rec-subcampaign .rec-card-details {\r\n    padding: 0 16px;\r\n}\r\n\r\n.rec-subcampaign .rec-card-details.open {\r\n    padding: 16px;\r\n    margin-top: 0;\r\n    border-top: 1px solid var(--border);\r\n}\r\n\r\n.rec-detail-header {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 10px;\r\n    margin-bottom: 14px;\r\n}\r\n\r\n.rec-detail-title {\r\n    font-family: 'Unbounded', sans-serif;\r\n    font-size: 14px;\r\n    font-weight: 600;\r\n    color: var(--text-primary);\r\n}\r\n\r\n.rec-detail-metrics {\r\n    display: grid;\r\n    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));\r\n    gap: 10px;\r\n    margin-bottom: 16px;\r\n}\r\n\r\n.rec-detail-metric {\r\n    background: var(--bg-input);\r\n    border-radius: 8px;\r\n    padding: 10px 12px;\r\n    text-align: center;\r\n}\r\n\r\n.rec-dm-label {\r\n    display: block;\r\n    font-size: 10px;\r\n    font-weight: 600;\r\n    color: var(--text-muted);\r\n    text-transform: uppercase;\r\n    letter-spacing: 0.5px;\r\n    margin-bottom: 4px;\r\n}\r\n\r\n.rec-dm-value {\r\n    display: block;\r\n    font-family: 'JetBrains Mono', monospace;\r\n    font-size: 14px;\r\n    font-weight: 600;\r\n    color: var(--text-primary);\r\n}\r\n\r\n.rec-detail-sparkline {\r\n    margin-bottom: 16px;\r\n}\r\n\r\n.rec-diag-section {\r\n    margin-top: 12px;\r\n}\r\n\r\n.rec-diag-row {\r\n    display: flex;\r\n    align-items: flex-start;\r\n    gap: 10px;\r\n    padding: 10px 14px;\r\n    background: var(--bg-input);\r\n    border-radius: 8px;\r\n    margin-bottom: 6px;\r\n}\r\n\r\n.rec-diag-icon {\r\n    font-size: 16px;\r\n    flex-shrink: 0;\r\n    margin-top: 1px;\r\n}\r\n\r\n.rec-diag-info {\r\n    flex: 1;\r\n    min-width: 0;\r\n}\r\n\r\n.rec-diag-label {\r\n    font-size: 13px;\r\n    font-weight: 600;\r\n    color: var(--text-primary);\r\n}\r\n\r\n.rec-diag-value {\r\n    font-family: 'JetBrains Mono', monospace;\r\n    font-size: 12px;\r\n    color: var(--text-secondary);\r\n    margin-left: 6px;\r\n}\r\n\r\n.rec-diag-hint {\r\n    font-size: 12px;\r\n    color: var(--text-muted);\r\n    margin-top: 3px;\r\n    line-height: 1.4;\r\n}\r\n\r\n/* === ANOMALY DETECTION === */\r\n.rec-anomaly-section {\r\n    margin-top: 20px;\r\n    padding-top: 16px;\r\n    border-top: 1px dashed var(--border);\r\n    position: relative;\r\n    clear: both;\r\n}\r\n\r\n.rec-anomaly-row {\r\n    display: grid;\r\n    grid-template-columns: 60px auto 1fr;\r\n    gap: 8px;\r\n    align-items: center;\r\n    padding: 10px 14px;\r\n    border-radius: 8px;\r\n    margin-bottom: 6px;\r\n    font-size: 12px;\r\n    border-left: 3px solid var(--border);\r\n}\r\n\r\n.rec-anomaly-row.critical {\r\n    background: var(--red-bg);\r\n    border-left-color: var(--red);\r\n}\r\n\r\n.rec-anomaly-row.warning {\r\n    background: var(--yellow-bg);\r\n    border-left-color: var(--yellow);\r\n}\r\n\r\n.rec-anomaly-row.info {\r\n    background: var(--blue-bg);\r\n    border-left-color: var(--blue);\r\n}\r\n\r\n.rec-anomaly-date {\r\n    font-family: 'JetBrains Mono', monospace;\r\n    font-weight: 600;\r\n    color: var(--text-secondary);\r\n    white-space: nowrap;\r\n}\r\n\r\n.rec-anomaly-badge {\r\n    display: inline-flex;\r\n    align-items: center;\r\n    gap: 4px;\r\n    padding: 3px 10px;\r\n    border-radius: 12px;\r\n    font-size: 11px;\r\n    font-weight: 700;\r\n    white-space: nowrap;\r\n}\r\n\r\n.rec-anomaly-badge.up {\r\n    background: rgba(239,68,68,0.12);\r\n    color: var(--red);\r\n}\r\n\r\n.rec-anomaly-badge.down {\r\n    background: rgba(52,211,153,0.12);\r\n    color: var(--green);\r\n}\r\n\r\n.rec-anomaly-row .rec-anomaly-detail {\r\n    grid-column: 1 / -1;\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 6px;\r\n    padding-left: 68px;\r\n    margin-top: -2px;\r\n}\r\n\r\n.rec-anomaly-value {\r\n    font-family: 'JetBrains Mono', monospace;\r\n    font-size: 12px;\r\n    font-weight: 600;\r\n    color: var(--text-primary);\r\n}\r\n\r\n.rec-anomaly-change {\r\n    font-family: 'JetBrains Mono', monospace;\r\n    font-size: 11px;\r\n    color: var(--text-muted);\r\n}\r\n\r\n.rec-anomaly-row .rec-anomaly-hint {\r\n    grid-column: 1 / -1;\r\n    padding-left: 68px;\r\n    font-size: 11px;\r\n    color: var(--text-muted);\r\n    line-height: 1.4;\r\n    margin-top: 2px;\r\n}\r\n\r\n@media (max-width: 768px) {\r\n    .rec-anomaly-row {\r\n        grid-template-columns: 1fr;\r\n        gap: 4px;\r\n    }\r\n    .rec-anomaly-row .rec-anomaly-detail,\r\n    .rec-anomaly-row .rec-anomaly-hint {\r\n        padding-left: 0;\r\n    }\r\n    .rec-detail-metrics {\r\n        grid-template-columns: repeat(2, 1fr);\r\n    }\r\n}\r\n\r\n/* =========================================================\r\n   ЛОГОТИП ICOM в шапке\r\n   Файл монохромный, поэтому красим его CSS-маской, а не двумя\r\n   вариантами картинки: цвет берётся из --text-primary и сам\r\n   становится белым в тёмной теме и тёмным в светлой.\r\n   ========================================================= */\r\n.logo-mark {\r\n    display: inline-block;\r\n    height: 1.05em;\r\n    /* соотношение из viewBox файла (872.2 x 132) - ширина считается от высоты */\r\n    aspect-ratio: 872.2 / 132;\r\n    background-color: var(--text-primary);\r\n    -webkit-mask: url('../img/icom-logo.svg') no-repeat center / contain;\r\n    mask: url('../img/icom-logo.svg') no-repeat center / contain;\r\n    vertical-align: -0.12em;\r\n    transition: background-color 0.2s;\r\n}\r\n/* Если браузер не умеет mask - показываем текст вместо пустого места */\r\n@supports not ((mask: url('')) or (-webkit-mask: url(''))) {\r\n    .logo-mark { display: none; }\r\n    .logo-mark + .logo-fallback { display: inline !important; }\r\n}\r\n.logo-fallback { display: none; }\r\n\r\n/* ======================================================================\r\n   ВЕРХНЯЯ ПАНЕЛЬ И МЕНЮ\r\n   ======================================================================\r\n   Разметка живёт в includes/topbar.php, стили - здесь. До этого и то и другое\r\n   дублировалось в каждой странице: одиннадцать копий, которые расходились при\r\n   любой правке. Страницы, где свои копии этих правил ещё остались, ничего не\r\n   потеряют - значения те же.\r\n   ====================================================================== */\r\n.topbar { display: flex; align-items: center; justify-content: space-between;\r\n    padding: 16px 32px; border-bottom: 1px solid var(--border); background: var(--bg-card); }\r\n.topbar-logo { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 18px;\r\n    letter-spacing: -0.5px; text-decoration: none; display: inline-flex; align-items: center;\r\n    flex: 0 0 auto; white-space: nowrap; }\r\n.logo-icom { color: var(--text-primary); }\r\n.logo-boost { color: var(--accent); }\r\n\r\n.topbar-nav { display: flex; gap: 8px; align-items: center; min-width: 0; justify-content: flex-end; }\r\n.topbar-menu-toggle { display: none; align-items: center; gap: 8px; padding: 7px 11px;\r\n    border: 1px solid var(--border); border-radius: 8px; background: var(--bg-input);\r\n    color: var(--text-primary); font: 600 12px 'Manrope', sans-serif; cursor: pointer; }\r\n.topbar-menu-icon { position: relative; width: 15px; height: 10px; border-top: 2px solid currentColor;\r\n    border-bottom: 2px solid currentColor; }\r\n.topbar-menu-icon::after { content: ''; position: absolute; left: 0; right: 0; top: 3px;\r\n    border-top: 2px solid currentColor; }\r\n.topbar-nav a { color: var(--text-secondary); text-decoration: none; font-size: 13px;\r\n    font-weight: 500; padding: 6px 14px; border-radius: 6px; transition: all 0.2s;\r\n    white-space: nowrap; }\r\n.topbar-nav .topbar-icon-link { width: 34px; height: 34px; padding: 0; display: inline-grid;\r\n    place-items: center; flex: 0 0 34px; line-height: 1; background:var(--bg-input);\r\n    border:1px solid var(--border); border-radius:9px; }\r\n.topbar-icon-link svg { width: 20px; height: 20px; fill:currentColor; }\r\n.topbar-nav .topbar-icon-link:hover,\r\n.topbar-nav .topbar-icon-link.active { border-color:var(--accent); color:var(--accent); }\r\n.topbar-nav a:hover, .topbar-nav a.active { color: var(--text-primary); background: var(--accent-glow); }\r\n\r\n.nav-dropdown { position: relative; }\r\n.nav-dropdown-btn { background: none; border: none; color: var(--text-secondary);\r\n    font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 500; padding: 6px 14px;\r\n    border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px;\r\n    transition: all 0.2s; white-space: nowrap; }\r\n.nav-dropdown-btn:hover, .nav-dropdown-btn.active { color: var(--text-primary); background: var(--accent-glow); }\r\n.nav-dropdown-caret { font-size: 10px; transition: transform 0.2s; }\r\n.nav-dropdown.open .nav-dropdown-caret { transform: rotate(180deg); }\r\n.nav-dropdown-menu { display: none; position: absolute; top: 100%; left: 0; margin-top: 6px;\r\n    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;\r\n    box-shadow: var(--shadow); min-width: 210px; padding: 6px; z-index: 50; }\r\n.nav-dropdown.open .nav-dropdown-menu { display: block; }\r\n.nav-dropdown-menu a { display: block; padding: 8px 12px; border-radius: 6px;\r\n    color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; }\r\n.nav-dropdown-menu a:hover, .nav-dropdown-menu a.active { color: var(--text-primary); background: var(--accent-glow); }\r\n\r\n/* Ноутбучная ширина: меню остаётся полным, просто становится компактнее. */\r\n@media (max-width: 1500px) {\r\n    .topbar { padding-left: 20px; padding-right: 20px; }\r\n    .topbar-nav { gap: 3px; }\r\n    .topbar-nav a, .nav-dropdown-btn { padding-left: 9px; padding-right: 9px; font-size: 12px; }\r\n    .topbar-nav .topbar-icon-link { width: 32px; height: 32px; padding: 0; flex-basis: 32px; }\r\n}\r\n\r\n/* Только телефонная ширина: полная строка физически не помещается, поэтому\r\n   здесь остаётся раскрывающаяся панель. */\r\n@media (max-width: 820px) {\r\n    .topbar { position: relative; flex-wrap: wrap; gap: 10px; padding: 13px 18px; }\r\n    .topbar-menu-toggle { display: inline-flex; }\r\n    .topbar-nav { display: none; flex: 1 0 100%; flex-direction: column; align-items: stretch;\r\n        gap: 4px; padding-top: 8px; border-top: 1px solid var(--border); }\r\n    .topbar.menu-open .topbar-nav { display: flex; }\r\n    .topbar-nav \u003E a, .nav-dropdown-btn { width: 100%; justify-content: space-between;\r\n        text-align: left; padding: 9px 11px; }\r\n    .nav-dropdown-menu { position: static; margin: 4px 0 2px; box-shadow: none;\r\n        background: var(--bg-input); }\r\n    .topbar-nav .theme-toggle, .topbar-nav .btn { align-self: flex-start; margin-top: 4px; }\r\n}\r\n\r\n/* ======================================================================\r\n   ЧИСЛОВЫЕ СТОЛБЦЫ: ЗАГОЛОВОК ПО ПРАВОМУ КРАЮ\r\n   ======================================================================\r\n   Класс .num выравнивает содержимое ячейки вправо, но у заголовков он не\r\n   срабатывал: правило вида «table.data-table th { text-align: left }» в\r\n   страницах имеет специфичность выше одиночного класса и перебивало его.\r\n   Подпись столбца оставалась слева, значения стояли справа.\r\n\r\n   На узком экране столбцы тесные, и разрыв в глаза не бросался. На широком\r\n   заголовок и числа расходились на половину столбца, и таблица читалась как\r\n   съехавшая. Правило ниже поднимает специфичность до уровня страничных.\r\n   ====================================================================== */\r\ntable.data-table th.num,\r\ntable.data-table thead th.num,\r\ntable th.num {\r\n    text-align: right;\r\n}\r\n\r\n/* ======================================================================\r\n   ПЕРЕСТАНОВКА KPI-БЛОКОВ (js/kpi_order.js)\r\n   ======================================================================\r\n   Ручка, а не вся карточка: если карточку сделать draggable насовсем,\r\n   браузер запрещает выделять текст внутри, а цифры из KPI копируют. По\r\n   умолчанию ручка почти прозрачная - на дашборде она нужна раз в месяц.\r\n   ====================================================================== */\r\n.kpi-orderable \u003E [data-kpi-key] { position: relative; }\r\n\r\n.kpi-drag-handle {\r\n    position: absolute; top: 4px; right: 6px; z-index: 3;\r\n    width: 16px; height: 16px; line-height: 16px; text-align: center;\r\n    font-size: 13px; color: var(--text-muted);\r\n    cursor: grab; opacity: 0; transition: opacity 0.15s;\r\n    user-select: none;\r\n}\r\n.kpi-orderable \u003E [data-kpi-key]:hover .kpi-drag-handle,\r\n.kpi-drag-handle:focus-visible { opacity: 0.85; }\r\n.kpi-drag-handle:active { cursor: grabbing; }\r\n.kpi-drag-handle:focus-visible { outline: 1px solid var(--accent); border-radius: 3px; }\r\n\r\n/* Карточка под курсором остаётся видимой, но приглушённой: так понятно, какую\r\n   именно тащат, когда остальные разъезжаются. */\r\n.kpi-orderable \u003E [data-kpi-key].kpi-dragging { opacity: 0.45; }\r\n.kpi-orderable.kpi-dragging-active \u003E [data-kpi-key] { transition: transform 0.12s; }\r\n\r\n/* Пока тащим, подписи внутри карточек не должны перехватывать события: иначе\r\n   dragover приходит от вложенного текста и цель определяется через closest\r\n   лишний раз. */\r\n.kpi-orderable.kpi-dragging-active \u003E [data-kpi-key] * { pointer-events: none; }\r\n\r\n.kpi-order-reset {\r\n    font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600;\r\n    background: none; border: 1px solid var(--border); border-radius: 6px;\r\n    color: var(--text-muted); cursor: pointer; padding: 3px 9px;\r\n}\r\n.kpi-order-reset:hover { border-color: var(--accent); color: var(--text-primary); }\r\n\r\n/* Ряд с кнопкой сброса там, где над блоком KPI нет заголовка (клиентский\r\n   дашборд). Пустой ряд ничего не занимает: отступ висит на самой кнопке. */\r\n.kpi-order-bar { display: flex; justify-content: flex-end; }\r\n.kpi-order-bar .kpi-order-reset { margin-bottom: 8px; }\r\n","css/service_panels.css":"/*\r\n * Панели сервисов: один вид в нашем разделе и в кабинете клиента.\r\n *\r\n * Раньше находки по отзывам рисовались двумя независимыми кусками разметки -\r\n * в `reviews.php` и в `client_dashboard.php`, - и расходились при каждой правке:\r\n * у нас список в двести тридцать пикселей с кнопками, у клиента карточки с\r\n * цитатами. Одни и те же данные выглядели как два разных продукта.\r\n *\r\n * Теперь вид живёт здесь, а разметку собирает `js/service_panels.js`.\r\n * Цвета берутся из переменных темы, поэтому файл одинаково работает и на\r\n * тёмном кабинете клиента, и на светлом внутреннем разделе.\r\n */\r\n\r\n.trend-list {\r\n    display: grid;\r\n    gap: 10px;\r\n    max-height: 320px;\r\n    overflow-y: auto;\r\n    padding-right: 4px;\r\n}\r\n\r\n.trend-card {\r\n    padding: 12px 14px;\r\n    border-radius: 10px;\r\n    background: var(--glass, var(--bg-card, transparent));\r\n    border: 1px solid var(--glass-border, var(--border, rgba(128,128,128,.2)));\r\n}\r\n\r\n/* Находка, которая больше не подтверждается: видно, но не кричит. */\r\n.trend-card.is-stale { opacity: .72; }\r\n\r\n.trend-title {\r\n    font-size: 13.5px;\r\n    font-weight: 700;\r\n    margin-bottom: 6px;\r\n    line-height: 1.4;\r\n}\r\n\r\n.trend-num {\r\n    font-size: 12.5px;\r\n    color: var(--text-3, var(--text-muted, #888));\r\n    line-height: 1.6;\r\n}\r\n\r\n/* Кратность показываем только когда она заметна - иначе это просто шум. */\r\n.trend-rate {\r\n    margin-left: 8px;\r\n    padding: 1px 7px;\r\n    border-radius: 20px;\r\n    font-weight: 700;\r\n    color: var(--red, #e5484d);\r\n    border: 1px solid rgba(229, 72, 77, .4);\r\n}\r\n\r\n.trend-quote {\r\n    margin-top: 8px;\r\n    font-size: 12.5px;\r\n    line-height: 1.6;\r\n    font-style: italic;\r\n    opacity: .85;\r\n}\r\n\r\n.trend-meta {\r\n    margin-top: 8px;\r\n    font-size: 11.5px;\r\n    line-height: 1.6;\r\n    color: var(--text-3, var(--text-muted, #888));\r\n}\r\n\r\n.trend-acts {\r\n    margin-top: 10px;\r\n    display: flex;\r\n    gap: 8px;\r\n    flex-wrap: wrap;\r\n}\r\n\r\n.trend-empty {\r\n    font-size: 13px;\r\n    color: var(--text-3, var(--text-muted, #888));\r\n    padding: 8px 0;\r\n}\r\n\r\n/* Естественный эксперимент: провал давления и что было вокруг него. */\r\n.exp-block { margin-top: 16px; padding: 16px 18px; border-radius: 12px;\r\n    background: var(--glass, var(--bg-card, transparent));\r\n    border: 1px solid var(--glass-border, var(--border, rgba(128,128,128,.2))); }\r\n.exp-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }\r\n.exp-title { font-size: 15px; font-weight: 700; }\r\n.exp-badge { font-size: 11.5px; padding: 2px 9px; border-radius: 20px;\r\n    color: var(--text-3, var(--text-muted, #888));\r\n    border: 1px solid var(--glass-border, var(--border, rgba(128,128,128,.2))); }\r\n.exp-intro { font-size: 13px; line-height: 1.7; color: var(--text-3, var(--text-muted, #888));\r\n    margin-bottom: 14px; }\r\n.exp-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));\r\n    gap: 12px; margin-bottom: 14px; }\r\n.exp-card { padding: 12px 14px; border-left: 3px solid var(--glass-border, rgba(128,128,128,.2));\r\n    background: var(--glass-hover, transparent); }\r\n.exp-good { border-left-color: var(--green, #22c55e); }\r\n.exp-accent { border-left-color: var(--accent, #7c5cfc); }\r\n.exp-warn { border-left-color: var(--yellow, #f59e0b); }\r\n.exp-label { font-size: 12px; color: var(--text-3, var(--text-muted, #888)); }\r\n.exp-value { font-size: 22px; font-weight: 700; margin: 2px 0; }\r\n.exp-note { font-size: 11.5px; line-height: 1.5; color: var(--text-3, var(--text-muted, #888)); }\r\n.exp-chart { height: 180px; margin-bottom: 14px; }\r\n.exp-line { font-size: 13px; line-height: 1.7; padding: 8px 0 8px 14px;\r\n    border-left: 3px solid var(--glass-border, rgba(128,128,128,.2)); margin-bottom: 4px; }\r\n.exp-line-good { border-left-color: var(--green, #22c55e); }\r\n.exp-line-warn { border-left-color: var(--yellow, #f59e0b); }\r\n/* Главный вывод эпизода: первое, что читают. */\r\n.exp-headline { font-size: 14.5px; line-height: 1.6; font-weight: 700; margin-bottom: 10px; }\r\n","css/design-fresh.css":"/* ICOMBOOST 2026 visual layer. Remove data-design=\"fresh\" to restore the original UI. */\r\n.design-toggle{position:fixed;right:18px;bottom:18px;z-index:500;display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:7px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg-input);color:var(--text-primary);font:700 11px Manrope,sans-serif;white-space:nowrap;cursor:pointer}\r\n.design-toggle:hover{border-color:var(--accent)}\r\n.design-planets{display:none}\r\n\r\nhtml[data-design=\"fresh\"]{\r\n    --bg-primary:#f8f6f1;--bg-page:#f8f6f1;--bg-card:#fffefa;--bg-card-hover:#fff9f4;--bg-input:#f2efe9;\r\n    --border:#e9e3dd;--border-focus:#eb6d55;--glass:#fffefa;--glass-border:#e9e3dd;--glass-hover:#fff9f4;\r\n    --text-primary:#28232a;--text-secondary:#655e65;--text-muted:#898188;--text-3:#898188;\r\n    --accent:#e96852;--accent-glow:#ffebe4;--green:#237f65;--green-bg:#e3f2e9;\r\n    --red:#ce6054;--red-bg:#fff0ec;--yellow:#ad762e;--yellow-bg:#fff0d9;\r\n    --blue:#8768bf;--blue-bg:#eee8f7;--radius:16px;--radius-sm:11px;\r\n    --shadow:0 14px 35px rgba(75,57,43,.08);--glow-color:transparent;\r\n    --chart-grid:rgba(75,57,43,.08);--chart-grid2:rgba(75,57,43,.08);--chart-grid-soft:rgba(75,57,43,.05);\r\n    --gradient-brand:linear-gradient(120deg,#e96852,#bb68a9);\r\n    color-scheme:light;\r\n}\r\nhtml[data-design=\"fresh\"] body{background:#f8f6f1;color:var(--text-primary);padding-left:238px;font-family:Manrope,Arial,sans-serif}\r\nhtml[data-design=\"fresh\"] body.login-body{padding-left:0;background:radial-gradient(circle at 78% 18%,#ffcfbf 0 12%,transparent 33%),radial-gradient(circle at 15% 80%,#e5e9c6 0 10%,transparent 32%),#f8f6f1}\r\nhtml[data-design=\"fresh\"] .login-card{border:1px solid #e9e3dd;border-radius:24px;background:#fffefa;box-shadow:0 24px 60px rgba(74,51,41,.10)}\r\nhtml[data-design=\"fresh\"] .login-logo{font-family:Manrope,Arial,sans-serif;letter-spacing:-.07em}\r\nhtml[data-design=\"fresh\"] .login-logo .logo-boost{color:#e96852}\r\nhtml[data-design=\"fresh\"] .login-sub{color:#736a70}\r\nhtml[data-design=\"fresh\"] .form-input{background:#f7f3ed;border-color:#e9e3dd;border-radius:11px}\r\nhtml[data-design=\"fresh\"] .btn-login{background:#e96852;border-radius:11px}\r\nhtml[data-design=\"fresh\"] .theme-toggle-float{display:none}\r\nhtml[data-design=\"fresh\"] body.login-body\u003E.design-toggle{background:#fffefa;border-color:#e9e3dd;color:#4d4348}\r\nhtml[data-design=\"fresh\"] body::before{display:none}\r\nhtml[data-design=\"fresh\"] *{scrollbar-color:#d7cdc7 transparent}\r\n\r\n/* Navigation becomes a compact workbench. Page routes and role checks remain in topbar.php. */\r\nhtml[data-design=\"fresh\"] .topbar{position:fixed;left:0;top:0;bottom:0;z-index:200;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:0;width:238px;height:100vh;padding:26px 14px 15px;background:#f0ece5;border-right:1px solid #e4ddd5;border-bottom:0;overflow:hidden}\r\nhtml[data-design=\"fresh\"] .topbar-logo{display:flex;align-items:center;gap:2px;min-height:42px;margin:0 8px 24px;font-family:Manrope,Arial,sans-serif;font-weight:800;font-size:20px;letter-spacing:-.065em}\r\nhtml[data-design=\"fresh\"] .topbar-logo .logo-mark{width:35px;height:35px;min-width:35px;margin-right:7px;border-radius:11px;background-color:#28232a;transform:rotate(-8deg)}\r\nhtml[data-design=\"fresh\"] .topbar-logo .logo-boost{color:#e96852}\r\nhtml[data-design=\"fresh\"] .topbar-nav{display:flex;flex:1;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;width:100%;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:3px}\r\nhtml[data-design=\"fresh\"] .topbar-nav\u003Ea:not(.topbar-icon-link),html[data-design=\"fresh\"] .nav-dropdown-menu a{display:flex;align-items:center;min-height:36px;padding:8px 11px;border-radius:11px;color:#655e65;font-size:11.5px;font-weight:700;line-height:1.25;white-space:normal}\r\nhtml[data-design=\"fresh\"] .topbar-nav\u003Ea:hover,html[data-design=\"fresh\"] .nav-dropdown-menu a:hover{background:#fffaf4;color:#28232a}\r\nhtml[data-design=\"fresh\"] .topbar-nav\u003Ea.active,html[data-design=\"fresh\"] .nav-dropdown-menu a.active{background:#28232a;color:#fffefa}\r\nhtml[data-design=\"fresh\"] .nav-dropdown{position:static;margin:8px 0 3px}\r\nhtml[data-design=\"fresh\"] .nav-dropdown::before{content:\"АНАЛИТИКА\";display:block;margin:0 11px 6px;color:#a29a98;font-size:9px;font-weight:800;letter-spacing:.16em}\r\nhtml[data-design=\"fresh\"] .nav-dropdown-btn{display:none}\r\nhtml[data-design=\"fresh\"] .nav-dropdown-menu{display:flex;position:static;flex-direction:column;gap:1px;min-width:0;padding:0;margin:0;background:transparent;border:0;border-radius:0;box-shadow:none}\r\nhtml[data-design=\"fresh\"] .topbar-nav .topbar-icon-link{display:flex;justify-content:flex-start;width:auto;height:36px;min-height:36px;padding:8px 11px;border:0;background:transparent;flex-basis:auto}\r\nhtml[data-design=\"fresh\"] .topbar-icon-link::after{content:\"Настройки\";margin-left:9px;font-size:11.5px;font-weight:700}\r\nhtml[data-design=\"fresh\"] .topbar-icon-link svg{width:16px;height:16px}\r\nhtml[data-design=\"fresh\"] .topbar-nav .topbar-icon-link.active{background:#28232a;color:#fffefa}\r\nhtml[data-design=\"fresh\"] .topbar-nav .theme-toggle{display:none}\r\nhtml[data-design=\"fresh\"] .topbar-nav .design-toggle{position:static;width:100%;min-height:36px;margin:12px 0 0;border-color:#d9d1c9;border-radius:10px;background:#fffefa;color:#554a50;font-size:11px}\r\nhtml[data-design=\"fresh\"] .topbar-nav .btn[onclick=\"doLogout()\"]{width:100%;min-height:34px;margin:2px 0 0;padding:7px 11px;border:0;background:transparent;color:#8b8388;text-align:left;font-size:11px}\r\n\r\n/* One palette and rhythm across modules; existing data markup remains intact. */\r\nhtml[data-design=\"fresh\"] :is(.page,.home-page){max-width:1520px;margin-inline:auto;padding:28px clamp(20px,3vw,48px) 75px}\r\nhtml[data-design=\"fresh\"] :is(.hero,.home-hero){position:relative;overflow:hidden;border:1px solid #f3d9d1;border-radius:23px;background:#ffebe4;box-shadow:none}\r\nhtml[data-design=\"fresh\"] :is(.hero-title,.home-hero h1,.hero h1){color:#28232a;font-family:Manrope,Arial,sans-serif;font-size:clamp(27px,2.8vw,40px);font-weight:800;letter-spacing:-.055em;line-height:1.15}\r\nhtml[data-design=\"fresh\"] :is(.home-panel h2,.home-capabilities h2,.chart-title,.tbl-title){font-family:Manrope,Arial,sans-serif;font-weight:800;letter-spacing:-.035em}\r\nhtml[data-design=\"fresh\"] .home-hero h1 span{background:none;color:#d75b47;-webkit-text-fill-color:#d75b47}\r\nhtml[data-design=\"fresh\"] .home-eyebrow{background:#fff8f4;color:#a64d3c;border:1px solid #f5d6cb}\r\nhtml[data-design=\"fresh\"] .home-hero-copy\u003Ep{color:#695960}\r\nhtml[data-design=\"fresh\"] .home-hero::before{background:radial-gradient(circle,#ffae96 0 48%,transparent 49%);width:360px;height:360px;right:-10px;top:15px;opacity:.82}\r\nhtml[data-design=\"fresh\"] .home-orbit{display:none}\r\nhtml[data-design=\"fresh\"] .home-focus,html[data-design=\"fresh\"] .home-period{border:1px solid #f0d5ca;background:#fffefa;box-shadow:0 15px 32px rgba(121,73,57,.14)}\r\nhtml[data-design=\"fresh\"] .home-focus strong{color:#d85b46}\r\nhtml[data-design=\"fresh\"] .design-planets{display:block;position:absolute;right:55px;top:15px;width:236px;height:236px;border:2px solid rgba(164,76,72,.32);border-radius:50%;pointer-events:none;z-index:0}\r\nhtml[data-design=\"fresh\"] .design-planets i{display:block;position:absolute;top:calc(50% - 17px);left:calc(50% - 17px);width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 4px #fff8f477,0 10px 22px #4379a866}\r\nhtml[data-design=\"fresh\"] .design-planets i:first-child{background:radial-gradient(circle at 30% 25%,#d4fff3 0 8%,#68cbb7 19%,#438ebd 49%,#234f9c 78%,#173462);animation:fresh-orbit-earth 14s linear infinite}\r\nhtml[data-design=\"fresh\"] .design-planets i:last-child{width:23px;height:23px;top:calc(50% - 11px);left:calc(50% - 11px);background:radial-gradient(circle at 30% 20%,#fff4bb,#fdb971 35%,#e66e64 80%,#a64765);box-shadow:0 0 0 4px #fff4dc8c,0 8px 20px #c8695c66;ani
